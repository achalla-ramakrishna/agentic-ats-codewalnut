spring:
  application:
    name: ats
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ats?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ats}
    password: ${DB_PASSWORD:ats}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      # Bulk résumé uploads send several files per request (the page sends them in small batches).
      max-request-size: 60MB
  # Google sign-in: set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (see
  # PaasEnvironmentPostProcessor). Without them the app starts with Google sign-in disabled.

server:
  # Railway (and most PaaS) inject PORT; TLS ends at their proxy, so trust X-Forwarded-*
  # to build https:// redirect URLs for Google sign-in.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
      timeout: 8h

ats:
  auth:
    allowed-domains: ${ATS_ALLOWED_DOMAINS:codewalnut.com}
    bootstrap-admins: ${ATS_BOOTSTRAP_ADMINS:}
    dev-login-enabled: false
    success-url: ${ATS_LOGIN_SUCCESS_URL:/}
    failure-url: ${ATS_LOGIN_FAILURE_URL:/login?error}
  # Admin updates (ADR-0018): moving a candidate into one of these stages sends admins a summary.
  admin-updates:
    stages: ${ATS_ADMIN_UPDATE_STAGES:SHORTLISTED,OFFER_SENT,JOINED}
  # WhatsApp Business API (Meta Cloud API). All optional: without a token and phone number id,
  # "WhatsApp" opens WhatsApp with the message ready and the recruiter presses Send.
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:candidate_message}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    # Incoming replies: Meta's webhook verify token and app secret (signature check).
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
  # Footer on CodeWalnut-branded résumés (ADR-0012).
  branding:
    resume-footer: ${ATS_RESUME_FOOTER:Presented by Code Walnut | Staffing enquiries through Code Walnut}
  # Résumé reading runs in the background, this many at a time (ADR-0010).
  ai:
    async: true
    workers: ${ATS_AI_WORKERS:3}
  # Coding questions run in a self-hosted Judge0 sandbox (ADR-0016, docs/deploy-judge0.md).
  # Unset: coding questions can be written but not run or graded.
  coding:
    runner-url: ${ATS_CODE_RUNNER_URL:}
    runner-token: ${ATS_CODE_RUNNER_TOKEN:}
    async: true

---
# Local development only, never on by default: same MySQL, plus fake seed users and the
# password-less dev login. Enable with -Dspring-boot.run.profiles=dev.
spring:
  config:
    activate:
      on-profile: dev

server:
  servlet:
    session:
      cookie:
        secure: false

ats:
  auth:
    allowed-domains: codewalnut.com,codewalnut.test
    dev-login-enabled: true

---
# Shared preview (e.g. Railway before Google sign-in is set up): fake seed users and the
# dev login, protected by a shared access code. Enable with SPRING_PROFILES_ACTIVE=demo and
# ATS_DEMO_ACCESS_CODE (12+ characters; the app refuses to start without it).
# Only fake data belongs in a demo.
spring:
  config:
    activate:
      on-profile: demo

ats:
  auth:
    allowed-domains: ${ATS_ALLOWED_DOMAINS:codewalnut.com},codewalnut.test
    dev-login-enabled: true
    demo-access-code: ${ATS_DEMO_ACCESS_CODE:}
