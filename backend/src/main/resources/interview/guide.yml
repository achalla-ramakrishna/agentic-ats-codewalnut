categories:
- id: problem-solving
  name: Problem solving and aptitude
  intro: Ask these aloud, with paper allowed. You are scoring the reasoning, so ask the candidate to think out loud. Follow up with "How would
    you check you're right?"
  questions:
  - level: F
    topic: Puzzles
    question: You have 8 identical-looking balls; one is heavier. With a balance scale, what is the fewest weighings to find it?
    strong: '2: split 3-3-2, weigh 3 vs 3, then 1 vs 1 within the heavier group (or the 2).'
    redFlags: Says 3 by halving; can't explain why thirds beat halves.
  - level: F
    topic: Estimation
    question: Estimate how many two-wheelers are sold in India in a month.
    strong: States assumptions (population, households, replacement cycle), does round arithmetic, sanity-checks the result (about 1.5–2 million).
    redFlags: Guesses a number with no method, or refuses.
  - level: F
    topic: Arithmetic
    question: A train covers a distance at 60 km/h and returns at 40 km/h. What is the average speed?
    strong: 48 km/h, using total distance over total time; explains why it isn't 50.
    redFlags: Answers 50 and doesn't reconsider when asked.
  - level: F
    topic: Ownership
    question: You can't finish a task by its deadline. What do you do on the day you notice?
    strong: Raises it early, gives options (scope cut, extra help, new date), quantifies the gap.
    redFlags: Waits and hopes, or only raises it on the due date.
  - level: J
    topic: Debugging
    question: Your login page is slow for 5% of users. List what could cause it, most likely first.
    strong: Groups causes (network or region, a slow dependency, one big tenant, cold cache) and says what data would tell them apart.
    redFlags: Lists random fixes without asking what's different about the 5%.
  - level: S
    topic: Judgement
    question: Two teammates disagree on an approach and the release is in two days. How do you decide?
    strong: Clarifies the goal and the constraint, compares on risk and reversibility, time-boxes, picks and records why.
    redFlags: Avoids the decision, or decides by seniority alone.
  - level: F
    topic: Puzzles
    question: Two ropes each burn in exactly 60 minutes, unevenly. How do you measure 45 minutes?
    strong: Light rope A at both ends and rope B at one end; when A finishes (30 min) light B's other end; it finishes 15 minutes later.
    redFlags: Tries to measure lengths, or gives up without trying ends.
  - level: F
    topic: Arithmetic
    question: A shirt is marked up 20% and then discounted 20%. Is the final price higher, lower or the same as the original?
    strong: 'Lower by 4%: 1.2 × 0.8 = 0.96; explains that the discount applies to a bigger number.'
    redFlags: Says "the same" and sticks to it.
  - level: F
    topic: Logic
    question: Every developer here knows Git. Ravi knows Git. Is Ravi a developer?
    strong: 'Not necessarily: the statement only goes one way (affirming the consequent).'
    redFlags: Says yes without noticing the logic gap.
  - level: F
    topic: Estimation
    question: How many lines of code do you think a typical food-delivery app has, front end and back end together? How would you check?
    strong: Breaks it into apps, services and screens; gives a range (hundreds of thousands); suggests counting a comparable open-source project.
    redFlags: A single number with no breakdown.
  - level: F
    topic: Patterns
    question: 'What comes next: 2, 6, 12, 20, 30, …? Explain the rule.'
    strong: '42: n(n + 1), or differences 4, 6, 8, 10, 12.'
    redFlags: Guesses without stating a rule.
  - level: F
    topic: Learning
    question: Tell me about something technical you taught yourself recently. How did you learn it?
    strong: Specific topic, concrete steps (docs, small project, debugging), what they built, what was hard.
    redFlags: Vague ("I watched videos"), nothing built.
  - level: J
    topic: Debugging
    question: A nightly job that used to take 10 minutes now takes 2 hours. Nothing in its code changed. Where do you look?
    strong: Data volume growth, missing index or changed query plan, a slower dependency, contention with another job, resource limits; compares
      metrics before and after.
    redFlags: Starts rewriting the job, or blames the server without data.
  - level: J
    topic: Prioritising
    question: You have a production bug, a demo for a client tomorrow and a teammate blocked on your review. In what order, and why?
    strong: 'Assesses impact and urgency: production bug severity first if users are hurt, unblock the teammate quickly (15 minutes), then the
      demo; communicates trade-offs.'
    redFlags: Picks by personal preference; no communication.
  - level: J
    topic: Estimation
    question: How would you estimate how long a new "export to Excel" feature will take?
    strong: Breaks it into tasks (API, formatting, large data, permissions, tests), compares with similar past work, adds a buffer for unknowns,
      gives a range.
    redFlags: A single number with no breakdown, or refuses to estimate.
  - level: J
    topic: Root cause
    question: Users say "the app is broken". What questions do you ask first?
    strong: Who, since when, which device or browser, exact steps and message, how many users; checks logs and recent deploys.
    redFlags: Starts fixing without reproducing.
  - level: J
    topic: Trade-offs
    question: Your manager asks for a feature by Friday; doing it properly takes two weeks. What do you propose?
    strong: Clarifies the real need, offers a smaller version by Friday with known gaps and a plan for the rest, flags risks in writing.
    redFlags: Says yes and cuts quality silently, or just says no.
  - level: J
    topic: Communication
    question: Explain to a non-technical client why their "small change" will take a week.
    strong: Plain language, a concrete analogy, what makes it bigger (testing, data, side effects), options to make it smaller.
    redFlags: Jargon, or blames the code base.
  - level: S
    topic: Ambiguity
    question: A client asks to "make the app faster". How do you turn that into work you can plan?
    strong: Asks which screens and users, measures (p95 times, Core Web Vitals, API latency), sets targets, picks the highest-impact fixes, reports
      progress against numbers.
    redFlags: Starts optimising random code with no baseline.
  - level: S
    topic: Incident
    question: Production is down at 9 pm. You are the senior on call. Walk me through your first 15 minutes.
    strong: Acknowledge and open a channel, check dashboards and recent changes, roll back if a deploy is likely, communicate status regularly,
      find root cause later in a blameless review.
    redFlags: Debugs alone silently; tries risky fixes before restoring service.
  - level: S
    topic: Decisions
    question: When would you choose to build something yourself rather than buy or use an open-source library?
    strong: Core differentiator vs commodity, cost of ownership, licence, maturity and community, security, team skills, exit plan.
    redFlags: Always builds, or always buys, without reasons.
  - level: S
    topic: Mentoring
    question: A junior developer keeps submitting large pull requests with bugs. What do you do?
    strong: Pairs on breaking work down, agrees on smaller PRs and tests, gives specific feedback, checks in regularly, praises improvement.
    redFlags: Rewrites their code or complains to the manager first.
  - level: S
    topic: Risk
    question: You must migrate a live database table with 200 million rows to a new schema. How do you plan it?
    strong: 'Expand and contract: add new columns or table, dual-write, backfill in batches, verify, switch reads, then remove the old; rollback
      plan and monitoring.'
    redFlags: One big ALTER during the day; no rollback plan.
  - level: S
    topic: Influence
    question: How do you convince a team to adopt a practice you believe in, such as code reviews or automated tests?
    strong: Starts with the problem it solves, pilots on one piece, shows data, makes it easy, listens to objections.
    redFlags: Imposes it by authority.
  - level: S
    topic: Estimation
    question: How many servers would you need to handle 10,000 requests per second for a simple API? Show your working.
    strong: Estimates per-request cost (say 20 ms CPU), throughput per core, adds headroom (50%) and redundancy across zones; states assumptions
      and says to load-test.
    redFlags: A number with no assumptions.
  - level: J
    topic: Logic
    question: You have 3 boxes labelled "apples", "oranges" and "mixed", all labelled wrongly. You may take one fruit from one box. How do you
      fix all labels?
    strong: 'Pick from "mixed": it holds only one kind, say apples; then "oranges" must be mixed and "apples" must be oranges.'
    redFlags: Picks from a single-fruit box and gets stuck.
  - level: F
    topic: Attention to detail
    question: How many times does the digit 1 appear when you write the numbers 1 to 100?
    strong: '21: units place 10 (1, 11, …, 91), tens place 10 (10–19), plus 100.'
    redFlags: Answers quickly without checking, e.g. 20.
  - level: J
    topic: Teamwork
    question: Tell me about a time you disagreed with a teammate's technical decision. What happened?
    strong: Specific situation, how they raised it with data, listened, reached a decision, what they learned.
    redFlags: No example, or the story ends with "I was right".
- id: dsa-freshers
  name: Data structures for freshers and interns
  intro: 'For interns and freshers, data structures are the main signal. Spend about 25 of 60 minutes here: 3–4 concept questions, 2 "know your
    language" questions in the language on their résumé, then one live coding problem. For campus drives, run a 15-minute screen: one concept
    question, one language question, one easy coding problem (pass = working code and one edge case named without a prompt).'
  questions:
  - level: F
    topic: Big-O
    question: What is the time complexity of searching an unsorted array, a sorted array, and a hash table? Why?
    strong: O(n); O(log n) with binary search; O(1) average and O(n) worst for a hash table, with the reason for each.
    redFlags: Memorised answers with no reason; calls binary search O(1).
  - level: F
    topic: Arrays and linked lists
    question: When is a linked list better than an array?
    strong: Insert or delete at a known node is O(1); arrays win on index access and cache locality; in practice arrays are the default.
    redFlags: Says linked lists are "faster" without saying for what.
  - level: F
    topic: Stacks and queues
    question: Give one real use of a stack and one of a queue.
    strong: Undo, function calls, bracket matching; print jobs, BFS, request queues.
    redFlags: Mixes up LIFO and FIFO.
  - level: F
    topic: Hashing
    question: How does a hash map find a key, and what is a collision?
    strong: Hash, then bucket, then compare keys; chaining or open addressing; resizing at a load factor.
    redFlags: Thinks every key gets its own unique slot.
  - level: F
    topic: Recursion
    question: Write factorial recursively. What happens for n = 100,000?
    strong: Base case, call stack, stack overflow, and an iterative version.
    redFlags: Forgets the base case.
  - level: F
    topic: Trees
    question: Binary tree vs binary search tree; what are in-order, pre-order and post-order traversals?
    strong: The BST ordering rule; in-order gives sorted output for a BST; can traverse a small tree on paper.
    redFlags: Can't traverse a 5-node tree on paper.
  - level: F
    topic: Heaps
    question: How would you get the 3 largest numbers out of a million numbers?
    strong: A min-heap of size 3, O(n log k); or a partial sort.
    redFlags: Sorts the whole list without knowing the cost.
  - level: F
    topic: Graphs
    question: 'BFS vs DFS: which finds the shortest path in an unweighted graph, and why?'
    strong: BFS, because it explores level by level; DFS for exploring and cycle detection; a visited set.
    redFlags: Doesn't mark nodes visited and loops forever.
  - level: F
    topic: Sorting
    question: Which sort would you use and why? What does your language's built-in sort use?
    strong: O(n log n) sorts, stability; the built-in is the right default (TimSort, dual-pivot quicksort, introsort).
    redFlags: Writes bubble sort for real code.
  - level: F
    topic: Choosing structures
    question: Store students to look up by roll number and also list them sorted by name. Which structures?
    strong: A hash map by roll number plus a sorted list or tree by name, with the trade-off explained.
    redFlags: One list for everything with linear search.
  - level: F
    topic: Know your language
    question: 'ArrayList vs LinkedList vs ArrayDeque: which for a stack, a queue and random access?'
    strong: ArrayDeque for stack and queue, ArrayList for random access; avoids the legacy Stack class.
    redFlags: Uses Vector or Stack by default.
    language: Java
  - level: F
    topic: Know your language
    question: Why must you override hashCode when you override equals for a HashMap key?
    strong: Equal objects must land in the same bucket; otherwise get() misses the entry.
    redFlags: Doesn't know the contract.
    language: Java
  - level: F
    topic: Know your language
    question: How do you make a min-heap and a max-heap in Java?
    strong: PriorityQueue, and PriorityQueue with Comparator.reverseOrder().
    redFlags: Writes a heap from scratch for every problem.
    language: Java
  - level: F
    topic: Know your language
    question: 'list vs deque for a queue in Python: which and why?'
    strong: list.pop(0) is O(n); collections.deque gives O(1) at both ends.
    redFlags: Uses list.pop(0) in a BFS.
    language: Python
  - level: F
    topic: Know your language
    question: How do you get a heap and a max-heap in Python?
    strong: heapq is a min-heap; push negated values or tuples for a max-heap.
    redFlags: Sorts the list after every insert.
    language: Python
  - level: F
    topic: Know your language
    question: 'dict vs set vs Counter vs defaultdict: when do you use each?'
    strong: Key-value vs membership vs counting vs default values.
    redFlags: Writes manual counting loops with key checks everywhere.
    language: Python
  - level: F
    topic: Know your language
    question: 'Object vs Map vs Set in JavaScript: which for a frequency count and why?'
    strong: Map keeps insertion order and allows any key type; Set for uniqueness; objects turn keys into strings.
    redFlags: Uses arrays with indexOf for lookups.
    language: JavaScript
  - level: F
    topic: Know your language
    question: What is the cost of array.shift() and array.includes()?
    strong: O(n) each; use an index pointer for queues and a Set for membership.
    redFlags: Uses shift() in a BFS over large input.
    language: JavaScript
  - level: F
    topic: Know your language
    question: Why does [10, 9, 1].sort() give [1, 10, 9]?
    strong: The default sort compares strings; pass (a, b) => a - b.
    redFlags: Has never noticed.
    language: JavaScript
  - level: F
    topic: Know your language
    question: vector vs list vs deque; map vs unordered_map in C++.
    strong: Contiguous vs node-based; ordered O(log n) tree vs hashed O(1) average.
    redFlags: Uses map everywhere without knowing it's a tree.
    language: C++
  - level: F
    topic: Know your language
    question: How do you make a min-heap with priority_queue?
    strong: priority_queue<int, vector<int>, greater<int>>.
    redFlags: Only knows the default max-heap.
    language: C++
  - level: F
    topic: Know your language
    question: What happens to iterators when you push_back into a vector?
    strong: It may reallocate and invalidate iterators, pointers and references.
    redFlags: Keeps iterators across inserts.
    language: C++
  - level: F
    topic: Trees
    question: What is a binary search tree, and what happens if you insert sorted numbers into it?
    strong: Left smaller, right larger; sorted inserts make it a linked list with O(n) search; balanced trees fix that.
    redFlags: Can't describe the ordering rule.
  - level: F
    topic: Traversal
    question: What order do you get from an in-order traversal of a BST?
    strong: Sorted order; pre-order and post-order are different and have their uses.
    redFlags: Doesn't know traversals.
  - level: F
    topic: Heaps
    question: What is a heap, and what is it used for?
    strong: A tree where each parent is smaller (min-heap); O(log n) insert and remove-min; priority queues, top-k.
    redFlags: Confuses it with heap memory.
  - level: F
    topic: Graphs
    question: How would you represent a friendship network in code?
    strong: Adjacency list (map from person to friends) for sparse graphs; matrix for dense; BFS for degrees of separation.
    redFlags: A 2D array for a million users.
  - level: F
    topic: BFS vs DFS
    question: When would you use breadth-first search instead of depth-first search?
    strong: BFS for shortest path in unweighted graphs; DFS for exploring all paths, cycles, topological order.
    redFlags: Thinks they're interchangeable.
  - level: F
    topic: Sorting
    question: Name a stable sorting algorithm. Why does stability matter?
    strong: Merge sort (or TimSort); equal items keep their order, e.g. sort by date then by name.
    redFlags: Doesn't know what stable means.
  - level: F
    topic: Binary search
    question: Find the first position of a number in a sorted array with duplicates.
    strong: Binary search that continues left when found; careful with mid and bounds; O(log n).
    redFlags: Linear scan after finding any match.
  - level: F
    topic: Two pointers
    question: Check whether a string is a palindrome, ignoring spaces and case.
    strong: Two pointers from both ends skipping non-letters, comparing lower-case; O(n), O(1) extra.
    redFlags: Builds reversed copies without considering cost.
- id: live-coding
  name: DSA and live coding
  intro: 'Give one problem in 20–25 minutes in the candidate''s language. Score four things: understanding (asks about inputs and edge cases),
    approach (states it and its complexity before coding), code (correct, readable), testing (walks through an example and an edge case unprompted).
    Freshers: a working brute force first, then improve it. Seniors: the efficient version straight away, then follow-ups. If they took a coding
    test, ask them to walk through their submitted code and improve it.'
  questions:
  - level: F
    topic: Strings
    question: 'Reverse the words in a sentence. Follow-ups: without split()? Multiple spaces? In place on a char array?'
    strong: Handles spaces, explains O(n).
    redFlags: Can't write the loop without the built-in.
  - level: F
    topic: Arrays
    question: 'Find the second largest number in an array. Follow-ups: all equal? Negative numbers? One pass?'
    strong: One pass with two variables; asks about duplicates.
    redFlags: Sorts and returns arr[n-2] without thinking about duplicates.
  - level: F
    topic: Stacks
    question: 'Check if the brackets in a string are balanced: ()[]{}. Follow-up: why a stack?'
    strong: A stack, early exit on mismatch, an empty-stack check at the end.
    redFlags: Only counts brackets, so "([)]" passes.
  - level: J
    topic: Hashing
    question: 'Two sum: return the indices of two numbers that add up to a target. Follow-ups: O(n)? Sorted input? All pairs?'
    strong: A hash map in one pass; mentions the same-element trap.
    redFlags: Stays with nested loops after a hint.
  - level: J
    topic: Sliding window
    question: 'Longest substring without repeating characters. Follow-up: why does the window''s left edge never move back?'
    strong: A window with a last-seen map, O(n).
    redFlags: Recomputes every substring (O(n³)).
  - level: J
    topic: Sorting
    question: 'Merge overlapping intervals. Follow-ups: already sorted? A stream of intervals? Touching ends?'
    strong: Sort by start, one pass, clear about [1,3] and [3,5].
    redFlags: Compares every pair; misses nested intervals.
  - level: S
    topic: Graphs
    question: 'Number of islands in a grid. Follow-ups: recursion depth on a 1000×1000 grid? Island sizes?'
    strong: BFS or iterative DFS, marks visited, talks about stack overflow.
    redFlags: Recursion with no thought about depth; re-visits cells.
  - level: S
    topic: Design
    question: 'Design an LRU cache with O(1) get and put. Follow-ups: thread safety? TTL on entries?'
    strong: A hash map plus a doubly linked list (or LinkedHashMap), and why both.
    redFlags: A list scanned for the oldest entry.
  - level: F
    topic: Strings
    question: 'Reverse the words in a sentence, keeping each word''s letters in order: "I love Java" → "Java love I". Then handle extra spaces.'
    strong: Splits on whitespace, reverses, joins; handles leading, trailing and repeated spaces; O(n).
    redFlags: Reverses characters; ignores spaces.
  - level: F
    topic: Arrays
    question: Find the second largest distinct number in an array in one pass.
    strong: Tracks first and second; handles duplicates and arrays with fewer than two distinct values.
    redFlags: Sorts and takes index 1, missing duplicates.
  - level: F
    topic: Counting
    question: Given a string, print the first character that doesn't repeat.
    strong: Counts with a map or array of 26, then a second pass in order; O(n).
    redFlags: Nested loops with no discussion of cost.
  - level: F
    topic: Math
    question: Check whether a number is a palindrome without converting it to a string.
    strong: Reverses digits arithmetically, compares; handles negatives and overflow.
    redFlags: Can't do it without strings; no edge cases.
  - level: F
    topic: Simulation
    question: FizzBuzz, then change it so the rules (3 → Fizz, 5 → Buzz, 7 → Bazz) come from a list.
    strong: Clean loop, then a data-driven version with an ordered list of (divisor, word).
    redFlags: Copy-paste if-else chains for the second part.
  - level: J
    topic: Hashing
    question: Group a list of words into anagrams.
    strong: Key by sorted letters or a 26-count signature, map to lists; O(n · k log k) or O(n · k).
    redFlags: Compares every pair.
  - level: J
    topic: Two pointers
    question: Given a sorted array, remove duplicates in place and return the new length.
    strong: Write pointer and read pointer; O(n), O(1) extra; explains why sorting matters.
    redFlags: Creates a new array or set without noticing "in place".
  - level: J
    topic: Sliding window
    question: Find the longest substring without repeating characters.
    strong: Window with last-seen positions; moves left past repeats; O(n).
    redFlags: Checks every substring.
  - level: J
    topic: Stacks
    question: 'Check whether brackets in a string are balanced: ()[]{}.'
    strong: Stack of openers, match on closers, empty at the end; handles stray closers.
    redFlags: Counts each type separately, failing on "([)]".
  - level: J
    topic: Sorting
    question: 'Merge overlapping intervals: [[1,3],[2,6],[8,10]] → [[1,6],[8,10]].'
    strong: Sort by start, extend the last merged interval or append; O(n log n).
    redFlags: Doesn't sort; misses touching intervals.
  - level: J
    topic: Design
    question: Implement a function that returns the k most frequent words in a text.
    strong: Counts in a map, then a min-heap of size k or bucket sort; discusses ties and case.
    redFlags: Sorts the whole map without considering k.
  - level: S
    topic: Graphs
    question: Given course prerequisites, return an order to take all courses, or say it's impossible.
    strong: Topological sort with Kahn's algorithm or DFS colours; detects cycles; O(V + E).
    redFlags: Can't model it as a graph.
  - level: S
    topic: DP
    question: Given coin denominations, find the fewest coins for an amount.
    strong: Bottom-up DP over amounts, explains why greedy fails (1, 3, 4 for 6); O(amount × coins).
    redFlags: Greedy only; doesn't test a counterexample.
  - level: S
    topic: Heaps
    question: Merge k sorted lists into one sorted list.
    strong: Min-heap of list heads; O(N log k); compares with pairwise merging.
    redFlags: Concatenates and sorts.
  - level: S
    topic: Design
    question: Implement a rate limiter that allows 100 requests per user per minute.
    strong: Sliding window or token bucket per user, with timestamps or counters; discusses memory, clock and distributed storage (Redis).
    redFlags: A global counter; no per-user state.
  - level: S
    topic: Concurrency
    question: Write a thread-safe counter, then explain how you would test it.
    strong: Atomic integer or lock; test with many threads and a known total; mentions why ++ isn't atomic.
    redFlags: No synchronisation; thinks a volatile int is enough.
- id: java
  name: Java and Spring
  intro: 'Freshers: questions 1–3 and a coding problem. 1–3 years: 3–7. 3+ years: 5–10 plus system design.'
  questions:
  - level: F
    topic: Core Java
    question: What is the difference between == and equals() for Strings, and why does it matter for a HashMap key?
    strong: Reference vs value equality, the string pool, the equals/hashCode contract for keys.
    redFlags: Thinks == compares text "most of the time".
  - level: F
    topic: Exceptions
    question: 'Checked vs unchecked exceptions: when do you use each?'
    strong: Recoverable vs programming errors; never swallow; wrap with the cause.
    redFlags: Catches Exception and returns null as a habit.
  - level: F
    topic: Collections
    question: 'ArrayList vs LinkedList vs HashMap vs TreeMap: pick one for a given need and explain.'
    strong: Access patterns and Big-O, ordering, memory; ArrayList is the default.
    redFlags: Picks LinkedList for "faster inserts" without the cost of getting there.
  - level: J
    topic: Spring
    question: Explain how Spring dependency injection works and why constructor injection is preferred.
    strong: The container creates beans and wires them by type; testability, immutability, circular-dependency detection.
    redFlags: Only knows @Autowired on fields.
  - level: J
    topic: Spring
    question: A @Transactional method is called from another method in the same class and doesn't roll back. Why?
    strong: Proxy-based AOP; self-invocation bypasses the proxy; fixes (separate bean, restructure).
    redFlags: Blames the database.
  - level: J
    topic: JPA and Hibernate
    question: What is the N+1 problem in JPA/Hibernate, and how do you find and fix it?
    strong: Lazy loading in loops; SQL logs or metrics; JOIN FETCH, entity graphs, batch size, DTO queries.
    redFlags: Switches everything to EAGER.
  - level: J
    topic: REST
    question: How do you design error handling for a Spring Boot REST API?
    strong: '@RestControllerAdvice, a consistent error body, the right status codes (400/404/409/422/500), no stack traces to clients.'
    redFlags: Returns 200 with an error field.
  - level: S
    topic: Concurrency
    question: Two users book the last seat at the same time and both succeed. Fix it.
    strong: Optimistic locking (@Version) or a unique constraint, or SELECT ... FOR UPDATE; trade-offs and retries.
    redFlags: Adds synchronized on one server.
  - level: S
    topic: JVM
    question: Memory grows over days until OutOfMemoryError. How do you investigate?
    strong: Heap dumps over time, compare dominators, GC logs; common leaks (static maps, caches, listeners, ThreadLocal).
    redFlags: Raises -Xmx and restarts nightly.
  - level: S
    topic: Concurrency
    question: When would you use CompletableFuture, virtual threads or a message queue?
    strong: Async composition vs blocking I/O at scale vs durable decoupling; pinning, back-pressure, failure handling.
    redFlags: Uses threads for everything, with no thought for failures.
  - level: F
    topic: OOP
    question: What is the difference between an abstract class and an interface in modern Java?
    strong: Interfaces define contracts and can have default and static methods but no instance state; a class can implement many interfaces but
      extend one class.
    redFlags: Pre-Java 8 answer only; can't say when to use which.
  - level: F
    topic: Strings
    question: Why are Java Strings immutable, and what is the string pool?
    strong: Safety for sharing, hashing and security; literals are interned in the pool; use StringBuilder for building in loops.
    redFlags: Doesn't know; thinks == compares content.
  - level: F
    topic: Exceptions
    question: 'Checked vs unchecked exceptions: what''s the difference and when would you use each?'
    strong: Checked must be declared or caught (recoverable conditions); unchecked are programming errors; many modern APIs prefer unchecked.
    redFlags: Catches Exception everywhere and ignores it.
  - level: F
    topic: Collections
    question: 'ArrayList vs LinkedList: which would you use by default and why?'
    strong: 'ArrayList: fast index access and better cache use; LinkedList rarely wins in practice.'
    redFlags: Says LinkedList is faster for everything.
  - level: F
    topic: Access
    question: What do public, protected, package-private and private mean?
    strong: Visible everywhere; in subclasses and the package; only in the package; only in the class; default to the narrowest.
    redFlags: Makes everything public.
  - level: F
    topic: Basics
    question: What does static mean on a field and on a method?
    strong: Belongs to the class, not instances; static methods can't use this; shared state risks.
    redFlags: Confuses static with final.
  - level: F
    topic: Memory
    question: Where do objects and local variables live in the JVM?
    strong: Objects on the heap; local variables and references on each thread's stack; garbage collection reclaims unreachable objects.
    redFlags: Thinks Java has no memory management to understand.
  - level: J
    topic: Streams
    question: Rewrite a loop that filters active users and collects their emails into a list using streams. When would you not use streams?
    strong: filter, map, toList; avoids streams for complex control flow, checked exceptions or when a loop is clearer.
    redFlags: Uses streams everywhere, including for side effects.
  - level: J
    topic: Optional
    question: How should Optional be used, and how should it not?
    strong: As a return type for "maybe absent"; avoid get() without checks, avoid Optional fields and parameters.
    redFlags: Wraps everything in Optional or calls get() blindly.
  - level: J
    topic: Concurrency
    question: What is the difference between synchronized, volatile and AtomicInteger?
    strong: synchronized gives mutual exclusion and visibility; volatile only visibility; Atomic classes give lock-free atomic updates.
    redFlags: Thinks volatile makes ++ safe.
  - level: J
    topic: HashMap
    question: How does HashMap work internally, and what changed in Java 8?
    strong: Array of buckets, hash spreading, resize at load factor 0.75; buckets become balanced trees when they get long.
    redFlags: No idea beyond "key-value store".
  - level: J
    topic: Generics
    question: What does <? extends Number> mean vs <? super Integer>?
    strong: 'Producer extends, consumer super (PECS): read Numbers from the first, add Integers to the second.'
    redFlags: Can't explain wildcards.
  - level: J
    topic: Records
    question: When would you use a record instead of a class?
    strong: Immutable data carriers with equals, hashCode and toString generated; not for entities with identity or mutable state.
    redFlags: Hasn't heard of records (Java 16+).
  - level: J
    topic: Exceptions
    question: What is try-with-resources and why use it?
    strong: Closes AutoCloseable resources automatically, even on exceptions; suppressed exceptions are kept.
    redFlags: Closes in finally by hand with bugs.
  - level: S
    topic: JVM
    question: How would you choose and tune a garbage collector for a latency-sensitive service?
    strong: G1 default, ZGC or Shenandoah for low pauses; measure with GC logs; size heap; reduce allocation; avoid premature tuning.
    redFlags: Sets random flags from a blog post.
  - level: S
    topic: Concurrency
    question: Explain virtual threads (Java 21). When do they help and when don't they?
    strong: Cheap threads for blocking I/O at high concurrency; no help for CPU-bound work; watch pinning with synchronized and thread-local overuse.
    redFlags: Thinks they make CPU work faster.
  - level: S
    topic: Design
    question: How do you design an immutable class in Java, and why bother?
    strong: Final fields, no setters, defensive copies of mutable inputs and outputs, final class; thread safety and easier reasoning.
    redFlags: Only marks fields final, leaking mutable lists.
  - level: S
    topic: Performance
    question: A Java service's CPU is at 100%. How do you find the cause?
    strong: Thread dumps, async-profiler or JFR flame graphs, check GC activity, recent changes, hot loops or regex; reproduce under load.
    redFlags: Restarts and adds servers.
  - level: S
    topic: Modules
    question: How do you keep a large Java code base maintainable over years?
    strong: Clear module boundaries, dependency rules (ArchUnit), tests, small interfaces, consistent conventions, regular upgrades.
    redFlags: No answer beyond "clean code".
  - level: S
    topic: Upgrades
    question: Your team is on Java 8. What is your plan to move to Java 21?
    strong: Inventory dependencies, upgrade build tools, move step by step (11, 17, 21), run tests, fix removed APIs, adopt new features gradually.
    redFlags: Changes the version and hopes.
- id: spring-boot
  name: Spring Boot and Hibernate
  intro: For Java backend roles. Start with how Spring works (beans, injection, configuration), then REST, then data access with JPA and Hibernate.
    Seniors should talk about transactions, performance and production behaviour.
  questions:
  - level: F
    topic: Basics
    question: What problem does Spring Boot solve compared with plain Spring?
    strong: Auto-configuration, starters, embedded server and sensible defaults, so you write business code instead of setup.
    redFlags: Thinks Spring Boot is a different framework from Spring.
  - level: F
    topic: Dependency injection
    question: What is dependency injection, and why is constructor injection preferred?
    strong: The container provides dependencies; constructor injection makes them explicit, final and easy to test.
    redFlags: Uses field @Autowired everywhere and can't say why not.
  - level: F
    topic: Annotations
    question: What is the difference between @Component, @Service, @Repository and @Controller?
    strong: All are components found by scanning; the names show the layer, and @Repository adds exception translation.
    redFlags: Thinks they behave completely differently.
  - level: F
    topic: REST
    question: Write a controller method that returns a user by id, and 404 when not found.
    strong: '@GetMapping("/users/{id}"), @PathVariable, returns the DTO or throws an exception mapped to 404 (or ResponseEntity).'
    redFlags: Returns null with 200.
  - level: F
    topic: Configuration
    question: How do you keep different settings for dev and production?
    strong: application.yml with profiles, environment variables for secrets, @ConfigurationProperties.
    redFlags: Hard-codes passwords in code.
  - level: F
    topic: JPA basics
    question: What is an @Entity, and what does @Id do?
    strong: A class mapped to a table; @Id marks the primary key, often with a generated value.
    redFlags: Doesn't know what an ORM is.
  - level: F
    topic: Layers
    question: Why put business logic in a service and not in the controller?
    strong: Controllers handle HTTP; services hold rules and transactions; easier to test and reuse.
    redFlags: Puts everything in the controller.
  - level: F
    topic: Validation
    question: How do you validate a request body in Spring Boot?
    strong: '@Valid with Bean Validation annotations (@NotBlank, @Email), and a handler that returns 400 with clear messages.'
    redFlags: Validates by hand with if statements everywhere.
  - level: J
    topic: Transactions
    question: What does @Transactional do, and why might it not work when you call the method from the same class?
    strong: Starts and commits or rolls back via a proxy; self-invocation bypasses the proxy; rollback is for unchecked exceptions by default.
    redFlags: Thinks it always works anywhere.
  - level: J
    topic: Persistence context
    question: What is Hibernate's persistence context, and what is dirty checking?
    strong: A first-level cache of managed entities in the transaction; changes to managed entities are saved at flush without calling save.
    redFlags: Surprised that changes save without save().
  - level: J
    topic: Lazy loading
    question: What is LazyInitializationException and how do you avoid it?
    strong: Accessing a lazy association after the session closed; fetch what you need in the query or map to DTOs inside the transaction; don't
      use open-in-view as a fix.
    redFlags: Makes everything EAGER.
  - level: J
    topic: Errors
    question: How do you return consistent error responses from a Spring Boot API?
    strong: '@RestControllerAdvice with @ExceptionHandler, a standard error body (or ProblemDetail), correct status codes, no stack traces.'
    redFlags: Try-catch in every controller.
  - level: J
    topic: Security
    question: How does Spring Security decide whether a request is allowed?
    strong: A filter chain authenticates, then authorisation rules on URLs and methods (@PreAuthorize); CSRF for cookie sessions; password hashing
      with BCrypt.
    redFlags: Checks roles by hand in controllers.
  - level: J
    topic: Testing
    question: How do you test a controller, a service and a repository in Spring Boot?
    strong: '@WebMvcTest with MockMvc, plain unit tests with mocks for services, @DataJpaTest or Testcontainers for repositories; few full @SpringBootTest.'
    redFlags: Only manual testing with Postman.
  - level: J
    topic: Entities
    question: How do you map a one-to-many relationship, and who owns it?
    strong: '@OneToMany(mappedBy) with @ManyToOne owning the foreign key; cascade and orphanRemoval used carefully; keep both sides in sync.'
    redFlags: Doesn't know which side writes the foreign key.
  - level: J
    topic: Pagination
    question: An endpoint returns 100,000 orders. How do you page it?
    strong: Pageable with a stable sort, or keyset pagination for deep pages; limit page size; return totals only when needed.
    redFlags: Returns everything and lets the client filter.
  - level: J
    topic: Beans
    question: What are bean scopes, and what goes wrong if you inject a request-scoped bean into a singleton?
    strong: Singleton, prototype, request, session; a proxy is needed, otherwise the singleton keeps one instance.
    redFlags: Has never thought about scopes.
  - level: S
    topic: Performance
    question: An endpoint backed by JPA is slow. How do you find and fix the problem?
    strong: Log SQL and timings, look for N+1 and missing indexes, check fetch plans, use projections, cache read-mostly data, measure again.
    redFlags: Adds caching everywhere without measuring.
  - level: S
    topic: Locking
    question: Two users update the same order at the same time. How do you stop lost updates?
    strong: Optimistic locking with @Version and retry or a clear conflict error; pessimistic locks only when contention is high.
    redFlags: Uses synchronized in the service.
  - level: S
    topic: Transactions
    question: Explain transaction propagation REQUIRED vs REQUIRES_NEW with a real use.
    strong: REQUIRED joins the current one; REQUIRES_NEW suspends it, for example to save an audit row even if the main work rolls back.
    redFlags: Doesn't know propagation exists.
  - level: S
    topic: Production
    question: What would you check before running a Spring Boot service in production?
    strong: Health and readiness probes, metrics (Micrometer), structured logs, timeouts on outbound calls, connection pool sizing, graceful shutdown,
      config via env.
    redFlags: Just runs the jar.
  - level: S
    topic: Migrations
    question: How do you change the database schema safely with many instances running?
    strong: Flyway or Liquibase versioned migrations, backward-compatible steps (expand and contract), never edit applied scripts.
    redFlags: Lets Hibernate ddl-auto update production.
  - level: S
    topic: Resilience
    question: Your service calls a slow payment API. How do you protect your service?
    strong: Timeouts, retries with backoff for safe calls, circuit breaker (Resilience4j), bulkheads, idempotency keys, fallbacks.
    redFlags: No timeouts; retries forever.
  - level: S
    topic: Events
    question: How would you publish an event after an order is saved, without losing it if the broker is down?
    strong: 'Transactional outbox: write the event in the same transaction, a relay publishes it; or @TransactionalEventListener for in-process
      only.'
    redFlags: Sends to Kafka inside the transaction and hopes.
  - level: S
    topic: Caching
    question: When would you use Spring's @Cacheable, and what can go wrong?
    strong: For expensive read-mostly data; set TTLs and eviction, watch stale data, cache keys, and self-invocation through the proxy.
    redFlags: Caches everything forever.
  - level: F
    topic: HTTP
    question: Which HTTP method and status code would you use to create a resource?
    strong: POST, 201 Created with a Location header or the created body; 400 for invalid input.
    redFlags: Uses GET with a body, or always 200.
  - level: J
    topic: DTOs
    question: Why not return JPA entities directly from your REST controllers?
    strong: Leaks internal fields, lazy-loading surprises, tight coupling to the schema; DTOs shape the API.
    redFlags: Doesn't see a problem.
  - level: S
    topic: Observability
    question: How do you trace one request across three Spring Boot services?
    strong: Distributed tracing with a trace id propagated in headers (Micrometer Tracing, OpenTelemetry), shown in Zipkin or Jaeger; ids in logs.
    redFlags: Searches logs by timestamp.
- id: python
  name: Python
  intro: Pick questions at the candidate's level; follow each with "why" and "what breaks".
  questions:
  - level: F
    topic: Data types
    question: 'List vs tuple vs set vs dict: when do you use each?'
    strong: Mutability, hashing, lookup cost, dict ordering since 3.7.
    redFlags: Can't say why a list can't be a dict key.
  - level: F
    topic: Functions
    question: What does `def add(item, items=[])` do wrong?
    strong: The default is evaluated once and shared between calls; fix it with None.
    redFlags: Hasn't seen mutable defaults as a bug.
  - level: F
    topic: Generators
    question: Explain generators and when they save memory.
    strong: Lazy iteration, yield, streaming large files, one pass only.
    redFlags: Thinks a generator is just a faster list.
  - level: J
    topic: Decorators
    question: Write a decorator that retries a function 3 times on an exception.
    strong: A closure, *args/**kwargs, functools.wraps, which exceptions to retry, backoff.
    redFlags: Retries everything forever and loses the function's name.
  - level: J
    topic: Frameworks
    question: 'Django vs Flask vs FastAPI: which for a new REST service and why?'
    strong: Batteries included vs minimal vs async with typed validation; fit with the team and project.
    redFlags: '"FastAPI is fastest" with no other reasoning.'
  - level: J
    topic: ORM
    question: How do you avoid N+1 queries in the Django ORM?
    strong: select_related vs prefetch_related; debug toolbar or query logging.
    redFlags: Doesn't know the ORM runs queries lazily.
  - level: J
    topic: Concurrency
    question: 'Threads, multiprocessing or asyncio for: 1,000 HTTP calls; resizing images; a web server?'
    strong: The GIL, I/O-bound vs CPU-bound, the event loop, pools.
    redFlags: Uses threads for CPU-bound work and expects a speed-up.
  - level: S
    topic: Performance
    question: A Python service's memory keeps growing. How do you find the cause?
    strong: tracemalloc, objgraph; caches without limits, references in globals, C-extension leaks.
    redFlags: Calls gc.collect() and moves on.
  - level: S
    topic: Design
    question: How do you structure a large Python codebase for testability?
    strong: Layers, dependencies passed in, pytest fixtures, typing with mypy, packaging.
    redFlags: Everything in one module with globals.
  - level: F
    topic: Types
    question: What is the difference between a list, a tuple, a set and a dict? When would you use each?
    strong: Ordered mutable; ordered immutable (hashable keys, fixed records); unique unordered with fast membership; key-value lookup.
    redFlags: Uses lists for everything, including membership checks.
  - level: F
    topic: Mutability
    question: Why is def f(items=[]) a bug?
    strong: The default list is created once and shared between calls; use None and create inside.
    redFlags: Doesn't see the problem.
  - level: F
    topic: Comprehensions
    question: Write a comprehension for the squares of even numbers below 20. When is a loop clearer?
    strong: '[n * n for n in range(20) if n % 2 == 0]; loops for side effects or complex logic.'
    redFlags: Can't write one, or nests three levels deep.
  - level: F
    topic: Strings
    question: How do you build a large string from many pieces efficiently?
    strong: Collect pieces in a list and "".join(parts); f-strings for formatting.
    redFlags: Concatenates with += in a big loop and doesn't know the cost.
  - level: F
    topic: Errors
    question: How do you handle a missing file without hiding other errors?
    strong: Catch FileNotFoundError specifically, use with open(...), let unexpected errors raise.
    redFlags: 'Bare except: pass.'
  - level: F
    topic: Basics
    question: What do *args and **kwargs do?
    strong: Collect extra positional arguments into a tuple and keyword arguments into a dict; also unpack when calling.
    redFlags: Has used them only by copying code.
  - level: F
    topic: Equality
    question: What is the difference between == and is?
    strong: == compares values; is compares identity; use is only for None and singletons.
    redFlags: Uses is for strings or numbers.
  - level: J
    topic: Generators
    question: What is a generator and when would you use one?
    strong: yield produces values lazily; good for large files or streams; constant memory; can be iterated once.
    redFlags: Thinks it's just a list.
  - level: J
    topic: Decorators
    question: Write a decorator that logs how long a function takes.
    strong: Wraps with a closure, time.perf_counter, functools.wraps to keep the name; returns the result.
    redFlags: Forgets to return the result or loses metadata.
  - level: J
    topic: Context managers
    question: How does with work, and how would you write your own context manager?
    strong: __enter__ and __exit__, or contextlib.contextmanager with yield; guarantees cleanup on exceptions.
    redFlags: Only knows with open().
  - level: J
    topic: Concurrency
    question: 'Threads, processes or asyncio: which for downloading 1,000 URLs, and which for resizing 1,000 images?'
    strong: 'I/O-bound downloads: asyncio or threads; CPU-bound resizing: processes (the GIL); explains why.'
    redFlags: Uses threads for CPU work and expects a speed-up.
  - level: J
    topic: Typing
    question: Do you use type hints? What do they give you if Python ignores them at runtime?
    strong: Readability, editor help and mypy or pyright catching bugs; dataclasses and Pydantic use them.
    redFlags: Thinks hints are enforced at runtime.
  - level: J
    topic: Dataclasses
    question: When would you use a dataclass, a NamedTuple or a Pydantic model?
    strong: Dataclass for simple records, NamedTuple for immutable tuples, Pydantic for validating external input.
    redFlags: Uses dicts for everything.
  - level: J
    topic: Django or FastAPI
    question: Walk me through what happens when a request hits your Django or FastAPI app.
    strong: URL routing, middleware, view or path function, validation, ORM or service call, serialisation, response; where auth fits.
    redFlags: Can't describe beyond "it returns JSON".
  - level: J
    topic: ORM
    question: Your Django page makes 101 queries to show 100 orders with their customers. Fix it.
    strong: select_related for foreign keys, prefetch_related for many; checks with the debug toolbar or query logging.
    redFlags: Hasn't seen the problem.
  - level: S
    topic: Design
    question: How do you structure a large Python code base so it stays maintainable?
    strong: Packages by feature, clear interfaces, type hints checked in CI, dependency injection where useful, tests, consistent tooling (ruff,
      black).
    redFlags: Everything in a few huge modules.
  - level: S
    topic: Packaging
    question: How do you manage dependencies and environments for a Python service in a team?
    strong: Virtual environments, pinned lock files (pip-tools, Poetry, uv), reproducible Docker images, upgrade regularly.
    redFlags: pip install into the system Python.
  - level: S
    topic: Async
    question: What happens if you call a blocking function inside an async FastAPI endpoint?
    strong: It blocks the event loop and every other request; use async libraries, run blocking code in a thread pool, or make the endpoint sync.
    redFlags: Thinks async makes everything concurrent.
  - level: S
    topic: Performance
    question: How do you make slow Python code faster?
    strong: Profile first (cProfile, py-spy), better algorithms and data structures, built-ins, vectorise with NumPy, caching, move hot paths
      to C or Rust only if needed.
    redFlags: Rewrites in another language without profiling.
  - level: S
    topic: Testing
    question: How do you structure tests for a FastAPI or Django service?
    strong: pytest with fixtures, unit tests for logic, API tests with the test client, a real database in a container for integration, factories
      for data.
    redFlags: Only manual testing.
  - level: S
    topic: GIL
    question: What is the GIL, and is it going away?
    strong: One thread runs Python bytecode at a time in CPython; I/O releases it; Python 3.13 has an experimental free-threaded build.
    redFlags: Has never heard of it.
- id: javascript
  name: JavaScript and TypeScript
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Basics
    question: let vs const vs var.
    strong: Block vs function scope, hoisting and the temporal dead zone; const doesn't freeze objects.
    redFlags: Thinks const makes objects immutable.
  - level: F
    topic: Basics
    question: == vs ===, and what is truthy?
    strong: Coercion rules, always ===, the falsy list (0, "", null, undefined, NaN, false).
    redFlags: Uses == by habit.
  - level: F
    topic: Closures
    question: 'What prints, and why: `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i))`?'
    strong: 3 3 3, because the closures share one var; let gives 0 1 2.
    redFlags: Answers 0 1 2 and can't explain afterwards.
  - level: J
    topic: Event loop
    question: 'Explain the event loop: microtasks vs macrotasks.'
    strong: Call stack, promise jobs before timers, why a long loop freezes the UI.
    redFlags: Says JavaScript is multi-threaded.
  - level: J
    topic: Async
    question: 'Promise.all vs allSettled vs race: when do you use each?'
    strong: Fail fast vs collect every result vs first to finish; timeouts with race.
    redFlags: Awaits in a loop when the calls are independent.
  - level: J
    topic: this
    question: How does `this` work, and how do arrow functions change it?
    strong: Call-site binding, bind/call/apply, lexical this in arrows.
    redFlags: Guesses from where the function is written.
  - level: J
    topic: TypeScript
    question: interface vs type, unknown vs any, and generics with constraints.
    strong: Declaration merging, unions, narrowing unknown, <T extends ...>.
    redFlags: Uses any everywhere.
  - level: S
    topic: Performance
    question: How do you find and fix a memory leak in a single-page app?
    strong: DevTools heap snapshots, detached DOM nodes, listeners and timers not cleared, closures.
    redFlags: Reloads the page as the fix.
  - level: S
    topic: Security
    question: How do you protect a web app from XSS and CSRF?
    strong: Escaping, CSP, avoiding innerHTML, HttpOnly and SameSite cookies, CSRF tokens.
    redFlags: Thinks HTTPS solves both.
  - level: F
    topic: Variables
    question: What is the difference between var, let and const?
    strong: var is function-scoped and hoisted; let and const are block-scoped; const can't be reassigned but objects can still change.
    redFlags: Thinks const makes objects immutable.
  - level: F
    topic: Equality
    question: Why prefer === over ==?
    strong: == does type coercion with surprising results ("0" == 0); === compares type and value.
    redFlags: Uses == everywhere.
  - level: F
    topic: Arrays
    question: Use map, filter and reduce to total the prices of items in stock.
    strong: items.filter(i => i.inStock).map(i => i.price).reduce((a, b) => a + b, 0); explains the initial value.
    redFlags: Forgets the initial value; uses forEach to build arrays.
  - level: F
    topic: Functions
    question: What is the difference between an arrow function and a normal function?
    strong: Arrow functions don't have their own this or arguments, can't be constructors; good for callbacks.
    redFlags: Thinks they're just shorter syntax.
  - level: F
    topic: DOM
    question: How do you handle clicks on 1,000 list items efficiently?
    strong: 'Event delegation: one listener on the parent, check event.target.'
    redFlags: Adds 1,000 listeners.
  - level: F
    topic: Async
    question: What is a Promise, and what do async and await do?
    strong: An object for a future value; await pauses the async function until it settles; errors via try/catch.
    redFlags: Thinks await blocks the whole browser.
  - level: F
    topic: Types
    question: What do typeof null and typeof [] return?
    strong: '"object" for both; use Array.isArray and === null.'
    redFlags: Doesn't know the quirks.
  - level: J
    topic: Event loop
    question: 'In what order do these run: setTimeout(…, 0), Promise.resolve().then(…), and console.log?'
    strong: Synchronous log first, then microtasks (promise), then the timer (macrotask); explains the queues.
    redFlags: Thinks setTimeout 0 runs immediately.
  - level: J
    topic: Closures
    question: Write a function counter() that returns a function which counts up each time it's called.
    strong: Closure over a local variable; each counter is independent; mentions practical uses.
    redFlags: Uses a global variable.
  - level: J
    topic: this
    question: Why does this become undefined when you pass obj.method as a callback, and how do you fix it?
    strong: this depends on how it's called; fix with bind, an arrow function or calling obj.method() inside.
    redFlags: Can't explain this binding.
  - level: J
    topic: Modules
    question: What is the difference between CommonJS and ES modules?
    strong: require/module.exports (sync, Node legacy) vs import/export (static, tree-shakable, async loading); interop issues.
    redFlags: Doesn't know there are two systems.
  - level: J
    topic: TypeScript
    question: What does TypeScript add, and when do you reach for unknown instead of any?
    strong: Static types, editor help, safer refactors; unknown forces you to narrow before use, any turns checking off.
    redFlags: Uses any everywhere.
  - level: J
    topic: Errors
    question: How do you run three API calls in parallel and handle one failing?
    strong: Promise.all fails fast; Promise.allSettled to keep the others; try/catch around await; timeouts with AbortController.
    redFlags: Awaits them one by one.
  - level: J
    topic: Copying
    question: How do you copy an object deeply?
    strong: structuredClone for plain data; spread copies only one level; JSON round-trip loses dates and functions.
    redFlags: Thinks spread is a deep copy.
  - level: S
    topic: Performance
    question: A page freezes when filtering a list of 50,000 items as the user types. What do you do?
    strong: Debounce input, move filtering off the main thread (web worker) or index the data, virtualise the list, measure with the Performance
      panel.
    redFlags: Adds a loading spinner.
  - level: S
    topic: Memory
    question: What causes memory leaks in a long-running browser app?
    strong: Listeners not removed, timers, global caches, detached DOM nodes held by closures; find with heap snapshots.
    redFlags: Thinks garbage collection prevents all leaks.
  - level: S
    topic: TypeScript
    question: How do you model an API response that is either success with data or an error, in TypeScript?
    strong: A discriminated union with a status field; the compiler forces handling both; generics for the data.
    redFlags: Optional fields everywhere.
  - level: S
    topic: Tooling
    question: What does a bundler like Vite or webpack do, and how do you keep bundles small?
    strong: Resolves modules, transpiles, bundles, splits code; keep small with code splitting, tree shaking, analysing the bundle, lighter dependencies.
    redFlags: Never looked at bundle size.
  - level: S
    topic: Security
    question: How can JavaScript on your page be used against your users, and how do you prevent it?
    strong: 'XSS: escape output, avoid innerHTML with user data, CSP; supply-chain risk from dependencies; tokens in HttpOnly cookies.'
    redFlags: Thinks HTTPS solves it.
  - level: S
    topic: Concurrency
    question: The user clicks Search twice quickly and the older response arrives last, showing wrong results. Fix it.
    strong: Cancel the old request with AbortController or ignore stale responses with a request id.
    redFlags: Disables the button forever.
  - level: F
    topic: JSON
    question: How do you turn an object into JSON text and back? What doesn't survive?
    strong: JSON.stringify and JSON.parse; functions, undefined, dates (become strings), Map and Set don't survive.
    redFlags: Doesn't know about lost types.
- id: html-css
  name: HTML, CSS and accessibility
  intro: For frontend and full-stack roles. Ask them to explain while sketching or sharing a quick CodePen. Good candidates reach for semantic
    HTML and modern layout (flexbox, grid) before frameworks.
  questions:
  - level: F
    topic: Semantics
    question: Why use <button> instead of a <div> with a click handler?
    strong: Keyboard focus and Enter or Space work, screen readers announce it, forms behave correctly; no extra code.
    redFlags: Sees no difference.
  - level: F
    topic: Box model
    question: 'Explain the CSS box model and what box-sizing: border-box changes.'
    strong: Content, padding, border, margin; border-box makes width include padding and border.
    redFlags: Doesn't know why widths add up wrongly.
  - level: F
    topic: Layout
    question: Centre a box horizontally and vertically inside its parent.
    strong: 'display: flex with justify-content and align-items center, or grid with place-items: center.'
    redFlags: Uses absolute positioning with magic numbers.
  - level: F
    topic: Flexbox vs grid
    question: When do you use flexbox and when grid?
    strong: Flexbox for one direction (rows of buttons, navbars); grid for two-dimensional layouts.
    redFlags: Uses floats or tables for layout.
  - level: F
    topic: Specificity
    question: Two rules style the same button differently. How does the browser decide?
    strong: Specificity (inline, id, class, element), then source order; !important overrides; keep specificity low.
    redFlags: Adds !important until it works.
  - level: F
    topic: Responsive
    question: How do you make a page work on a phone and a desktop?
    strong: Viewport meta tag, fluid widths, flexbox or grid, media or container queries, mobile-first, responsive images.
    redFlags: Fixed pixel widths.
  - level: F
    topic: Forms
    question: How do you make a form field accessible?
    strong: A <label> tied to the input, correct type, required and error messages announced (aria-describedby), visible focus.
    redFlags: Placeholder instead of a label.
  - level: F
    topic: Images
    question: What should go in an image's alt text?
    strong: A short description of what matters; empty alt for decorative images; never "image of".
    redFlags: Leaves alt out or repeats the file name.
  - level: F
    topic: Units
    question: 'px, em, rem, %, vw: when do you use each?'
    strong: rem for type and spacing (respects user font size), % and vw for fluid layout, px for borders.
    redFlags: Only px.
  - level: J
    topic: Positioning
    question: Explain static, relative, absolute, fixed and sticky positioning.
    strong: Absolute is relative to the nearest positioned ancestor, fixed to the viewport, sticky switches on scroll; stacking contexts and z-index.
    redFlags: 'Uses z-index: 9999 everywhere.'
  - level: J
    topic: Accessibility
    question: How do you test a page for accessibility?
    strong: Keyboard-only navigation, a screen reader, automated checks (axe, Lighthouse), colour contrast, zoom to 200%.
    redFlags: Only runs Lighthouse.
  - level: J
    topic: Performance
    question: What makes a page render slowly, and how do you speed it up?
    strong: Render-blocking CSS and JS, big images, layout shifts, web fonts; fix with critical CSS, defer, image sizes and formats, preloading.
    redFlags: No idea how to measure.
  - level: J
    topic: CSS architecture
    question: How do you keep CSS manageable in a big project?
    strong: Components with scoped styles (CSS modules), a naming convention (BEM), design tokens as variables, or utility CSS like Tailwind.
    redFlags: One giant global stylesheet.
  - level: J
    topic: Variables
    question: What are CSS custom properties and how would you use them for dark mode?
    strong: Variables on :root, redefined under a dark class or prefers-color-scheme; components use the variables.
    redFlags: Duplicates every rule for dark mode.
  - level: J
    topic: Bootstrap
    question: When does a framework like Bootstrap help, and when does it get in the way?
    strong: Fast for standard layouts and admin screens; fights custom designs, adds weight; customise via variables, not overrides.
    redFlags: Overrides Bootstrap with !important everywhere.
  - level: J
    topic: ARIA
    question: When should you use ARIA attributes?
    strong: 'Only when native HTML can''t express it: no ARIA is better than bad ARIA; aria-live for updates, aria-expanded for toggles.'
    redFlags: Adds role and aria to everything.
  - level: J
    topic: Animations
    question: How do you animate smoothly?
    strong: Animate transform and opacity, not layout properties; requestAnimationFrame or CSS transitions; respect prefers-reduced-motion.
    redFlags: Animates width and top with JavaScript timers.
  - level: S
    topic: Core Web Vitals
    question: What are LCP, INP and CLS, and how would you improve each?
    strong: Largest paint (optimise hero image and server), interaction delay (less main-thread work), layout shift (reserve space for images
      and ads).
    redFlags: Never heard of them.
  - level: S
    topic: Design systems
    question: How would you build a component library used by several apps?
    strong: Design tokens, accessible primitives, documentation (Storybook), versioning, visual tests, clear contribution rules.
    redFlags: Copies components between apps.
  - level: S
    topic: Layout
    question: Explain container queries and when they beat media queries.
    strong: Style a component by its container's size, so it works in a sidebar or main column alike.
    redFlags: Hasn't heard of them.
  - level: S
    topic: Accessibility
    question: 'A modal dialog: what makes it accessible?'
    strong: Focus moves in and is trapped, Escape closes, focus returns, role="dialog" with a label, background inert; or use <dialog>.
    redFlags: A div that appears on top.
  - level: S
    topic: Internationalisation
    question: What changes in your HTML and CSS to support Arabic as well as English?
    strong: dir="rtl", logical properties (margin-inline-start), fonts, text expansion, no text in images.
    redFlags: Flips everything with transforms.
  - level: F
    topic: Structure
    question: Which HTML elements would you use for a blog page layout?
    strong: header, nav, main, article, section with headings, aside, footer; one h1 and a logical heading order.
    redFlags: Divs everywhere.
  - level: J
    topic: Fonts
    question: How do you load web fonts without making text invisible or jump?
    strong: 'font-display: swap, preload key fonts, subset, size-adjust or fallback metrics to cut layout shift.'
    redFlags: Doesn't notice the flash.
  - level: S
    topic: Browser support
    question: How do you decide which browsers to support and use new CSS safely?
    strong: Use analytics, a browserslist, progressive enhancement, @supports, polyfills only where needed.
    redFlags: Either ignores old browsers or avoids all new CSS.
- id: react
  name: React
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Basics
    question: Props vs state; what triggers a re-render?
    strong: State changes or a parent re-render; immutability; lifting state up.
    redFlags: Mutates state directly and wonders why nothing updates.
  - level: F
    topic: Lists
    question: Why do list items need a key, and why not the index?
    strong: Reconciliation identity; the index breaks on reorder or insert, losing input state.
    redFlags: Uses Math.random() as a key.
  - level: J
    topic: Hooks
    question: 'useEffect: the dependency array, cleanup, and a bug you''ve hit.'
    strong: Stale closures, infinite loops, cleanup for subscriptions, races in fetches.
    redFlags: Leaves out dependencies to "stop it running".
  - level: J
    topic: State
    question: When do you reach for Context, Redux Toolkit, Zustand or React Query?
    strong: Server state vs client state, the re-render cost of context, caching and refetching.
    redFlags: Puts all server data in Redux by default.
  - level: J
    topic: Performance
    question: A page re-renders too often and feels slow. How do you diagnose it?
    strong: The Profiler; memo/useMemo/useCallback where measured; splitting state; virtualising long lists.
    redFlags: Wraps everything in useMemo without measuring.
  - level: S
    topic: Architecture
    question: 'SSR vs CSR vs static generation vs server components in Next.js: choose for a product page and a dashboard.'
    strong: SEO and first paint vs interactivity, caching, data freshness, hydration cost.
    redFlags: Picks one for everything.
  - level: S
    topic: Testing
    question: How do you test a component that fetches data?
    strong: React Testing Library by behaviour, mock the network (MSW), loading and error states.
    redFlags: Tests implementation details or snapshots only.
  - level: F
    topic: Basics
    question: What is the difference between props and state?
    strong: Props come from the parent and are read-only; state is owned by the component and changing it re-renders.
    redFlags: Mutates props.
  - level: F
    topic: Lists
    question: Why does React need a key on list items, and why not use the index?
    strong: Keys let React match items between renders; index keys break when items are reordered or removed (wrong state, inputs).
    redFlags: Uses Math.random() as the key.
  - level: F
    topic: Events
    question: Build a controlled input that shows how many characters are left out of 100.
    strong: useState for the value, onChange updates it, derived count = 100 - value.length, maxLength.
    redFlags: Stores the count in separate state.
  - level: F
    topic: Effects
    question: What is useEffect for? Give one correct use.
    strong: Syncing with something outside React (fetching, subscriptions, timers); dependency array; cleanup.
    redFlags: Uses it to compute values that could be derived.
  - level: F
    topic: Conditional
    question: How do you show a loading message, an error, or the data from a fetch?
    strong: State for status (loading, error, data) and render each case; avoid flashes; handle empty data.
    redFlags: Only the success case.
  - level: F
    topic: Components
    question: When do you split a component into smaller ones?
    strong: When a part has its own responsibility or state, repeats, or the file gets hard to read.
    redFlags: Never splits, or splits everything into tiny pieces.
  - level: J
    topic: State
    question: Where should state live when two sibling components need it?
    strong: Lift it to the nearest common parent; context or a store only when many distant components need it.
    redFlags: Copies state into both and syncs with effects.
  - level: J
    topic: Effects
    question: Your effect fetches data and the component unmounts before it finishes. What can go wrong and how do you fix it?
    strong: Setting state on an unmounted component or racing responses; AbortController in cleanup or ignore stale results.
    redFlags: Hasn't considered it.
  - level: J
    topic: Memo
    question: When are useMemo, useCallback and React.memo actually useful?
    strong: For expensive calculations or keeping references stable for memoised children or effect dependencies; measure first.
    redFlags: Wraps everything by default.
  - level: J
    topic: Forms
    question: How do you handle a large form with validation in React?
    strong: A form library (React Hook Form) or reducer, schema validation (Zod), field-level errors, accessible labels.
    redFlags: One useState per field with ad-hoc checks.
  - level: J
    topic: Data fetching
    question: Why use a library like TanStack Query or SWR instead of fetch in useEffect?
    strong: Caching, deduplication, retries, background refresh, loading and error states, cache invalidation after mutations.
    redFlags: Has never used one and sees no need.
  - level: J
    topic: Routing
    question: How do you protect a route that needs a signed-in user?
    strong: A wrapper or loader checks auth and redirects; the server must still enforce access.
    redFlags: Only hides links.
  - level: J
    topic: Custom hooks
    question: Write a custom hook useDebounce(value, delay).
    strong: useState plus useEffect with setTimeout and cleanup; returns the debounced value.
    redFlags: Forgets the cleanup.
  - level: S
    topic: Rendering
    question: Explain what happens between setState and the screen updating.
    strong: Schedules a render, React calls components, diffs the result (reconciliation), commits DOM changes; batching; concurrent rendering
      can interrupt.
    redFlags: Thinks setState changes the DOM directly.
  - level: S
    topic: State management
    question: How do you choose between context, Redux Toolkit, Zustand and server-state libraries?
    strong: Server data in a query library; local UI state in components; context for rarely changing values; a store for complex shared client
      state.
    redFlags: Puts everything in Redux.
  - level: S
    topic: Architecture
    question: How would you structure a large React app for several teams?
    strong: Feature folders, shared design system, clear boundaries, typed API layer, lint rules, maybe micro-frontends or a monorepo with ownership.
    redFlags: One giant components folder.
  - level: S
    topic: Server components
    question: What are React Server Components and when do they help?
    strong: Components that run on the server, send no JS, can read data directly; client components for interactivity; reduces bundle size.
    redFlags: Confuses them with SSR only.
  - level: S
    topic: Accessibility
    question: How do you make a custom dropdown accessible?
    strong: Prefer a native select; otherwise correct roles and aria attributes, keyboard support, focus management, labels; test with a screen
      reader.
    redFlags: Divs with onClick only.
  - level: S
    topic: Errors
    question: How do you stop one broken widget from blanking the whole page?
    strong: Error boundaries around sections with a fallback, logging to a monitoring tool; handle async errors separately.
    redFlags: Doesn't know error boundaries.
  - level: J
    topic: Testing
    question: What would you test in a React component, and how?
    strong: 'User-visible behaviour with Testing Library: render, interact, assert on text and roles; mock the network (MSW).'
    redFlags: Snapshot tests only.
  - level: F
    topic: JSX
    question: What does JSX turn into?
    strong: Function calls that create React elements (objects describing the UI); expressions in braces.
    redFlags: Thinks it's HTML in JavaScript.
- id: angular
  name: Angular
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Basics
    question: Component vs service vs module; how does dependency injection work?
    strong: Injectors, providedIn root, singletons vs component-level providers.
    redFlags: Puts HTTP calls in components.
  - level: F
    topic: Forms
    question: 'Template-driven vs reactive forms: which and why?'
    strong: Reactive for complex validation and testability; FormGroup, validators.
    redFlags: Doesn't know reactive forms.
  - level: J
    topic: RxJS
    question: Observables vs Promises; switchMap vs mergeMap vs concatMap.
    strong: Lazy, cancellable streams; switchMap for typeahead, concatMap for ordered saves.
    redFlags: Subscribes inside subscribe.
  - level: J
    topic: RxJS
    question: How do you avoid memory leaks from subscriptions?
    strong: The async pipe, takeUntilDestroyed, unsubscribing in ngOnDestroy.
    redFlags: Never unsubscribes.
  - level: J
    topic: Change detection
    question: Default vs OnPush change detection, and where signals fit.
    strong: What Zone.js triggers, immutable inputs, markForCheck, signals for fine-grained updates.
    redFlags: Calls detectChanges everywhere.
  - level: S
    topic: State
    question: When does NgRx earn its complexity?
    strong: Shared state across features, effects for side effects, devtools; signal stores for simpler cases.
    redFlags: Uses NgRx for a two-page app.
  - level: S
    topic: Performance
    question: How do you make a large Angular app load fast?
    strong: Lazy-loaded routes, standalone components, trackBy, bundle analysis, defer blocks.
    redFlags: Only mentions minification.
  - level: F
    topic: Basics
    question: What are components, templates and modules (or standalone components) in Angular?
    strong: A component pairs a class with a template; modules group them, now mostly replaced by standalone components.
    redFlags: Can't describe the building blocks.
  - level: F
    topic: Binding
    question: Explain the four kinds of data binding.
    strong: Interpolation, property binding, event binding, two-way binding with ngModel.
    redFlags: Mixes them up.
  - level: F
    topic: Directives
    question: What is the difference between a component and a directive?
    strong: A component has a template; a directive adds behaviour to existing elements; structural directives (or @if, @for) change the DOM.
    redFlags: Doesn't know directives.
  - level: F
    topic: Services
    question: Why put HTTP calls in a service and not a component?
    strong: Reuse, testability, single responsibility; injected with DI.
    redFlags: Calls HttpClient directly from templates or components everywhere.
  - level: F
    topic: Lifecycle
    question: When do ngOnInit and ngOnDestroy run, and what do you put in each?
    strong: 'Init after inputs are set: load data; destroy: unsubscribe and clean up.'
    redFlags: Puts everything in the constructor.
  - level: F
    topic: Forms
    question: 'Template-driven or reactive forms: when do you use each?'
    strong: Reactive for complex validation and dynamic forms; template-driven for simple ones.
    redFlags: Knows only one.
  - level: J
    topic: RxJS
    question: What is the difference between switchMap, mergeMap and concatMap? Give a use for each.
    strong: switchMap cancels the previous (search box), mergeMap runs in parallel, concatMap queues in order (saves).
    redFlags: Uses subscribe inside subscribe.
  - level: J
    topic: Subjects
    question: What is the difference between Subject, BehaviorSubject and ReplaySubject?
    strong: Subject emits only new values; BehaviorSubject holds a current value for new subscribers; ReplaySubject replays a buffer of past values.
    redFlags: Uses Subject for state and loses the current value.
  - level: J
    topic: Change detection
    question: What does OnPush change detection do?
    strong: Checks the component only when inputs change by reference, events fire inside it, or async pipe emits; needs immutable data.
    redFlags: Never heard of it.
  - level: J
    topic: Signals
    question: What are signals in Angular, and how do they differ from RxJS?
    strong: Synchronous reactive values with computed and effect, fine-grained change detection; RxJS for async streams and events.
    redFlags: Hasn't heard of signals (Angular 16+).
  - level: J
    topic: Routing
    question: How do guards and resolvers work?
    strong: Guards decide whether a route can activate or deactivate; resolvers fetch data before activation; lazy-loaded routes.
    redFlags: Checks permissions in every component.
  - level: J
    topic: Interceptors
    question: How do you add an auth token to every request and handle 401s in one place?
    strong: An HTTP interceptor adds headers, catches 401 to refresh or redirect.
    redFlags: Adds headers in each service call.
  - level: J
    topic: Testing
    question: How do you test an Angular component that uses a service?
    strong: TestBed with a mock or spy service, query the DOM, trigger change detection; test services separately.
    redFlags: No tests.
  - level: S
    topic: Performance
    question: An Angular app is slow on a big table. What do you do?
    strong: OnPush, trackBy in loops, virtual scrolling (CDK), avoid function calls in templates, signals, lazy loading, profile with DevTools.
    redFlags: Upgrades the laptop.
  - level: S
    topic: Architecture
    question: How do you organise state in a large Angular app?
    strong: Services with signals or BehaviorSubjects for feature state, NgRx or a signal store for complex shared state, smart and presentational
      components.
    redFlags: Everything in one service.
  - level: S
    topic: Upgrades
    question: How do you keep a large Angular app up to date with yearly major versions?
    strong: ng update step by step, fix deprecations early, keep dependencies current, good test coverage.
    redFlags: Stays on an old version for years.
  - level: S
    topic: SSR
    question: When would you use Angular SSR and hydration?
    strong: SEO and first-load speed for public pages; costs in server complexity; watch browser-only APIs.
    redFlags: Thinks it's always better.
  - level: S
    topic: Security
    question: How does Angular protect against XSS, and how can you break that protection?
    strong: Templates escape values by default; bypassSecurityTrust* and innerHTML with untrusted data break it.
    redFlags: Doesn't know Angular sanitises.
  - level: J
    topic: DI
    question: 'What are providedIn: ''root'' and component-level providers?'
    strong: Root gives an app-wide singleton, tree-shakable; component providers give each component instance its own.
    redFlags: Can't explain injector scopes.
  - level: F
    topic: Pipes
    question: What is a pipe? Write one that formats a phone number.
    strong: A transform used in templates; pure by default; a class with transform().
    redFlags: Formats with methods called from the template.
  - level: S
    topic: Microfrontends
    question: Several teams build parts of one Angular product. How would you split it?
    strong: Libraries in a monorepo (Nx) with clear ownership, or module federation for independent deploys; shared design system; contract tests.
    redFlags: One repository, no boundaries.
- id: nodejs
  name: Node.js
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Runtime
    question: Why is Node good at I/O but bad at CPU-heavy work?
    strong: A single-threaded event loop, non-blocking I/O, the libuv thread pool, worker threads for CPU work.
    redFlags: Thinks Node runs each request on its own thread.
  - level: F
    topic: Express
    question: How does Express middleware work, and in what order does it run?
    strong: (req, res, next), registration order, error middleware with four arguments.
    redFlags: Doesn't know how to pass errors on.
  - level: J
    topic: Express
    question: An async route throws and the request hangs. Why, and how do you fix it everywhere?
    strong: Express 4 doesn't catch rejected promises; a wrapper or Express 5; a central error handler.
    redFlags: Wraps every line in try/catch.
  - level: J
    topic: Security
    question: How do you store passwords and issue JWTs safely?
    strong: bcrypt or argon2, short-lived access tokens, refresh tokens, the secret in env or a vault, verifying the algorithm.
    redFlags: Stores passwords with MD5 or inside the token.
  - level: J
    topic: MongoDB
    question: When do you embed vs reference in MongoDB, and how do you index?
    strong: Access patterns, document size, consistency; compound indexes matching the queries.
    redFlags: Embeds unbounded arrays.
  - level: J
    topic: Performance
    question: Your API's p99 latency jumped after a release. How do you find the cause?
    strong: Metrics and traces, event-loop lag, slow queries, a sync call such as readFileSync or a huge JSON.parse.
    redFlags: Restarts the server and hopes.
  - level: S
    topic: Scaling
    question: How do you run Node across many cores and instances?
    strong: Cluster or containers behind a load balancer, stateless services, shared state in Redis.
    redFlags: Keeps sessions in memory across instances.
  - level: S
    topic: Operations
    question: How do you shut down gracefully in Kubernetes?
    strong: Handle SIGTERM, stop accepting, drain in-flight requests, close DB pools, a readiness probe.
    redFlags: Calls process.exit() at once.
  - level: F
    topic: Basics
    question: What makes Node.js good for an API server, and what is it bad at?
    strong: Non-blocking I/O handles many concurrent connections on one thread; bad at heavy CPU work, which blocks the loop.
    redFlags: Thinks Node is multi-threaded by default.
  - level: F
    topic: npm
    question: What is the difference between dependencies and devDependencies, and what is package-lock.json for?
    strong: Runtime vs build or test tools; the lock file pins exact versions for reproducible installs (npm ci).
    redFlags: Deletes the lock file when things break.
  - level: F
    topic: Express
    question: Write an Express route that returns a user by id, with 404 when missing.
    strong: app.get("/users/:id", async (req, res) => …), res.status(404).json(...), passes errors to next.
    redFlags: Always returns 200.
  - level: F
    topic: Async
    question: How do you read a file without blocking the server?
    strong: fs.promises.readFile with await, or streams for big files; not readFileSync in a request handler.
    redFlags: Uses readFileSync everywhere.
  - level: F
    topic: Environment
    question: How do you configure a Node app for dev and production?
    strong: Environment variables (process.env), a validated config module, .env only for local; never commit secrets.
    redFlags: Hard-codes keys.
  - level: F
    topic: Modules
    question: How do you share code between files in Node?
    strong: ES modules (import/export) or CommonJS (require/module.exports); one style per project.
    redFlags: Copies code between files.
  - level: J
    topic: Middleware
    question: How does middleware work in Express? Write one that logs request time.
    strong: Functions (req, res, next) run in order; measure start, hook res "finish", call next(); error middleware has four args.
    redFlags: Forgets next() and requests hang.
  - level: J
    topic: Errors
    question: What happens to an unhandled promise rejection in an Express route, and how do you handle errors centrally?
    strong: May crash or hang depending on versions; use an async wrapper or Express 5, central error middleware, and process-level handlers that
      log and exit.
    redFlags: Wraps every line in try/catch.
  - level: J
    topic: Streams
    question: How do you send a 2 GB file to the client without running out of memory?
    strong: Stream it with pipeline(fs.createReadStream(...), res); backpressure; range requests.
    redFlags: Reads the whole file into memory.
  - level: J
    topic: Validation
    question: How do you validate request bodies in a Node API?
    strong: A schema (Zod, Joi, class-validator) at the edge, 400 with clear messages, types derived from the schema.
    redFlags: Trusts the client.
  - level: J
    topic: Auth
    question: How would you implement login with JWTs, and what are the risks?
    strong: Short-lived access token, refresh token rotation, store in HttpOnly cookies, verify signature and expiry, revocation strategy.
    redFlags: Puts long-lived tokens in localStorage.
  - level: J
    topic: Databases
    question: 'Prisma, an ORM or raw SQL: how do you choose for a Node service?'
    strong: Prisma or an ORM for productivity and types; raw SQL or a query builder for complex queries; watch N+1 and migrations.
    redFlags: Knows only one and can't compare.
  - level: J
    topic: Testing
    question: How do you test an Express or NestJS API?
    strong: Unit tests for services, supertest for routes, a real database in Docker for integration, mock external APIs.
    redFlags: Only Postman by hand.
  - level: S
    topic: Scaling
    question: How do you use all CPU cores with Node?
    strong: Multiple processes (cluster, PM2) or containers behind a load balancer; worker threads for CPU tasks; keep processes stateless.
    redFlags: Thinks one process uses all cores.
  - level: S
    topic: Event loop
    question: Your Node API's latency spikes under load. How do you find out if the event loop is blocked?
    strong: Measure event-loop lag (perf_hooks), profile with --inspect or clinic.js, look for sync crypto, JSON on huge payloads, regex.
    redFlags: Adds more instances without looking.
  - level: S
    topic: NestJS
    question: What does NestJS add on top of Express, and when is it worth it?
    strong: Modules, dependency injection, decorators, guards, pipes; structure for larger teams; more boilerplate for small services.
    redFlags: Doesn't know NestJS.
  - level: S
    topic: Background jobs
    question: How do you send 10,000 emails without slowing your API?
    strong: Queue (BullMQ with Redis, SQS), workers with concurrency limits, retries and dead-letter queue, idempotency.
    redFlags: Loops and sends in the request.
  - level: S
    topic: Security
    question: Name the main security risks in a Node API and how you handle each.
    strong: Injection (parameterised queries), vulnerable dependencies (npm audit, updates), missing rate limits, secrets in code, prototype pollution,
      helmet headers.
    redFlags: Only mentions HTTPS.
  - level: S
    topic: Shutdown
    question: How do you deploy a new version of a Node service without dropping requests?
    strong: Rolling deploys, readiness checks, graceful shutdown on SIGTERM (stop accepting, finish in-flight, close DB), timeouts.
    redFlags: Kills the process.
  - level: J
    topic: Caching
    question: How would you cache an expensive endpoint in Node?
    strong: Redis with TTL and a clear key scheme, cache-aside, HTTP caching headers; invalidate on writes.
    redFlags: In-memory Map that grows forever, across many instances.
  - level: F
    topic: Callbacks
    question: What is "callback hell", and how do promises and async/await fix it?
    strong: Deeply nested callbacks are hard to read and handle errors in; promises chain, async/await reads top to bottom with try/catch.
    redFlags: Can't explain the problem.
- id: sql
  name: SQL and databases
  intro: 'Have a two-table schema ready to share: customers(id, name, city) and orders(id, customer_id, amount, created_at).'
  questions:
  - level: F
    topic: Queries
    question: Write a query for total order amount per city, highest first.
    strong: JOIN, GROUP BY, SUM, ORDER BY; asks about customers with no orders.
    redFlags: Puts the aggregate in WHERE.
  - level: F
    topic: Joins
    question: 'INNER vs LEFT JOIN: find customers who never ordered.'
    strong: LEFT JOIN ... WHERE o.id IS NULL, or NOT EXISTS.
    redFlags: Uses NOT IN without thinking about NULLs.
  - level: F
    topic: Aggregates
    question: WHERE vs HAVING; COUNT(*) vs COUNT(column).
    strong: Filtering before vs after grouping; COUNT(column) skips NULLs.
    redFlags: Thinks they're interchangeable.
  - level: J
    topic: Window functions
    question: Return each customer's latest order.
    strong: ROW_NUMBER() OVER (PARTITION BY ... ORDER BY created_at DESC), or a correlated subquery.
    redFlags: Uses MAX(created_at), then joins back without handling ties.
  - level: J
    topic: Indexes
    question: A query on orders by customer_id and date is slow. What do you check?
    strong: EXPLAIN, composite index order (customer_id, created_at), selectivity, functions on columns blocking indexes.
    redFlags: Adds an index on every column.
  - level: J
    topic: Transactions
    question: Explain isolation levels and a lost update.
    strong: Read committed vs repeatable read vs serializable, the anomalies, row locks, optimistic locking.
    redFlags: Says transactions prevent all conflicts automatically.
  - level: S
    topic: Design
    question: Design the tables for an e-commerce cart, orders and inventory.
    strong: Normalisation, price snapshots on order lines, constraints, how stock is reserved.
    redFlags: Stores the price only on the product, so old orders change.
  - level: S
    topic: Scaling
    question: The orders table has 500 million rows and grows fast. What are your options?
    strong: Archiving, partitioning by date, read replicas, caching, sharding only when needed, migrations without downtime.
    redFlags: Jumps straight to switching databases.
  - level: F
    topic: Joins
    question: What is the difference between INNER JOIN and LEFT JOIN? Give an example.
    strong: INNER keeps matching rows only; LEFT keeps all left rows with NULLs where nothing matches, e.g. customers with no orders.
    redFlags: Can't explain NULLs in the result.
  - level: F
    topic: Aggregates
    question: Write a query for the number of orders per customer, only for customers with more than 5 orders.
    strong: GROUP BY customer_id with COUNT(*) and HAVING COUNT(*) > 5; explains WHERE vs HAVING.
    redFlags: Uses WHERE on the count.
  - level: F
    topic: Keys
    question: What is a primary key and a foreign key?
    strong: Primary key uniquely identifies a row; foreign key references another table's key and enforces integrity.
    redFlags: Thinks foreign keys are just naming.
  - level: F
    topic: 'NULL'
    question: Why does WHERE email = NULL return nothing?
    strong: NULL isn't equal to anything; use IS NULL; NULLs in NOT IN cause surprises.
    redFlags: Doesn't know IS NULL.
  - level: F
    topic: Ordering
    question: How do you get the 10 most recent orders?
    strong: ORDER BY created_at DESC LIMIT 10 (or FETCH FIRST); an index on created_at helps.
    redFlags: Sorts in application code.
  - level: F
    topic: Normalisation
    question: What is normalisation, and why might you sometimes denormalise?
    strong: Remove duplication into related tables; denormalise for read speed or reporting, accepting update cost.
    redFlags: Never heard of it.
  - level: J
    topic: Indexes
    question: How does an index speed up a query, and when does it not help?
    strong: B-tree lets the database find rows without scanning; doesn't help with low selectivity, functions on the column, or leading wildcards.
    redFlags: Indexes every column.
  - level: J
    topic: Explain
    question: How do you find out why a query is slow?
    strong: 'EXPLAIN (ANALYZE): scans vs index use, row estimates, join methods, sorts; then fix indexes or rewrite.'
    redFlags: Guesses and adds indexes randomly.
  - level: J
    topic: Window functions
    question: Find each customer's latest order using a window function.
    strong: ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC) and filter rn = 1.
    redFlags: Correlated subqueries only, with no idea of cost.
  - level: J
    topic: Transactions
    question: What does ACID mean, with an example of why it matters?
    strong: Atomic, consistent, isolated, durable; a money transfer must debit and credit together.
    redFlags: Recites letters without meaning.
  - level: J
    topic: Isolation
    question: What is a dirty read, a non-repeatable read and a phantom? Which isolation levels prevent them?
    strong: Read uncommitted allows all; read committed stops dirty reads; repeatable read stops non-repeatable; serializable stops phantoms (engine
      details vary).
    redFlags: Doesn't know isolation levels exist.
  - level: J
    topic: Composite indexes
    question: You often query WHERE status = ? AND created_at > ?. What index would you add and in what column order?
    strong: '(status, created_at): equality first, then range; explains the leftmost prefix rule.'
    redFlags: Two separate single-column indexes, without reasons.
  - level: J
    topic: Injection
    question: How does SQL injection happen and how do you stop it?
    strong: Concatenating user input into SQL; use parameterised queries or an ORM; least-privilege DB user.
    redFlags: Escapes quotes by hand.
  - level: J
    topic: CTE
    question: What is a CTE, and when is a recursive CTE useful?
    strong: A named subquery (WITH); recursive CTEs walk hierarchies like org charts or category trees.
    redFlags: Never used one.
  - level: S
    topic: Locking
    question: Two transactions deadlock. What is happening and how do you prevent it?
    strong: Each holds a lock the other needs; access rows in a consistent order, keep transactions short, retry on deadlock errors.
    redFlags: Doesn't know what a deadlock is.
  - level: S
    topic: Scaling
    question: Your database is the bottleneck. What do you try, in order?
    strong: Fix queries and indexes, connection pooling, caching, read replicas, partitioning, then sharding; measure at each step.
    redFlags: Jumps straight to sharding or NoSQL.
  - level: S
    topic: Partitioning
    question: When would you partition a large table, and by what?
    strong: 'Very large tables with time-based queries or archiving: range by date; queries must filter on the key; easier deletion of old data.'
    redFlags: Partitions small tables.
  - level: S
    topic: Migrations
    question: How do you add a NOT NULL column to a large live table without downtime?
    strong: Add nullable, backfill in batches, set a default, then add the constraint; check engine locking behaviour.
    redFlags: One ALTER at peak time.
  - level: S
    topic: SQL vs NoSQL
    question: When would you choose a document database over a relational one?
    strong: Flexible documents read together, simple access patterns, huge scale; relational for joins, transactions and integrity.
    redFlags: '"NoSQL is faster" without context.'
  - level: S
    topic: Replication
    question: What problems does reading from a replica cause?
    strong: 'Replication lag: a user may not see their own write; read-your-writes from the primary for that user, or wait for the replica.'
    redFlags: Thinks replicas are always up to date.
  - level: J
    topic: Duplicates
    question: Find duplicate emails in a users table and keep only the oldest row.
    strong: GROUP BY email HAVING COUNT(*) > 1 to find; delete with ROW_NUMBER over email ordered by created_at, keeping rn = 1; add a unique
      index after.
    redFlags: Deletes all duplicates including the original.
  - level: F
    topic: Constraints
    question: How would you make sure two users can't sign up with the same email?
    strong: A UNIQUE constraint (case-insensitive if needed), not just a check in code, because of races.
    redFlags: Checks in code only.
- id: system-design
  name: System design
  intro: 'Give one prompt for 25–30 minutes. A strong candidate drives: clarifies requirements and scale, sketches the main parts, goes deep where
    it matters and names trade-offs. Probe with "what happens when X fails?" and "traffic grows 10×". For leads, add: "How would you roll this
    out, and how would you know it''s working?"'
  questions:
  - level: J
    topic: Design
    question: Design a URL shortener.
    strong: Estimates reads vs writes, generates IDs safely, caches hot links, handles collisions, adds analytics.
    redFlags: Draws microservices before asking about scale.
  - level: J
    topic: Design
    question: Design the notifications system for our app (email, SMS, WhatsApp, in-app).
    strong: Async with a queue, retries with backoff, dedupe keys, user preferences, a dead-letter queue, provider outages.
    redFlags: Sends synchronously inside the request.
  - level: S
    topic: Design
    question: Design an online test platform with timed tests and code execution.
    strong: Server-side deadlines, saving answers as they go, an isolated sandbox for code, a queue for grading at peak.
    redFlags: Trusts the browser's timer and runs code on the app server.
  - level: S
    topic: Design
    question: Design driver matching for a ride-hailing app.
    strong: Frequent location updates, geo-indexing, an in-memory location store, matching latency, consistency trade-offs.
    redFlags: Polls a SQL table every second for nearby drivers.
  - level: S
    topic: Design
    question: Design a rate limiter for a public API.
    strong: Token bucket vs sliding window, Redis counters with atomic operations, per-key limits, 429 with Retry-After.
    redFlags: A counter in each server's memory.
  - level: S
    topic: Design
    question: Design a feed (like LinkedIn's) for 10 million users.
    strong: Fan-out on write vs read, celebrities, ranking, caching, cursor pagination.
    redFlags: One SQL query joining everything at read time.
  - level: J
    topic: Basics
    question: Design a URL shortener. What are the main parts?
    strong: API to create and redirect, key generation (base62 counter or random with collision checks), storage, cache for hot links, analytics
      async.
    redFlags: Jumps to microservices without basics.
  - level: J
    topic: Caching
    question: Where can you add caching in a web app, and what can go wrong?
    strong: Browser, CDN, application (Redis), database; stale data, invalidation, stampedes; set TTLs.
    redFlags: Caches everything forever.
  - level: J
    topic: Load balancing
    question: What does a load balancer do, and how does it know a server is unhealthy?
    strong: Spreads traffic, terminates TLS, health checks remove bad instances; sticky sessions only if needed.
    redFlags: Doesn't know health checks.
  - level: J
    topic: APIs
    question: REST or GraphQL for a mobile app with many screens? Why?
    strong: GraphQL lets clients fetch exactly what they need; REST is simpler to cache and secure; depends on team and clients.
    redFlags: Picks one with no reasons.
  - level: J
    topic: Files
    question: How would you let users upload profile photos?
    strong: Direct upload to object storage with a pre-signed URL, size and type checks, resize in a background job, serve via CDN.
    redFlags: Stores images in the database through the API.
  - level: J
    topic: Search
    question: How would you add search to a product catalogue?
    strong: Start with database full-text search; move to Elasticsearch or OpenSearch for relevance and scale; sync via events.
    redFlags: LIKE "%x%" on millions of rows.
  - level: S
    topic: Scale
    question: Design a news feed for 10 million users.
    strong: Fan-out on write for most users, on read for celebrities, cache feeds, rank, paginate with cursors; trade-offs.
    redFlags: One SQL query joining everything.
  - level: S
    topic: Consistency
    question: Explain eventual consistency to a product manager. Where is it acceptable?
    strong: Data agrees after a short delay; fine for likes or views, not for balances or stock reservations.
    redFlags: Can't give examples.
  - level: S
    topic: Booking
    question: Design a movie ticket booking system so two people can't book the same seat.
    strong: Seat holds with expiry, optimistic locking or a unique constraint on (show, seat), payment within the hold window, release on timeout.
    redFlags: Checks availability then books, with a race.
  - level: S
    topic: Notifications
    question: Design a system to send email, SMS and push notifications.
    strong: Notification service, queue per channel, templates, user preferences, retries and dead letters, provider failover, deduplication.
    redFlags: Sends directly from every service.
  - level: S
    topic: Availability
    question: How do you keep a service up when one data centre fails?
    strong: Multiple zones or regions, stateless services, replicated data, health-based failover, tested runbooks.
    redFlags: Backups only.
  - level: S
    topic: Payments
    question: What must you get right when designing payments?
    strong: Idempotency keys, a ledger with double entry, reconciliation, webhooks verified and retried, never trust the client, audit trail.
    redFlags: Treats it like any CRUD.
  - level: S
    topic: Chat
    question: Design a chat app like WhatsApp for one-to-one messages.
    strong: WebSocket gateways, message store, delivery and read receipts, offline queue with push, ordering per conversation, encryption.
    redFlags: Polling the database every second.
  - level: S
    topic: Estimation
    question: How much storage do you need for 1 million users uploading 2 photos a day for a year?
    strong: 2M photos/day × ~500 KB = ~1 TB/day, ~365 TB/year before replication and thumbnails; states assumptions.
    redFlags: No arithmetic.
  - level: J
    topic: Queues
    question: When would you put a message queue between two services?
    strong: To absorb spikes, decouple availability, retry work, and process asynchronously; adds latency and complexity.
    redFlags: Uses queues for everything.
  - level: S
    topic: Data
    question: How would you design analytics on a busy transactional database without slowing it down?
    strong: Replicate or stream changes (CDC) to a warehouse, run reports there, pre-aggregate.
    redFlags: Runs heavy reports on the primary.
  - level: S
    topic: Trade-offs
    question: Monolith or microservices for a new product with 5 developers?
    strong: A modular monolith first; split when team or scaling needs justify it; clear module boundaries make it possible later.
    redFlags: Microservices by default.
  - level: J
    topic: Sessions
    question: Where do you keep user sessions when you run several app servers?
    strong: A shared store (Redis) or signed tokens; avoid sticky sessions as the only answer.
    redFlags: In each server's memory.
  - level: S
    topic: Idempotency
    question: A client retries a "create order" request after a timeout. How do you avoid duplicate orders?
    strong: Idempotency key stored with the result, unique constraints, return the original response on retry.
    redFlags: Hopes clients don't retry.
  - level: S
    topic: Observability
    question: What do you need to run a system you designed in production?
    strong: Metrics with alerts on symptoms (latency, errors, saturation), structured logs, tracing, dashboards, SLOs, runbooks.
    redFlags: Logs only.
  - level: J
    topic: CDN
    question: What is a CDN and what should you put on it?
    strong: Edge caches near users for static assets, images, video and cacheable pages; cache headers and versioned file names.
    redFlags: Doesn't know what a CDN is.
  - level: S
    topic: Multi-tenancy
    question: How would you design a SaaS app where each client's data must stay separate?
    strong: Tenant id on every row with enforced filters (or row-level security), schema or database per tenant for strict isolation, per-tenant
      limits.
    redFlags: Relies on the UI to hide other clients' data.
- id: microservices
  name: Microservices and messaging
  intro: For backend roles with 3+ years. Look for candidates who know when not to use microservices, and how services talk, fail and stay consistent.
  questions:
  - level: J
    topic: Basics
    question: What problems do microservices solve, and what new problems do they create?
    strong: Independent deploys and scaling, team ownership; network failures, data consistency, observability and operational cost.
    redFlags: Only lists benefits.
  - level: J
    topic: Communication
    question: When should services talk synchronously (HTTP or gRPC) and when through events?
    strong: Sync when the caller needs an answer now; events for notifications and decoupling; avoid long sync chains.
    redFlags: Everything synchronous.
  - level: J
    topic: Kafka
    question: What is a Kafka topic, partition and consumer group?
    strong: A topic is a log split into partitions for parallelism; ordering is per partition; a consumer group shares partitions among consumers.
    redFlags: Thinks Kafka is a database.
  - level: J
    topic: Queues vs logs
    question: 'RabbitMQ or Kafka: how do you choose?'
    strong: RabbitMQ for task queues and routing; Kafka for high-volume event streams, replay and retention.
    redFlags: Can't compare.
  - level: J
    topic: API gateway
    question: What does an API gateway do?
    strong: 'One entry point: routing, auth, rate limits, TLS, request shaping; not business logic.'
    redFlags: Puts business logic in the gateway.
  - level: J
    topic: Service discovery
    question: How does one service find another in Kubernetes?
    strong: A Service gives a stable DNS name and load balances across pods.
    redFlags: Hard-codes IP addresses.
  - level: J
    topic: Contracts
    question: How do you change an API without breaking other teams?
    strong: Backward-compatible changes, versioning, deprecation periods, consumer-driven contract tests.
    redFlags: Changes fields and tells people later.
  - level: S
    topic: Data
    question: Why does each microservice usually own its database, and how do you get data from another service?
    strong: Independence and encapsulation; get data by API or events, keep local read copies; no shared tables.
    redFlags: Every service queries one shared database.
  - level: S
    topic: Sagas
    question: How do you place an order that touches payment, stock and shipping services without a distributed transaction?
    strong: Saga with local transactions and compensating actions, orchestrated or choreographed; idempotent steps.
    redFlags: Uses two-phase commit everywhere.
  - level: S
    topic: Delivery
    question: At-least-once delivery means duplicate messages. How do you handle them?
    strong: 'Idempotent consumers: dedupe by message id, upserts, or natural keys.'
    redFlags: Assumes exactly once.
  - level: S
    topic: Ordering
    question: How do you keep events for the same order in order with Kafka?
    strong: Use the order id as the message key so events go to one partition; a single consumer per partition.
    redFlags: Thinks Kafka orders everything globally.
  - level: S
    topic: Failures
    question: A downstream service is failing. How do you stop it from taking down yours?
    strong: Timeouts, circuit breakers, bulkheads, fallbacks, retries with backoff and jitter, shed load.
    redFlags: Retries immediately and forever.
  - level: S
    topic: Outbox
    question: What is the transactional outbox pattern?
    strong: Write the event into an outbox table in the same DB transaction, a relay publishes it, so state and events never disagree.
    redFlags: Publishes to the broker inside the DB transaction.
  - level: S
    topic: Observability
    question: How do you debug a request that fails somewhere across five services?
    strong: Distributed tracing with a correlation id, centralised logs, metrics per service; find the failing span.
    redFlags: SSHs into each server.
  - level: S
    topic: Decomposition
    question: How do you decide where to draw service boundaries?
    strong: Business capabilities and bounded contexts, team ownership, data that changes together stays together.
    redFlags: One service per database table.
  - level: S
    topic: Migration
    question: How would you split a monolith into services safely?
    strong: 'Strangler fig: route one capability at a time to a new service, keep both running, migrate data, remove from the monolith.'
    redFlags: Big-bang rewrite.
  - level: S
    topic: Dead letters
    question: What is a dead-letter queue and what do you do with it?
    strong: Where messages go after repeated failures; alert, inspect, fix and replay; don't let it fill silently.
    redFlags: Drops failed messages.
  - level: S
    topic: Schema
    question: How do you evolve event formats when many consumers read them?
    strong: Schema registry (Avro, Protobuf), backward-compatible changes, version fields, upcasting.
    redFlags: Changes JSON fields freely.
  - level: J
    topic: gRPC
    question: When would you use gRPC instead of REST between services?
    strong: Typed contracts, fast binary protocol, streaming, generated clients; less friendly for browsers and debugging.
    redFlags: Never heard of it.
  - level: S
    topic: Testing
    question: How do you test a system of microservices?
    strong: Unit tests per service, contract tests between services, a few end-to-end tests, testing in production with canaries and monitoring.
    redFlags: Only end-to-end tests.
  - level: S
    topic: Security
    question: How do services authenticate each other?
    strong: mTLS in a service mesh, or short-lived tokens (OAuth client credentials), least privilege, no shared static keys.
    redFlags: Trusts anything inside the network.
  - level: J
    topic: Config
    question: How do you manage configuration and secrets for 20 services?
    strong: Environment-specific config, a secrets manager (Vault, AWS Secrets Manager), injected at runtime, rotated.
    redFlags: Secrets in Git.
  - level: S
    topic: Cost
    question: Microservices are costing too much to run. Where do you look?
    strong: Over-provisioned pods, chatty calls, duplicated infrastructure per service, logging volume; consider merging services.
    redFlags: Adds more services.
  - level: S
    topic: CQRS
    question: What is CQRS and when is it worth it?
    strong: Separate models for writes and reads, often with events updating read views; worth it for complex domains or heavy read scaling.
    redFlags: Uses it for simple CRUD.
  - level: J
    topic: Idempotency
    question: What does it mean for an API to be idempotent, and which HTTP methods should be?
    strong: Repeating the call has the same effect; GET, PUT and DELETE should be; POST needs idempotency keys.
    redFlags: Doesn't know the term.
- id: cs-fundamentals
  name: CS fundamentals
  intro: Good for freshers and as warm-ups for everyone.
  questions:
  - level: F
    topic: Networks
    question: What happens when you type a URL into the browser and press Enter?
    strong: DNS, TCP and TLS handshakes, the HTTP request, the server, the response, rendering, caching along the way.
    redFlags: Stops at "it goes to the server".
  - level: F
    topic: Operating systems
    question: Process vs thread.
    strong: Memory isolation vs shared memory, the cost of switching, crashes and safety.
    redFlags: Uses the words interchangeably.
  - level: F
    topic: OOP
    question: Explain the four OOP principles with an example from your own code.
    strong: Encapsulation, inheritance, polymorphism, abstraction, each with a real example.
    redFlags: Textbook definitions only, no example.
  - level: F
    topic: Networks
    question: 'TCP vs UDP: when would you use UDP?'
    strong: Reliability and ordering vs latency; video calls, gaming, DNS.
    redFlags: Says UDP is "unsafe" with no trade-off.
  - level: J
    topic: Concurrency
    question: What is a deadlock, and how do you prevent one?
    strong: The four conditions, lock ordering, timeouts.
    redFlags: Can't give an example.
  - level: J
    topic: Git
    question: 'Git: merge vs rebase, and how do you undo a bad commit that is already pushed?'
    strong: History shape, never rewriting shared history, git revert for pushed commits.
    redFlags: Force-pushes to main.
  - level: J
    topic: Distributed systems
    question: What does the CAP theorem really say, and where does it show up in practice?
    strong: Behaviour during a network partition, consistency vs availability, tunable consistency.
    redFlags: Thinks you pick any two at all times.
  - level: S
    topic: Security
    question: How do you keep secrets out of code and logs?
    strong: Env vars or a vault, rotation, scanning repos, redacting logs, least privilege.
    redFlags: Keeps a shared .env file in the repo.
  - level: F
    topic: OS
    question: What is the difference between a process and a thread?
    strong: A process has its own memory; threads share their process's memory; threads are cheaper but need synchronisation.
    redFlags: Thinks they're the same.
  - level: F
    topic: Networking
    question: What is an IP address and a port?
    strong: An IP identifies a machine on a network; a port identifies a service on it (443 for HTTPS, 5432 for PostgreSQL).
    redFlags: Can't explain ports.
  - level: F
    topic: HTTP
    question: What do the status code ranges 2xx, 3xx, 4xx and 5xx mean?
    strong: Success, redirect, client error, server error; examples like 201, 301, 404, 503.
    redFlags: Doesn't know 4xx vs 5xx.
  - level: F
    topic: Databases
    question: What is the difference between SQL and NoSQL databases?
    strong: Tables with schema and joins vs flexible models (documents, key-value); trade-offs on consistency and scaling.
    redFlags: Thinks NoSQL means no queries.
  - level: F
    topic: OOP
    question: Explain encapsulation, inheritance and polymorphism with an example.
    strong: Hide state behind methods; reuse via subclassing; one interface, many implementations (shapes with area()).
    redFlags: Recites definitions with no example.
  - level: F
    topic: Memory
    question: What is the difference between stack and heap memory?
    strong: 'Stack: per-thread, function frames, automatic; heap: dynamic objects, shared, garbage-collected or freed.'
    redFlags: Doesn't know.
  - level: J
    topic: Concurrency
    question: What is a race condition, and how do you prevent one?
    strong: Result depends on timing of threads; prevent with locks, atomic operations, immutability or confinement.
    redFlags: Adds sleeps.
  - level: J
    topic: Scheduling
    question: What does the operating system do when there are more threads than CPU cores?
    strong: Time-slices threads with context switches; too many threads cost memory and switching time; use pools sized to the work.
    redFlags: Thinks each thread gets its own core.
  - level: J
    topic: Networking
    question: 'TCP vs UDP: what are the differences and where is each used?'
    strong: TCP reliable ordered connection (web, email); UDP fast, no guarantees (video calls, games, DNS).
    redFlags: Thinks UDP is obsolete.
  - level: J
    topic: HTTPS
    question: How does HTTPS keep data private?
    strong: TLS handshake with certificates proves the server, agrees on keys, then encrypts traffic with symmetric keys.
    redFlags: Thinks HTTPS hides which site you visit.
  - level: J
    topic: Hashing
    question: What is the difference between hashing, encryption and encoding?
    strong: Hashing is one-way (passwords with salt); encryption is reversible with a key; encoding (Base64) is just representation.
    redFlags: Thinks Base64 is encryption.
  - level: J
    topic: Memory
    question: What is virtual memory, and what is a page fault?
    strong: Each process sees its own address space mapped to physical memory; a page fault loads a page from disk; thrashing.
    redFlags: Never heard of it.
  - level: S
    topic: Distributed
    question: Explain the CAP theorem with a real example.
    strong: During a network partition you choose consistency or availability; e.g. a bank chooses consistency, a social feed availability.
    redFlags: Thinks you choose any two at all times.
  - level: S
    topic: Time
    question: Why are clocks a problem in distributed systems?
    strong: Clocks drift; you can't order events by timestamps alone; use logical clocks, sequence numbers or a single writer.
    redFlags: Trusts server time for ordering.
  - level: S
    topic: Performance
    question: Why can reading memory sequentially be much faster than randomly?
    strong: CPU caches and prefetching work on nearby data; random access misses cache; arrays beat linked structures.
    redFlags: Thinks all memory access costs the same.
  - level: S
    topic: Compilers
    question: What does a JIT compiler do, and why do Java and JavaScript use one?
    strong: Compiles hot code to machine code at runtime using real usage data; warm-up time is the cost.
    redFlags: Thinks they're purely interpreted.
  - level: F
    topic: Binary
    question: Convert 13 to binary and explain how.
    strong: '1101: repeated division by 2 or powers of two (8 + 4 + 1).'
    redFlags: Can't do it.
  - level: J
    topic: DNS
    question: How does DNS work, and why might a change take hours to show?
    strong: Resolver queries root, TLD and authoritative servers; answers cached by TTL; old TTLs delay changes.
    redFlags: Thinks DNS is instant.
  - level: S
    topic: Consensus
    question: What problem do Raft or Paxos solve?
    strong: Getting several nodes to agree on a value or log despite failures; used by etcd, ZooKeeper and databases for leader election.
    redFlags: Never heard of consensus.
  - level: J
    topic: Sockets
    question: What is a WebSocket and when would you use it instead of HTTP polling?
    strong: A long-lived two-way connection over one TCP connection; for chat, live updates, collaboration.
    redFlags: Polls every 100 ms.
  - level: F
    topic: Version control
    question: Why do teams use Git?
    strong: History, branching, collaboration, code review and rollback.
    redFlags: Only uses it to upload code.
  - level: S
    topic: Security
    question: What is the principle of least privilege, with an example from your work?
    strong: Give each user or service only the access it needs; e.g. read-only DB user for reports, scoped cloud roles.
    redFlags: Everyone uses admin credentials.
- id: security
  name: Web application security
  intro: For all developer roles, deeper for seniors. Look for habits (validate input, least privilege, secrets out of code) rather than memorised
    acronyms.
  questions:
  - level: F
    topic: Passwords
    question: How should an application store user passwords?
    strong: Hash with a slow, salted algorithm (bcrypt, Argon2); never plain text or reversible encryption; never log them.
    redFlags: Encrypts or uses MD5.
  - level: F
    topic: Input
    question: Why should you never trust input from the browser?
    strong: Users can change anything (hidden fields, prices, ids); validate and authorise on the server.
    redFlags: Relies on front-end validation.
  - level: F
    topic: HTTPS
    question: Why must a login page use HTTPS?
    strong: Otherwise passwords and cookies travel in plain text and can be read or changed on the network.
    redFlags: Thinks HTTPS is only for payment pages.
  - level: F
    topic: Secrets
    question: You accidentally pushed an API key to GitHub. What do you do?
    strong: Revoke and rotate the key immediately, then remove it from history; check logs for misuse.
    redFlags: Deletes the file in a new commit and moves on.
  - level: F
    topic: Auth basics
    question: What is the difference between authentication and authorisation?
    strong: Who you are vs what you may do.
    redFlags: Uses them as synonyms.
  - level: F
    topic: SQL injection
    question: Show how SQL injection works on a login query, and the fix.
    strong: Concatenated input like ' OR 1=1 -- changes the query; use parameterised queries.
    redFlags: Can't demonstrate it.
  - level: J
    topic: XSS
    question: What is cross-site scripting, and how do you prevent it?
    strong: Untrusted data runs as script in other users' browsers; escape output, avoid innerHTML, Content Security Policy, HttpOnly cookies.
    redFlags: Filters "<script>" with a regex.
  - level: J
    topic: CSRF
    question: What is CSRF, and when do you need protection against it?
    strong: Another site makes the browser send an authenticated request with cookies; use SameSite cookies and CSRF tokens; not needed for bearer
      tokens in headers.
    redFlags: Never heard of it.
  - level: J
    topic: Access control
    question: A user changes /orders/123 to /orders/124 in the URL and sees someone else's order. What went wrong and how do you fix it?
    strong: Broken object-level authorisation (IDOR); check ownership on every request on the server; test for it.
    redFlags: Uses random ids as the only fix.
  - level: J
    topic: JWT
    question: What are the common mistakes with JWTs?
    strong: Not verifying signature or algorithm, long expiry, sensitive data in the payload, no revocation, storing in localStorage open to XSS.
    redFlags: Thinks JWTs are encrypted.
  - level: J
    topic: OWASP
    question: Name three items from the OWASP Top 10 and one defence for each.
    strong: Broken access control (server checks), injection (parameterised queries), security misconfiguration (hardening), vulnerable components
      (updates).
    redFlags: Can't name any.
  - level: J
    topic: Dependencies
    question: How do you keep third-party libraries from becoming a security risk?
    strong: Dependency scanning (Dependabot, Snyk, npm audit), regular updates, lock files, few and well-maintained libraries.
    redFlags: Never updates.
  - level: J
    topic: CORS
    question: What is CORS, and does it protect your API?
    strong: Browsers block cross-origin reads unless allowed; it protects users' browsers, not your API; never "*" with credentials.
    redFlags: Thinks CORS is server security.
  - level: J
    topic: Uploads
    question: What can go wrong with file uploads?
    strong: Executable or oversized files, path traversal, malware, content-type spoofing; validate type and size, store outside the web root,
      scan, random names.
    redFlags: Saves files as given.
  - level: S
    topic: OAuth
    question: Explain the OAuth 2.0 authorisation code flow with PKCE.
    strong: Redirect to the provider, user consents, code returned, exchanged for tokens with a verifier; protects public clients from code interception.
    redFlags: Confuses OAuth with storing passwords.
  - level: S
    topic: Threat modelling
    question: How would you threat-model a new feature?
    strong: Draw data flows and trust boundaries, list threats (STRIDE), rate risk, decide mitigations, revisit with changes.
    redFlags: Security is the security team's job.
  - level: S
    topic: Logging
    question: What should and shouldn't go into application logs from a security point of view?
    strong: Log auth events, access denials and admin actions with ids; never passwords, tokens or full card numbers; protect and retain logs.
    redFlags: Logs whole request bodies.
  - level: S
    topic: SSRF
    question: What is server-side request forgery, and how do you prevent it?
    strong: The server is tricked into calling internal URLs (cloud metadata); allow-lists, block private ranges, no redirects, network egress
      controls.
    redFlags: Never heard of it.
  - level: S
    topic: Secrets
    question: How should a team manage secrets across environments?
    strong: A secrets manager, short-lived credentials, least privilege, rotation, audit; nothing in code, images or chat.
    redFlags: A shared .env file in Slack.
  - level: S
    topic: Incident
    question: You suspect user data was leaked. What are your first steps?
    strong: Contain (rotate keys, block access), preserve evidence, assess scope, inform security and legal, notify users and regulators as required,
      fix root cause.
    redFlags: Quietly patches and says nothing.
  - level: S
    topic: Rate limiting
    question: How do you protect a login endpoint from brute force?
    strong: Rate limits per account and IP, lockouts or delays, CAPTCHA after failures, MFA, alerting.
    redFlags: Nothing.
  - level: J
    topic: Headers
    question: Which HTTP security headers would you set on a web app?
    strong: Content-Security-Policy, Strict-Transport-Security, X-Content-Type-Options, frame-ancestors or X-Frame-Options, Referrer-Policy.
    redFlags: None.
  - level: S
    topic: Privacy
    question: How do you handle personal data like phone numbers and ID documents in an app?
    strong: Collect only what's needed, restrict access by role, encrypt at rest, mask in UIs and logs, retention limits, audit access (and laws
      like India's DPDP Act).
    redFlags: Stores everything forever, visible to all staff.
  - level: F
    topic: Phishing
    question: How would you recognise a phishing email asking you to reset your work password?
    strong: Check the sender domain and links, urgency tricks, go to the site directly, report it.
    redFlags: Clicks the link.
- id: testing
  name: Unit testing and code quality
  intro: For all developer roles. Ask in the candidate's main language (JUnit and Mockito, pytest, Jest). Strong candidates test behaviour, keep
    tests fast and readable, and treat code review as a team habit.
  questions:
  - level: F
    topic: Basics
    question: Why write unit tests if the code already works?
    strong: Catch regressions, document behaviour, allow safe refactoring, design feedback; faster than manual checks.
    redFlags: '"Testers do testing."'
  - level: F
    topic: Writing
    question: Write a unit test for a function that returns true if a number is prime.
    strong: 'Cases: 2, 3, 4, 1, 0, negatives, a large prime; clear names; arrange-act-assert.'
    redFlags: Tests only 7.
  - level: F
    topic: Names
    question: What makes a good test name?
    strong: Says the behaviour and condition, e.g. returnsZeroForEmptyCart; reads like documentation.
    redFlags: test1, test2.
  - level: F
    topic: JUnit / pytest
    question: How do you test that a function throws an error for bad input?
    strong: assertThrows in JUnit, pytest.raises, expect().toThrow in Jest; also check the message.
    redFlags: Try-catch with no assertion.
  - level: F
    topic: Coverage
    question: Is 100% test coverage a good goal?
    strong: Coverage shows untested code but not test quality; focus on important logic and edge cases.
    redFlags: Yes, always.
  - level: F
    topic: Debugging
    question: A test fails only on the CI server, not on your laptop. What could cause it?
    strong: Time zone or locale, test order or shared state, environment variables, timing, file paths, missing services.
    redFlags: Disables the test.
  - level: J
    topic: Mocks
    question: When should you use a mock, and when is it harmful?
    strong: For slow or external dependencies (APIs, clocks); harmful when mocking your own logic or every collaborator, making tests brittle.
    redFlags: Mocks everything.
  - level: J
    topic: Mockito
    question: How do you verify that a service sends an email when an order is placed?
    strong: Mock the email client, call the method, verify the call with expected arguments (or capture them).
    redFlags: Sends real emails in tests.
  - level: J
    topic: Integration
    question: What is the difference between unit and integration tests, and how do you run a real database in tests?
    strong: Unit tests isolate logic; integration tests check pieces together; Testcontainers for a real database.
    redFlags: Uses an in-memory database that behaves differently.
  - level: J
    topic: TDD
    question: What is test-driven development? Have you used it?
    strong: Write a failing test, make it pass, refactor; helps design; honest about when they use it.
    redFlags: Claims to always do TDD but can't describe the cycle.
  - level: J
    topic: Time
    question: How do you test code that depends on the current time?
    strong: Inject a Clock or time provider; freeze time in tests (freezegun, fake timers).
    redFlags: Sleeps in tests.
  - level: J
    topic: Code review
    question: What do you look for when reviewing a pull request?
    strong: Correctness, tests, readability, naming, security, edge cases, consistency; small, kind, specific comments.
    redFlags: Only formatting.
  - level: J
    topic: Refactoring
    question: How do you safely refactor a messy function with no tests?
    strong: Add characterisation tests first, small steps, run tests after each, commit often.
    redFlags: Rewrites it in one go.
  - level: J
    topic: Static analysis
    question: What do linters and static analysis tools (Sonar, ESLint) give you?
    strong: Catch bugs and smells early, consistent style, security checks; enforced in CI.
    redFlags: Turns them off.
  - level: S
    topic: Strategy
    question: How would you set up the testing strategy for a new service?
    strong: Test pyramid, fast unit tests, contract and integration tests for boundaries, a few end-to-end, run in CI, coverage on critical paths.
    redFlags: Manual testing before release.
  - level: S
    topic: Flaky tests
    question: Your test suite has 5% flaky tests. What do you do?
    strong: Track flakiness, quarantine with owners, fix root causes (shared state, timing, order), never just retry silently.
    redFlags: Re-run until green.
  - level: S
    topic: Clean code
    question: Show me a piece of your code you're proud of and one you'd write differently now.
    strong: Specific examples, why choices were made, what they learned.
    redFlags: Can't criticise their own code.
  - level: S
    topic: Design
    question: How do tests influence the design of your code?
    strong: Hard-to-test code often has too many responsibilities or hidden dependencies; tests push toward small units and injected dependencies.
    redFlags: Tests are written after, no influence.
  - level: S
    topic: Mutation testing
    question: What is mutation testing?
    strong: Small changes to code (mutants) should make tests fail; shows weak assertions (PIT, Stryker).
    redFlags: Never heard of it.
  - level: S
    topic: Standards
    question: How do you raise code quality across a team without slowing it down?
    strong: Automate checks in CI, agree on conventions, review culture, pair programming, small PRs, refactoring time.
    redFlags: Strict rules enforced by one person.
  - level: J
    topic: Parameterised
    question: When would you use parameterised tests?
    strong: Same behaviour across many inputs (@ParameterizedTest, pytest.mark.parametrize, test.each); keeps tests short.
    redFlags: Copies the same test 10 times.
  - level: F
    topic: Readability
    question: What makes code readable to someone else?
    strong: Clear names, small functions, consistent style, no clever tricks, comments explaining why.
    redFlags: Short variable names to save typing.
  - level: J
    topic: Documentation
    question: What should a README for a service contain?
    strong: What it does, how to run and test it locally, configuration, deployment, owners, links.
    redFlags: Nothing; "read the code".
  - level: S
    topic: Debt
    question: How do you decide when to pay down technical debt?
    strong: When it slows current work or causes incidents; make it visible, tie to business impact, do it alongside features.
    redFlags: Never, or a big rewrite.
- id: git-practices
  name: Git and engineering practices
  intro: 'For all developer roles. Ask how they work day to day: branches, pull requests, releases and working with others. Freshers should know
    the basics; seniors should shape team practices.'
  questions:
  - level: F
    topic: Basics
    question: What do git add, commit and push each do?
    strong: Stage changes, record a snapshot locally, send commits to the remote.
    redFlags: Thinks commit uploads code.
  - level: F
    topic: Branches
    question: Why work on a branch instead of directly on main?
    strong: Isolate work, review before merging, keep main releasable.
    redFlags: Commits straight to main.
  - level: F
    topic: Conflicts
    question: How do you resolve a merge conflict?
    strong: Open the conflicting files, understand both changes, combine them correctly, run tests, then commit.
    redFlags: Picks "mine" every time.
  - level: F
    topic: Commits
    question: What makes a good commit message?
    strong: A short summary of what and why, focused commits, references to the issue.
    redFlags: '"fix", "changes", "wip".'
  - level: F
    topic: Undo
    question: You committed something wrong but haven't pushed. How do you fix it?
    strong: git commit --amend or git reset; if pushed to a shared branch, git revert instead.
    redFlags: Deletes the repository and clones again.
  - level: F
    topic: .gitignore
    question: What should go in .gitignore?
    strong: Build output, dependencies (node_modules, target), local config and secrets, IDE files.
    redFlags: Commits node_modules and .env.
  - level: J
    topic: Rebase
    question: When would you rebase, and when should you never rebase?
    strong: Rebase your own branch to update or tidy it; never rewrite history others have pulled.
    redFlags: Rebases shared branches and force-pushes.
  - level: J
    topic: Pull requests
    question: What makes a pull request easy to review?
    strong: Small and focused, clear description and screenshots, tests, self-reviewed, linked issue.
    redFlags: One 3,000-line PR.
  - level: J
    topic: Branching
    question: 'Trunk-based development vs Git Flow: which would you choose and why?'
    strong: Trunk-based with short-lived branches and feature flags for continuous delivery; Git Flow for scheduled releases.
    redFlags: Doesn't know either.
  - level: J
    topic: Bisect
    question: A bug appeared sometime in the last 100 commits. How do you find which one?
    strong: git bisect with a test to check each step; O(log n) commits.
    redFlags: Reads every commit.
  - level: J
    topic: Feature flags
    question: What are feature flags and what do they cost?
    strong: 'Turn features on or off without deploying; enable gradual rollout; cost: complexity and stale flags to clean up.'
    redFlags: Uses long-lived branches instead.
  - level: J
    topic: Agile
    question: How does your team plan and track work?
    strong: Describes their real process (Scrum or Kanban), estimation, stand-ups, retrospectives, and what worked or didn't.
    redFlags: Recites the Scrum guide with no experience.
  - level: J
    topic: Versioning
    question: What is semantic versioning?
    strong: 'MAJOR.MINOR.PATCH: breaking, new features, fixes; helps consumers know what''s safe.'
    redFlags: Random version numbers.
  - level: S
    topic: Releases
    question: How do you release safely and often?
    strong: CI/CD, small changes, automated tests, feature flags, canary or blue-green, monitoring and quick rollback.
    redFlags: Big releases every few months with a long freeze.
  - level: S
    topic: Monorepo
    question: Monorepo or many repositories for a team with 10 services?
    strong: Monorepo eases shared code and atomic changes but needs tooling; multi-repo gives independence; choose by team and coupling.
    redFlags: Strong opinion with no trade-offs.
  - level: S
    topic: Code ownership
    question: How do you keep a growing code base healthy with many contributors?
    strong: Code owners, conventions, automated checks, architecture decision records, regular refactoring, onboarding docs.
    redFlags: Relies on one expert.
  - level: S
    topic: Postmortems
    question: What happens after an incident in a healthy team?
    strong: 'Blameless postmortem: timeline, root causes, action items with owners, follow-up; share learnings.'
    redFlags: Find who to blame.
  - level: S
    topic: Estimation
    question: Your team's estimates are always wrong. What do you change?
    strong: Smaller tasks, track actuals, include unknowns, use ranges, slice work, review in retros.
    redFlags: Pads every estimate by 3x.
  - level: S
    topic: Documentation
    question: What documentation does a team really need?
    strong: README and setup, architecture overview, decision records, runbooks for on-call, API docs; kept close to code.
    redFlags: None, or huge outdated wikis.
  - level: J
    topic: Hooks
    question: What would you run in pre-commit hooks or CI checks?
    strong: Formatter, linter, fast tests, secret scanning, commit message checks; keep hooks fast.
    redFlags: Nothing.
  - level: F
    topic: Remote work
    question: How do you keep your team updated when working remotely?
    strong: Clear written updates, raises blockers early, keeps tickets current, joins stand-ups, asks questions in the open.
    redFlags: Disappears until done.
  - level: S
    topic: Hiring
    question: What do you look for when you interview other engineers?
    strong: Problem solving, communication, learning ability, collaboration, depth matching the role; structured, fair process.
    redFlags: Trick questions.
- id: devops-cloud
  name: DevOps and cloud
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Docker
    question: Image vs container; what does each line of a simple Dockerfile do?
    strong: Layers, cache order (dependencies before code), small base images, a non-root user.
    redFlags: Copies the whole repo before installing dependencies.
  - level: F
    topic: Linux
    question: A Linux server is slow. What commands do you run first?
    strong: top or htop, df -h, free -m, journalctl or /var/log, finding the busiest process.
    redFlags: Reboots first.
  - level: F
    topic: CI/CD
    question: Walk me through a CI/CD pipeline you've built or used.
    strong: Build, test, scan, artefact, deploy per environment, approvals, rollback.
    redFlags: Only "Jenkins runs it".
  - level: J
    topic: Kubernetes
    question: A pod is in CrashLoopBackOff. How do you debug it?
    strong: kubectl describe, logs --previous, probes, resource limits (OOMKilled), config and secrets.
    redFlags: Deletes the pod and hopes.
  - level: J
    topic: Deployments
    question: 'Rolling vs blue-green vs canary: when do you use each?'
    strong: Risk, cost, rollback speed, database migrations that work both ways.
    redFlags: Thinks a rolling update can't break anything.
  - level: J
    topic: Terraform
    question: How does Terraform state work, and what goes wrong in a team?
    strong: Remote state with locking, drift, plan before apply, modules, never editing state by hand.
    redFlags: Keeps state files in Git.
  - level: J
    topic: Cloud
    question: On AWS, Azure or GCP, how do you give an app access to a storage bucket safely?
    strong: IAM roles, managed identities or service accounts; least privilege; no static keys.
    redFlags: Puts access keys in the image's environment variables.
  - level: S
    topic: Reliability
    question: Define SLIs, SLOs and an error budget for an API, and how they change releases.
    strong: Latency and availability SLIs, a target, spending the budget, pausing releases when it's gone.
    redFlags: Alerts on CPU only.
  - level: S
    topic: Cost
    question: Our cloud bill doubled this month. How do you find out why?
    strong: Cost explorer by service and tag, untagged resources, data transfer, idle instances, rightsizing, reserved or spot.
    redFlags: Cuts instances at random.
  - level: F
    topic: Docker
    question: What is the difference between a Docker image and a container?
    strong: An image is a read-only template built in layers; a container is a running instance with its own writable layer.
    redFlags: Uses the words interchangeably.
  - level: F
    topic: Docker
    question: Write a simple Dockerfile for a Spring Boot or Node app.
    strong: Base image, copy files, install or build, expose port, CMD; mentions multi-stage builds and .dockerignore.
    redFlags: Can't write one.
  - level: F
    topic: Linux
    question: A service won't start on a Linux server. What commands do you run first?
    strong: systemctl status, journalctl, check logs, disk (df -h), memory (free), ports (ss -ltnp), permissions.
    redFlags: Reboots the server.
  - level: F
    topic: CI/CD
    question: What is continuous integration, and what should a pipeline do on every push?
    strong: Merge often; build, run tests and linters, security scans, produce an artefact; fail fast.
    redFlags: Thinks CI means deploying to production.
  - level: F
    topic: Cloud
    question: What are regions and availability zones?
    strong: Regions are geographic areas; zones are separate data centres in a region; spread across zones for availability.
    redFlags: Doesn't know the difference.
  - level: F
    topic: Git
    question: What is the difference between git merge and git rebase?
    strong: Merge keeps history with a merge commit; rebase replays commits for a linear history; don't rebase shared branches.
    redFlags: Rebases main.
  - level: J
    topic: Docker
    question: How do you make a Docker image smaller and safer?
    strong: Multi-stage builds, slim or distroless base, fewer layers, no secrets in layers, run as non-root, scan images.
    redFlags: Uses a full OS image with build tools.
  - level: J
    topic: Kubernetes
    question: What are a Pod, a Deployment and a Service?
    strong: Pod runs containers; Deployment manages replicas and rolling updates; Service gives stable networking to pods.
    redFlags: Can't explain beyond "it runs containers".
  - level: J
    topic: Kubernetes
    question: What are liveness and readiness probes, and what goes wrong if you confuse them?
    strong: Readiness controls traffic; liveness restarts stuck containers; a too-strict liveness probe causes restart loops.
    redFlags: Uses the same endpoint without thinking.
  - level: J
    topic: Kubernetes
    question: How do ConfigMaps and Secrets get into a pod, and what happens when you change them?
    strong: As environment variables or mounted files; env vars need a restart, mounted files update after a delay; roll the deployment to apply.
    redFlags: Bakes config into the image.
  - level: J
    topic: Jenkins
    question: How would you structure a Jenkins pipeline for a Java service?
    strong: 'Jenkinsfile in the repo: checkout, build with Maven, unit tests, static analysis, image build and push, deploy to staging, approval
      for production.'
    redFlags: Configures jobs by hand in the UI only.
  - level: J
    topic: Infrastructure as code
    question: Why use Terraform, and what is the state file?
    strong: Declarative, reviewable, repeatable infrastructure; state maps code to real resources, stored remotely with locking.
    redFlags: Clicks in the console.
  - level: J
    topic: AWS
    question: Which AWS services would you use to host a web app with a database?
    strong: ECS, EKS or Elastic Beanstalk (or EC2), RDS, S3 and CloudFront for assets, ALB, IAM roles, CloudWatch.
    redFlags: Everything on one EC2 instance with no backups.
  - level: J
    topic: Secrets
    question: Where should database passwords live in a deployment?
    strong: A secrets manager or Kubernetes Secrets (encrypted), injected at runtime, rotated; never in images or Git.
    redFlags: In the Dockerfile.
  - level: S
    topic: Deployments
    question: Compare rolling, blue-green and canary deployments.
    strong: Rolling replaces gradually; blue-green switches traffic between two environments; canary sends a small share first and watches metrics.
    redFlags: Only knows "deploy and hope".
  - level: S
    topic: Reliability
    question: What are SLIs, SLOs and error budgets?
    strong: Indicators like latency or error rate, targets for them, and the allowed failure that decides when to slow releases.
    redFlags: Never heard of them.
  - level: S
    topic: Monitoring
    question: What would you alert on for a web service, and what wouldn't you?
    strong: Alert on user-facing symptoms (error rate, latency, saturation); dashboards for causes like CPU; avoid noisy alerts.
    redFlags: Alerts on CPU > 70%.
  - level: S
    topic: Kubernetes
    question: How do you set resource requests and limits, and what happens when they're wrong?
    strong: Requests for scheduling, limits cap usage; too low causes throttling or OOM kills, too high wastes money; base on measurements.
    redFlags: Leaves them empty.
  - level: S
    topic: Cost
    question: Your cloud bill doubled. How do you find out why and reduce it?
    strong: Cost explorer by service and tag, idle resources, oversized instances, data transfer, storage tiers, reserved or spot capacity.
    redFlags: Turns things off at random.
  - level: S
    topic: Disaster recovery
    question: What are RPO and RTO, and how do they shape your backup plan?
    strong: How much data you can lose and how long you can be down; choose backups, replication and failover accordingly; test restores.
    redFlags: Backups never tested.
  - level: S
    topic: Security
    question: How do you secure a Kubernetes cluster?
    strong: RBAC, network policies, non-root containers, image scanning and signing, secrets encryption, patching, limited API access.
    redFlags: Default settings.
  - level: S
    topic: Azure / GCP
    question: How do Azure and GCP equivalents map to AWS for compute, database and storage?
    strong: AKS/GKE ≈ EKS, Azure SQL/Cloud SQL ≈ RDS, Blob/Cloud Storage ≈ S3, App Service/Cloud Run for simpler hosting.
    redFlags: Knows only one cloud's names and can't generalise.
  - level: J
    topic: Networking
    question: What is a VPC, and what are public and private subnets?
    strong: Your private network in the cloud; public subnets reach the internet via a gateway; private ones for databases, outbound via NAT.
    redFlags: Puts the database in a public subnet.
  - level: J
    topic: Maven
    question: What do Maven's lifecycle phases do, and how do you speed up builds?
    strong: validate, compile, test, package, verify, install, deploy; caches, parallel builds, skipping only in local runs.
    redFlags: Always runs with -DskipTests.
- id: qa-automation
  name: QA automation
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Test design
    question: Write test cases for a login page.
    strong: Positive, negative, boundary, security (SQL injection, lockout), usability, accessibility.
    redFlags: Only "valid login works".
  - level: F
    topic: Defects
    question: Severity vs priority, with an example where they differ.
    strong: Impact vs urgency; a typo in the logo is low severity but high priority.
    redFlags: Uses them as synonyms.
  - level: F
    topic: Defects
    question: Write a good bug report for a checkout failure.
    strong: Steps, expected vs actual, environment, evidence (logs, screenshots), how often it happens.
    redFlags: '"Checkout broken, please fix."'
  - level: J
    topic: Automation
    question: Your UI tests are flaky. What are the usual causes and fixes?
    strong: Fixed sleeps, unstable locators, shared test data, test order; explicit waits, data-testid, isolated data.
    redFlags: Adds retries to every test.
  - level: J
    topic: Tools
    question: 'Selenium vs Playwright vs Cypress: which for a new project?'
    strong: Auto-waiting, browser coverage, speed, language support, team skills.
    redFlags: Picks by popularity alone.
  - level: J
    topic: API testing
    question: How do you test a REST API beyond the happy path?
    strong: Status codes, schema validation, auth, bad inputs, idempotency, contract tests.
    redFlags: Only checks for status 200.
  - level: J
    topic: Frameworks
    question: What goes into a test automation framework?
    strong: Page objects or screenplay, config per environment, test data, reporting, CI integration.
    redFlags: One big script per test.
  - level: S
    topic: Strategy
    question: Write a test strategy for a payments feature launching in four weeks.
    strong: Risk-based scope, the test pyramid, environments, performance and security, entry and exit criteria, go/no-go.
    redFlags: Plans to test everything manually at the end.
  - level: F
    topic: Basics
    question: What is the difference between verification and validation?
    strong: 'Verification: built right (meets the spec); validation: built the right thing (meets user needs).'
    redFlags: Can't tell them apart.
  - level: F
    topic: Test design
    question: Write test cases for a search box on a shopping site.
    strong: Exact and partial matches, no results, special characters, very long input, case, spelling suggestions, filters, performance, empty
      search.
    redFlags: Only a single happy search.
  - level: F
    topic: Techniques
    question: What are boundary value analysis and equivalence partitioning? Apply them to an age field accepting 18–60.
    strong: 'Partitions: <18, 18–60, >60; boundaries 17, 18, 60, 61 and non-numbers.'
    redFlags: Tests random values.
  - level: F
    topic: Bugs
    question: What makes a good bug report?
    strong: Clear title, steps to reproduce, expected vs actual, environment, evidence (screenshots, logs), severity and priority.
    redFlags: '"It doesn''t work."'
  - level: F
    topic: Severity
    question: 'Severity vs priority: give an example of high severity but low priority.'
    strong: Severity is impact, priority is urgency; a crash in a rarely used admin report.
    redFlags: Thinks they're the same.
  - level: F
    topic: Types
    question: What is the difference between smoke, sanity and regression testing?
    strong: 'Smoke: does the build basically work; sanity: does a fix work; regression: did changes break existing features.'
    redFlags: Mixes them up.
  - level: J
    topic: Selenium / Playwright
    question: Why do UI tests become flaky, and how do you fix them?
    strong: Timing (use auto-waits, not sleeps), unstable selectors (use roles or test ids), shared test data, environment issues.
    redFlags: Adds Thread.sleep everywhere.
  - level: J
    topic: Page objects
    question: What is the Page Object Model and why use it?
    strong: A class per page holding selectors and actions; tests read clearly and changes happen in one place.
    redFlags: Selectors copied in every test.
  - level: J
    topic: API testing
    question: How would you test a REST API for creating orders?
    strong: Status codes, response schema, validation errors, auth, idempotency, database side effects, performance; tools like REST Assured or
      Postman with assertions.
    redFlags: Only checks 200.
  - level: J
    topic: CI
    question: How do you run automated tests in a CI pipeline effectively?
    strong: Fast unit and API tests on every push, UI tests in parallel on merge, retries with reporting, artefacts like screenshots and videos.
    redFlags: Runs everything manually before release.
  - level: J
    topic: Test data
    question: How do you manage test data for automated tests?
    strong: Create data per test via API, clean up, avoid shared state, factories, seeded databases in containers.
    redFlags: Depends on data someone created by hand.
  - level: J
    topic: Pyramid
    question: Explain the test pyramid. What happens when it's upside down?
    strong: Many unit tests, fewer API tests, few UI tests; an inverted pyramid is slow, flaky and expensive.
    redFlags: All tests through the UI.
  - level: S
    topic: Strategy
    question: You join a team with no automated tests. What do you do in your first month?
    strong: Understand risk areas, add smoke tests for critical flows, API tests, add to CI, agree on definitions of done, grow coverage where
      bugs happen.
    redFlags: Tries to automate everything at once.
  - level: S
    topic: Performance
    question: How would you load-test a checkout API?
    strong: Define goals (users, RPS, p95), realistic scenarios with k6, JMeter or Gatling, production-like data, monitor the server, find the
      breaking point.
    redFlags: Runs 10 users from a laptop once.
  - level: S
    topic: Contract testing
    question: What is contract testing, and when is it better than end-to-end tests?
    strong: Consumers define expectations (Pact), providers verify them; catches breaking API changes fast without full environments.
    redFlags: Never heard of it.
  - level: S
    topic: Metrics
    question: How do you measure whether testing is effective?
    strong: Escaped defects, flaky rate, time to feedback, coverage of critical paths; not just test counts.
    redFlags: Number of test cases.
  - level: S
    topic: Shift left
    question: What does "shift left" mean for QA in practice?
    strong: QA joins refinement, writes acceptance criteria, pairs with developers, tests early in PRs and with feature flags.
    redFlags: Testing only at the end.
  - level: S
    topic: Mobile
    question: How would you approach testing a mobile app across devices?
    strong: Risk-based device matrix from analytics, emulators plus real-device clouds, Appium or native frameworks, network and battery conditions.
    redFlags: Tests on one phone.
  - level: J
    topic: Security testing
    question: What basic security checks would a QA engineer do?
    strong: Auth and access control (change ids in URLs), input injection, sensitive data exposure, session expiry; OWASP ZAP scans.
    redFlags: Leaves security to others.
  - level: J
    topic: Accessibility testing
    question: How do you include accessibility in testing?
    strong: Keyboard navigation, screen reader checks, axe in automated tests, contrast and zoom checks.
    redFlags: Not considered.
  - level: J
    topic: Exploratory
    question: What is exploratory testing and how do you make it useful?
    strong: Simultaneous learning and testing with a charter and time box; notes and bugs recorded; finds what scripts miss.
    redFlags: Random clicking.
  - level: S
    topic: Release
    question: The release is tomorrow and 3 non-critical bugs are open. What do you recommend?
    strong: Assess risk and workarounds with the product owner, document known issues, monitoring after release, fix-forward plan.
    redFlags: Blocks the release on principle, or says nothing.
- id: data-analytics
  name: Data analytics
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: Statistics
    question: 'Mean vs median: which do you report for salaries, and why?'
    strong: Skew and outliers; the median for a typical value; show both when useful.
    redFlags: Always reports the mean.
  - level: F
    topic: Excel
    question: 'VLOOKUP vs XLOOKUP vs a pivot table: when do you use each?'
    strong: Lookups vs summaries; exact match; XLOOKUP looks left and survives inserted columns.
    redFlags: Doesn't know exact vs approximate match.
  - level: F
    topic: Statistics
    question: Sales and ice-cream ads rose together. Did the ads work?
    strong: Correlation vs causation, confounders (the season), how to test it.
    redFlags: Says yes because the chart goes up.
  - level: J
    topic: Analysis
    question: Daily active users dropped 15% yesterday. How do you investigate?
    strong: Check the data first (pipeline, time zones), then segment by platform, region, version; compare with releases.
    redFlags: Jumps to a business cause before checking the data.
  - level: J
    topic: SQL
    question: Revenue doubled after a join in your query. What happened?
    strong: Joining at the wrong grain duplicated rows; aggregate first or fix the join key.
    redFlags: Hasn't hit or noticed this.
  - level: J
    topic: Dashboards
    question: Design a dashboard for a sales head. What goes on it?
    strong: A few KPIs vs target and last period, trends, drill-downs, agreed definitions, a refresh schedule.
    redFlags: Thirty charts with no comparisons.
  - level: J
    topic: Experiments
    question: How do you run and read an A/B test?
    strong: A hypothesis, sample size before starting, no peeking, guardrail metrics, practical vs statistical significance.
    redFlags: Stops the test the first day p < 0.05.
  - level: S
    topic: Metrics
    question: Two teams report different customer counts. How do you resolve it?
    strong: Compare definitions, filters, time zones, test accounts; agree one definition and document it.
    redFlags: Averages the two numbers.
  - level: F
    topic: SQL
    question: Write a query for total sales by month for this year.
    strong: GROUP BY date truncated to month with SUM, WHERE on the year, ORDER BY month.
    redFlags: Can't group by date parts.
  - level: F
    topic: Excel
    question: 'VLOOKUP vs XLOOKUP vs INDEX-MATCH: which do you use and why?'
    strong: 'XLOOKUP or INDEX-MATCH: lookup left, robust to column changes; exact match by default.'
    redFlags: Only VLOOKUP with approximate match bugs.
  - level: F
    topic: Statistics
    question: When is the median a better summary than the mean?
    strong: Skewed data with outliers, such as salaries or delivery times.
    redFlags: Always uses the mean.
  - level: F
    topic: Charts
    question: Which chart would you use to show sales over 12 months, and which for market share?
    strong: Line chart for trends; bar chart (or a simple pie for few categories) for shares.
    redFlags: A 3D pie for everything.
  - level: F
    topic: Data cleaning
    question: You get a spreadsheet with duplicates, blank cells and dates in different formats. What do you do?
    strong: Profile first, standardise formats, decide on duplicates with a key, handle blanks explicitly, document steps.
    redFlags: Deletes rows that look odd.
  - level: F
    topic: Pivot tables
    question: What can a pivot table do, and when would you use one?
    strong: Summarise and slice data by categories quickly; for exploration and quick reports.
    redFlags: Never used one.
  - level: J
    topic: Metrics
    question: Define daily active users. What questions do you ask before computing it?
    strong: What counts as active, time zone, unique users across devices, bots, logged-out users.
    redFlags: Counts rows in a log.
  - level: J
    topic: Funnels
    question: Conversion from cart to payment dropped 10% last week. How do you investigate?
    strong: Check data quality, segment by device, browser, region, payment method, new release, outages; compare cohorts.
    redFlags: Blames marketing.
  - level: J
    topic: A/B testing
    question: How do you know if an A/B test result is real?
    strong: Pre-set metric and sample size, randomisation check, statistical significance and effect size, run full weeks, avoid peeking.
    redFlags: Stops when it looks good.
  - level: J
    topic: Power BI / Tableau
    question: How do you make a dashboard people actually use?
    strong: Start from the decisions it supports, few key metrics, clear definitions, filters, performance, refresh schedule.
    redFlags: Puts 30 charts on one page.
  - level: J
    topic: SQL
    question: Calculate each month's sales and the change from the previous month.
    strong: Aggregate by month, then LAG() over month ordering, compute difference and percentage.
    redFlags: Self-joins with errors.
  - level: J
    topic: Statistics
    question: What is the difference between correlation and causation? Give an example.
    strong: Ice cream sales and drowning both rise in summer; confounders; experiments establish causation.
    redFlags: Treats correlation as proof.
  - level: J
    topic: Python
    question: How would you use pandas to find the top 5 products by revenue?
    strong: groupby product, sum revenue, sort_values descending, head(5); check missing values.
    redFlags: Loops over rows.
  - level: S
    topic: Modelling
    question: How would you design a data model for sales reporting?
    strong: 'Star schema: fact table (sales) with dimensions (date, product, customer, store); grain decided first.'
    redFlags: One giant flat table without thinking about grain.
  - level: S
    topic: Data quality
    question: How do you make sure numbers in reports are trustworthy?
    strong: Definitions documented, tests on pipelines (row counts, nulls, ranges), reconciliation with source, alerting.
    redFlags: Trusts whatever the query returns.
  - level: S
    topic: Storytelling
    question: How do you present an analysis to senior managers?
    strong: Lead with the answer and recommendation, a few clear charts, what it means, confidence and limits, next steps.
    redFlags: Walks through every step of the analysis.
  - level: S
    topic: Experiment design
    question: A manager wants to know if a new pricing page increases revenue. How would you set it up?
    strong: A/B test with revenue per visitor, guardrail metrics, sample size, duration; or a quasi-experiment if randomisation isn't possible.
    redFlags: Compares last month with this month.
  - level: S
    topic: Pipelines
    question: What is the difference between ETL and ELT, and why is ELT common now?
    strong: Transform before vs after loading; cloud warehouses make transforming in place cheap (dbt).
    redFlags: Doesn't know either.
  - level: J
    topic: Outliers
    question: How do you handle outliers in data?
    strong: Investigate first (error or real), use robust measures, cap or segment, document the decision.
    redFlags: Deletes them automatically.
  - level: S
    topic: Forecasting
    question: How would you forecast next quarter's sales?
    strong: Look at trend and seasonality, simple models first (moving averages, exponential smoothing), back-test, give ranges.
    redFlags: Draws a straight line.
  - level: F
    topic: Percentages
    question: Sales went from 200 to 250. What is the percentage increase? And from 250 back to 200?
    strong: 25% up; 20% down; explains different bases.
    redFlags: Says 25% both ways.
- id: ai-genai
  name: AI and GenAI engineering
  intro: Pick questions at the candidate's level.
  questions:
  - level: F
    topic: ML basics
    question: 'Training vs test data: what is overfitting and how do you spot it?'
    strong: Held-out data, training accuracy far above test accuracy, regularisation, more data.
    redFlags: Evaluates on the training data.
  - level: F
    topic: LLM basics
    question: What are tokens, the context window and temperature in an LLM?
    strong: Text split into tokens, the limit on input plus output, randomness of sampling.
    redFlags: Thinks temperature is speed.
  - level: F
    topic: LLM basics
    question: Why do LLMs hallucinate, and how do you reduce it in an app?
    strong: It predicts likely text, not facts; grounding with retrieval, citations, allowing "I don't know", evaluation.
    redFlags: Says a better prompt fixes it completely.
  - level: J
    topic: RAG
    question: Explain RAG end to end. Where does it usually fail?
    strong: Chunking, embeddings, vector search, reranking, a prompt with sources; most failures are in chunking and retrieval.
    redFlags: Puts whole documents into every prompt.
  - level: J
    topic: Integration
    question: How do you get reliable JSON out of a model for your code?
    strong: Structured output or tool calling, schema validation, retries, never trusting it blindly.
    redFlags: Parses free text with regex.
  - level: J
    topic: Evaluation
    question: How do you evaluate an LLM feature before and after release?
    strong: A test set of real cases, automatic checks, LLM-as-judge with spot checks by people, tracking regressions by model and prompt version.
    redFlags: '"We tried it and it looked fine."'
  - level: S
    topic: Security
    question: What is prompt injection, and how do you defend an agent that reads emails or web pages?
    strong: Treat untrusted content as data, least-privilege tools, confirmation for risky actions, output filtering.
    redFlags: Thinks a system prompt saying "ignore instructions" is enough.
  - level: S
    topic: Architecture
    question: 'Fine-tuning vs RAG vs better prompting: how do you choose?'
    strong: Knowledge that changes means RAG; style or format means fine-tuning; cost, latency and data needs.
    redFlags: Fine-tunes to add facts that change every week.
  - level: S
    topic: Cost
    question: Your LLM feature costs too much and is slow. What do you do?
    strong: Measure tokens per call, prompt caching, smaller models for easy steps, batching, shorter context, streaming.
    redFlags: Only asks for a bigger budget.
  - level: F
    topic: Basics
    question: What is a large language model, in simple terms?
    strong: A model trained on lots of text to predict the next token; it can follow instructions but can be confidently wrong.
    redFlags: Thinks it searches the internet or "knows" facts reliably.
  - level: F
    topic: Prompting
    question: How would you write a prompt to extract the name, email and phone from a résumé?
    strong: Clear task, output format (JSON schema), examples, what to do when missing, low temperature; validate the output.
    redFlags: One vague sentence.
  - level: F
    topic: Limits
    question: What is a hallucination, and how do you reduce it?
    strong: Plausible but false output; ground with sources (RAG), ask for citations, constrain outputs, verify.
    redFlags: Thinks newer models don't hallucinate.
  - level: F
    topic: Use cases
    question: Give an example where using an LLM is a bad idea.
    strong: Exact calculations, decisions needing guarantees, sensitive data without controls; use code or rules instead.
    redFlags: Thinks AI fits everything.
  - level: J
    topic: RAG
    question: Explain retrieval-augmented generation and its main parts.
    strong: Chunk documents, embed, store in a vector index, retrieve relevant chunks for a query, put them in the prompt, generate with citations.
    redFlags: Fine-tunes for every knowledge question.
  - level: J
    topic: Embeddings
    question: What are embeddings and how is similarity measured?
    strong: Vectors capturing meaning; cosine similarity or dot product; used for search, clustering and recommendations.
    redFlags: Can't explain.
  - level: J
    topic: Evaluation
    question: How do you know your LLM feature is getting better or worse?
    strong: A test set of real examples, metrics (accuracy, groundedness), human review, LLM-as-judge with checks, regression runs on prompt changes.
    redFlags: '"It looks good" after a few tries.'
  - level: J
    topic: Tools
    question: What is tool (function) calling and why is it useful?
    strong: The model asks to call defined functions with structured arguments; the app executes and returns results; lets models act and fetch
      data.
    redFlags: Thinks the model runs code itself.
  - level: J
    topic: Cost
    question: How do you keep LLM costs and latency down?
    strong: Smaller models where possible, prompt caching, shorter prompts, streaming, batching, caching answers, limits per user.
    redFlags: Uses the biggest model for everything.
  - level: J
    topic: Chunking
    question: How do you choose chunk size for RAG?
    strong: Depends on documents and queries; keep meaning together (headings, paragraphs), overlap, test retrieval quality.
    redFlags: Fixed 100 characters with no testing.
  - level: S
    topic: Security
    question: What is prompt injection, and how do you defend against it?
    strong: Untrusted content instructs the model; separate instructions from data, limit tool permissions, validate outputs, human approval for
      risky actions.
    redFlags: Thinks a system prompt stops it.
  - level: S
    topic: Agents
    question: What makes an AI agent reliable enough for production?
    strong: Narrow scope, good tools with clear schemas, step limits, observability of each step, evaluations, fallbacks and human review.
    redFlags: Lets it run open-ended.
  - level: S
    topic: Fine-tuning
    question: When would you fine-tune a model instead of prompting or RAG?
    strong: For consistent style or format, narrow tasks at scale, or lower latency with smaller models; not for adding changing facts.
    redFlags: Fine-tunes first.
  - level: S
    topic: Privacy
    question: How do you use LLMs with customer data responsibly?
    strong: Data agreements with the provider, no training on your data, minimise and mask PII, access controls, logging policies, regional hosting.
    redFlags: Pastes everything in.
  - level: S
    topic: Architecture
    question: Design a support chatbot that answers from your help centre and hands over to humans.
    strong: RAG over help articles, confidence and citation checks, escalation rules, conversation memory, analytics, feedback loop.
    redFlags: A prompt with no retrieval or handover.
  - level: S
    topic: Monitoring
    question: What would you monitor for an LLM feature in production?
    strong: Latency, cost, error rate, refusal rate, user feedback, groundedness samples, drift after model updates.
    redFlags: Nothing beyond uptime.
  - level: J
    topic: Structured output
    question: How do you make sure an LLM returns valid JSON your code can use?
    strong: Structured output or JSON mode with a schema, validation and retry, clear examples.
    redFlags: Parses free text with regex.
  - level: F
    topic: Tokens
    question: What is a token and why does it matter?
    strong: A piece of text the model reads and writes; limits context size and drives cost and latency.
    redFlags: Thinks tokens are words.
  - level: S
    topic: Responsible AI
    question: Your AI screening suggestion seems to favour some colleges. What do you do?
    strong: Measure outcomes by group, remove proxy features, keep humans deciding, document limits, audit regularly.
    redFlags: Ignores it.
  - level: J
    topic: Context
    question: The model forgets things said earlier in a long conversation. Why, and what can you do?
    strong: Context window limits and attention over long inputs; summarise history, retrieve relevant past turns, keep key facts in a state object.
    redFlags: Assumes it remembers everything.
  - level: S
    topic: Choosing models
    question: How do you choose between models from different providers or sizes?
    strong: Evaluate on your own test set for quality, latency and cost; consider data policies, context length, tools support.
    redFlags: Picks by hype.
- id: project-behaviour
  name: Project deep-dive and behaviour
  intro: 'Ask every candidate. Pick one project from the résumé and stay on it for 10 minutes; padded résumés fall apart by the third follow-up.
    Close by asking for their questions: good questions about the team, the codebase or how work is reviewed are a positive signal.'
  questions:
  - level: F
    topic: Project
    question: 'Freshers: tell me about a project or assignment you''re proud of, and one thing you''d improve.'
    strong: Explains choices and trade-offs, knows the code line by line.
    redFlags: Can't explain the code in their own GitHub repo.
  - level: J
    topic: Project
    question: Draw the architecture of your last project. Which part did you build yourself?
    strong: Clear boundaries, an honest "I" vs "we", can go one level deeper on their part.
    redFlags: Only describes the team's work; vague about their own.
  - level: J
    topic: Debugging
    question: What was the hardest bug you fixed, and how did you find it?
    strong: 'A method: reproduce, narrow down, gather evidence, fix, add a test so it doesn''t return.'
    redFlags: '"I googled it", with no detail.'
  - level: J
    topic: Reflection
    question: Tell me about a decision you'd make differently now.
    strong: Specific, owns it, says what they learned.
    redFlags: Can't name one, or blames others.
  - level: J
    topic: Production
    question: How did you know your feature worked in production?
    strong: Metrics, logs, alerts, user feedback, a rollback plan.
    redFlags: '"QA tested it."'
  - level: J
    topic: Teamwork
    question: Tell me about a disagreement with a teammate or lead.
    strong: Listened, used data, reached a decision, kept the relationship.
    redFlags: Still resentful, or never disagrees.
  - level: F
    topic: Learning
    question: What have you learned recently on your own?
    strong: A concrete topic, how they learned it, something they built.
    redFlags: '"Nothing lately."'
  - level: F
    topic: Motivation
    question: Why CodeWalnut, and what do you want to be doing in two years?
    strong: Knows what we do; realistic goals that fit the role.
    redFlags: A generic answer that fits any company.
  - level: F
    topic: Projects
    question: Walk me through your final-year or best project. What part did you build yourself?
    strong: Clear problem, own contribution, technical choices with reasons, one hard problem solved, what they'd improve.
    redFlags: Only describes the idea; says "we" throughout.
  - level: F
    topic: Learning
    question: What is the last thing you learned that wasn't part of your course?
    strong: Specific, self-driven, something built or practised.
    redFlags: Nothing.
  - level: F
    topic: Mistakes
    question: Tell me about a mistake you made and what you learned.
    strong: Owns it, explains the impact, what they changed afterwards.
    redFlags: Blames others or claims no mistakes.
  - level: F
    topic: Teamwork
    question: Describe a time a teammate didn't do their part. What did you do?
    strong: Talked to them, understood why, adjusted the plan, escalated only if needed, kept it professional.
    redFlags: Did everything alone and complained.
  - level: F
    topic: Motivation
    question: Why do you want to work at a services company like CodeWalnut?
    strong: Variety of clients and stacks, learning fast, working with customers; realistic about deadlines.
    redFlags: No idea what the company does.
  - level: J
    topic: Ownership
    question: Tell me about something you owned end to end, from idea to production.
    strong: Requirements, design, implementation, testing, release, monitoring and follow-up; measurable result.
    redFlags: Only coded a ticket.
  - level: J
    topic: Pressure
    question: Describe a tight deadline you met. What did you cut or change?
    strong: Prioritised scope, communicated early, kept quality on what mattered, followed up on deferred work.
    redFlags: Worked all night with no plan.
  - level: J
    topic: Feedback
    question: Tell me about feedback that was hard to hear. What did you do with it?
    strong: Listened, asked for examples, changed behaviour, shows maturity.
    redFlags: Defensive.
  - level: J
    topic: Clients
    question: Tell me about a difficult client or stakeholder situation.
    strong: Understood their goal, managed expectations, communicated clearly, found a workable outcome.
    redFlags: Speaks badly of the client.
  - level: J
    topic: Architecture
    question: Draw the architecture of the system you work on now. Where would it break first under 10x load?
    strong: Clear components and data flow; identifies a real bottleneck with reasons.
    redFlags: Can't draw their own system.
  - level: J
    topic: Debugging story
    question: Tell me about the hardest bug you fixed.
    strong: Clear symptoms, systematic investigation, root cause, fix, prevention (tests, monitoring).
    redFlags: Found it by luck and can't explain the cause.
  - level: S
    topic: Leadership
    question: Tell me about a time you changed how your team works.
    strong: Saw a problem, proposed a change, got buy-in, measured the result.
    redFlags: Only followed instructions.
  - level: S
    topic: Trade-offs
    question: Tell me about a technical decision you made that turned out wrong. What did you do?
    strong: Explains the context, how they noticed, how they corrected course, what they'd do differently.
    redFlags: Never wrong.
  - level: S
    topic: Mentoring
    question: How have you helped a junior developer grow?
    strong: 'Specific person and actions: pairing, reviews, stretch tasks, feedback; visible progress.'
    redFlags: Generic statements.
  - level: S
    topic: Conflict
    question: How did you handle a disagreement with your manager or tech lead?
    strong: Raised it privately with data, listened, committed to the decision or escalated respectfully.
    redFlags: Ignored the decision.
  - level: S
    topic: Impact
    question: What is the most valuable thing you delivered for a business, in numbers?
    strong: Clear before and after (revenue, cost, time saved, incidents reduced) and their role.
    redFlags: Can't connect work to impact.
  - level: J
    topic: Résumé check
    question: Pick one technology on your résumé and tell me something non-obvious about it.
    strong: 'Real depth: an internal detail, a pitfall they hit, a trade-off.'
    redFlags: Only surface definitions; résumé inflation.
  - level: F
    topic: Availability
    question: Are you comfortable working from the office or client sites, and with occasional late calls for clients in other time zones?
    strong: Honest, clear answer; asks sensible questions.
    redFlags: Vague or surprised by basic expectations.
  - level: J
    topic: Goals
    question: Where do you want to be in two or three years, and how does this role help?
    strong: Realistic growth plan linked to the role.
    redFlags: No direction, or plans to leave soon.
  - level: S
    topic: Questions
    question: What questions do you have for us?
    strong: Thoughtful questions about the team, product, engineering practices, growth.
    redFlags: None, or only about leave and salary.
  - level: J
    topic: Estimation
    question: Tell me about a time your estimate was badly off. What happened?
    strong: Explains why, how they communicated, what they changed in how they estimate.
    redFlags: Blames requirements entirely.
  - level: S
    topic: Hiring bar
    question: If you could change one thing about your current team, what would it be and why?
    strong: Constructive, specific, shows judgement.
    redFlags: Complains about people.
