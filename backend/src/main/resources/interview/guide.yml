# CodeWalnut interview questions (staff only; never shown to candidates or clients).
# Generated from a reviewed guide; edit freely. Levels: F = fresher, J = 1–3 years, S = 3+ years.
howTo:
- 'A 60-minute technical round: 5 minutes intro, 10 minutes project deep-dive, 30 minutes core questions or live coding, 10 minutes design or
  a scenario, 5 minutes for their questions.'
- Open the candidate's test result first. Ask about one question they got wrong and one they got right; a genuine candidate can explain both.
- Pick 6–8 questions at the candidate's level (F = fresher, J = 1–3 years, S = 3+ years). Start one level below and move up while the answers
  stay strong.
- Ask "walk me through" or "what would you do if", then follow up with "why" and "what breaks". Depth shows in the second and third answer.
- 'Score each question 1–4 straight after the answer and note one line of evidence. Hire bar: an average of 3 or more on the core questions, nothing
  below 2 on the role''s must-haves, and a clear yes on the project deep-dive. The score guides the panel; the panel decides.'
scale:
- score: 4
  label: Strong
  evidence: Correct, explains trade-offs, gives a real example, handles the follow-up unprompted.
- score: 3
  label: Good
  evidence: Correct with small gaps; gets there with one hint.
- score: 2
  label: Weak
  evidence: Knows the term but not how or why; needs several hints.
- score: 1
  label: 'No'
  evidence: Wrong, guesses confidently, or can't attempt it.
