id: generate-subsets
topic: code-recursion
difficulty: MEDIUM
title: "All subsets"
statement: |
  Given N distinct integers, print every subset. Inside a subset, print the numbers in increasing order. Print the subsets in lexicographic order of these lists, with the empty subset first, written as a single dash (-).
input: |
  The first line has N. The second line has N distinct integers.
output: |
  2^N lines, one subset per line.
constraints: |
  1 ≤ N ≤ 10
