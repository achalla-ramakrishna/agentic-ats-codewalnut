id: permutations
topic: code-recursion
difficulty: MEDIUM
title: "All permutations"
statement: |
  Given N distinct integers, print all their permutations in lexicographic (dictionary) order, one per line.
input: |
  The first line has N. The second line has N distinct integers.
output: |
  N! lines, numbers separated by spaces.
constraints: |
  1 ≤ N ≤ 7
