id: eval-rpn
topic: code-stacks
difficulty: MEDIUM
title: "Evaluate reverse Polish notation"
statement: |
  Evaluate an expression written in reverse Polish notation (postfix). Tokens are integers or one of the operators +, - and *. For example "2 1 + 3 *" means (2 + 1) * 3 = 9.
input: |
  One line of tokens separated by single spaces. The expression is valid.
output: |
  One integer: the value.
constraints: |
  1 ≤ tokens ≤ 10^4. Numbers are between -9 and 9. Every intermediate result fits in a 64-bit integer.
samples:
  - input: "2 1 + 3 *\n"
    output: "9\n"
  - input: "4 13 5 - -\n"
    output: "-4\n"
tests:
  - input: "7\n"
    output: "7\n"
  - input: "-3\n"
    output: "-3\n"
  - input: "1 2 -\n"
    output: "-1\n"
  - input: "3 -4 *\n"
    output: "-12\n"
  - input: "1 2 3 4 5 + + + +\n"
    output: "15\n"
  - input: "8 8 -4 -9 -4 1 4 - 5 - + -1 + 7 8 -5 9 * - 8 + 0 9 - -2 -6 -6 -7 9 + + 3 - -5 4 -1 + 0 6 9 -2 * * * -3 -9 - 6 3 + -1 2 * + 1 9 -4 -5 9 - * - - * * + + + + * + - + + - * - * -\n"
    output: "872392\n"
  - input: "4 -7 + 5 - -6 -4 2 - 9 * -2 + - * 0 -3 + 2 -4 + - + 7 -\n"
    output: "-408\n"
  - input: "9 9 * 9 * 9 * 9 * 9 *\n"
    output: "531441\n"
