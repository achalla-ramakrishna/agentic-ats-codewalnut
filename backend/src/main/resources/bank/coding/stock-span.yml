topic: code-stacks
difficulty: MEDIUM
title: "Stock span"
statement: |
  The span of a day's price is the number of consecutive days, ending today, on which the price was less than or equal to today's price (today counts). Print the span for every day.
input: |
  The first line has N. The second line has N prices.
output: |
  N integers, space-separated.
constraints: |
  1 ≤ N ≤ 10^5; 1 ≤ price ≤ 10^9.
