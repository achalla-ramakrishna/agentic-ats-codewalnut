id: generate-parentheses
topic: code-recursion
difficulty: MEDIUM
title: "Generate parentheses"
statement: |
  Print every balanced string made of N pairs of parentheses, in lexicographic order where ( comes before ).
input: |
  One line with N.
output: |
  One string per line.
constraints: |
  1 ≤ N ≤ 8
samples:
  - input: "3\n"
    output: "((()))\n(()())\n(())()\n()(())\n()()()\n"
tests:
  - input: "1\n"
    output: "()\n"
  - input: "2\n"
    output: "(())\n()()\n"
