id: anagram-check
topic: code-strings
difficulty: MEDIUM
title: "Anagrams"
statement: |
  Two words are anagrams if one can be rearranged to make the other. Given two lowercase words, print YES if they are anagrams, otherwise NO.
input: |
  Two lines, one word each.
output: |
  YES or NO.
constraints: |
  1 ≤ length of each word ≤ 10^5
samples:
  - input: "listen\nsilent\n"
    output: "YES\n"
  - input: "rat\ncar\n"
    output: "NO\n"
tests:
  - input: "a\na\n"
    output: "YES\n"
  - input: "a\nb\n"
    output: "NO\n"
  - input: "ab\na\n"
    output: "NO\n"
  - input: "aabbcc\nabcabc\n"
    output: "YES\n"
  - input: "aabbcc\nabcabd\n"
    output: "NO\n"
  - input: "\\n"
    output: "YES\n"
  - input: "night\nthing\n"
    output: "YES\n"
  - input: "aa\naaa\n"
    output: "NO\n"
