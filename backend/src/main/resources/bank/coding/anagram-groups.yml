id: anagram-groups
topic: code-hashing
difficulty: MEDIUM
title: "Anagram groups"
statement: |
  Words that are anagrams of each other form a group. Given N lowercase words, print the number of groups and the size of the largest group.
input: |
  The first line has N. The second line has N words separated by spaces.
output: |
  Two integers: the number of groups and the largest group size.
constraints: |
  1 ≤ N ≤ 10^4; each word has 1 to 20 letters.
samples:
  - input: "6\neat tea tan ate nat bat\n"
    output: "3 3\n"
tests:
  - input: "1\na\n"
    output: "1 1\n"
  - input: "3\nab ba ab\n"
    output: "1 3\n"
  - input: "4\nabc def ghi jkl\n"
    output: "4 1\n"
