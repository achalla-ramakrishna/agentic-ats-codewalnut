id: next-greater
topic: code-stacks
difficulty: MEDIUM
title: "Next greater element"
statement: |
  For each element of the array, print the first element to its right that is strictly greater. Print -1 if there is none.
input: |
  The first line has N. The second line has N integers.
output: |
  N integers, space-separated.
constraints: |
  1 ≤ N ≤ 10^5. A monotonic stack gives O(N).
