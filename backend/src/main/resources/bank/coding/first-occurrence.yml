id: first-occurrence
topic: code-sorting
difficulty: EASY
title: "First position of a value"
statement: |
  Given a sorted array of N integers and Q queries, answer each query X with the first position (starting at 0) where X appears, or -1 if X is not in the array.
input: |
  The first line has N and Q. The second line has N integers in non-decreasing order. Each of the next Q lines has X.
output: |
  Q lines, one answer per query.
constraints: |
  1 ≤ N, Q ≤ 10^5. Use binary search: O(log N) per query.
samples:
  - input: "6 3\n1 2 2 2 5 7\n2\n5\n3\n"
    output: "1\n4\n-1\n"
tests:
  - input: "1 2\n4\n4\n5\n"
    output: "0\n-1\n"
  - input: "5 2\n3 3 3 3 3\n3\n1\n"
    output: "0\n-1\n"
