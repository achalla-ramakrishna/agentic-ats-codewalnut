id: char-frequency
topic: code-strings
difficulty: EASY
title: "Letter frequency"
statement: |
  Given a string of lowercase letters, print each letter that appears in it, in alphabetical order, with how many times it appears.
input: |
  One line with the string.
output: |
  One line per letter that appears: the letter, a space, and its count.
constraints: |
  1 ≤ length ≤ 10^5
samples:
  - input: "banana\n"
    output: "a 3\nb 1\nn 2\n"
tests:
  - input: "a\n"
    output: "a 1\n"
  - input: "zzzz\n"
    output: "z 4\n"
  - input: "abcdefghijklmnopqrstuvwxyz\n"
    output: "a 1\nb 1\nc 1\nd 1\ne 1\nf 1\ng 1\nh 1\ni 1\nj 1\nk 1\nl 1\nm 1\nn 1\no 1\np 1\nq 1\nr 1\ns 1\nt 1\nu 1\nv 1\nw 1\nx 1\ny 1\nz 1\n"
  - input: "mississippi\n"
    output: "i 4\nm 1\np 2\ns 4\n"
  - input: "\n"
    output: "a 6706\nb 6598\nc 6696\n"
  - input: "codewalnut\n"
    output: "a 1\nc 1\nd 1\ne 1\nl 1\nn 1\no 1\nt 1\nu 1\nw 1\n"
  - input: "aab\n"
    output: "a 2\nb 1\n"
  - input: "qwertyqwerty\n"
    output: "e 2\nq 2\nr 2\nt 2\nw 2\ny 2\n"
