    output: "0\n"
  - input: "1\n4\n5\n"
    output: "-1\n"
  - input: "2\n1 2\n2 1\n"
    output: "1\n"
  - input: "4\n1 1 1 1\n1 1 1 1\n"
    output: "0\n"
