id: gas-station
topic: code-greedy
difficulty: HARD
title: "Gas station circuit"
statement: |
  N gas stations stand on a circular road. Station i gives gas[i] litres, and driving from station i to the next one uses cost[i] litres. Starting with an empty tank, print the smallest station index (starting at 0) from which you can drive all the way around once, or -1 if no station works.
input: |
  The first line has N. The second line has gas[0..N-1]. The third line has cost[0..N-1].
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ gas, cost ≤ 10^4. An O(N) greedy solution exists.
samples:
  - input: "5\n1 2 3 4 5\n3 4 5 1 2\n"
    output: "3\n"
  - input: "3\n2 3 4\n3 4 3\n"
    output: "-1\n"
tests:
