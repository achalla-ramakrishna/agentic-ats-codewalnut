id: top-k-frequent
topic: code-heaps
difficulty: MEDIUM
title: "Top K frequent values"
statement: |
  Print the K values that appear most often, most frequent first. When two values appear equally often, the smaller value comes first.
input: |
  The first line has N and K. The second line has N integers. K is at most the number of distinct values.
output: |
  K integers separated by spaces.
constraints: |
  1 ≤ N ≤ 10^5
samples:
  - input: "6 2\n1 1 1 2 2 3\n"
    output: "1 2\n"
  - input: "1 1\n7\n"
    output: "7\n"
tests:
  - input: "4 2\n4 4 3 3\n"
    output: "3 4\n"
  - input: "5 3\n5 4 3 2 1\n"
    output: "1 2 3\n"
  - input: "7 1\n2 2 3 3 3 2 1\n"
    output: "2\n"
