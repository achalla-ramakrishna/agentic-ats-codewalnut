id: running-median
topic: code-heaps
difficulty: HARD
title: "Running median"
statement: |
  Numbers arrive one at a time. After each one, print the median of the numbers so far. When the count is even, print the smaller of the two middle numbers.
input: |
  The first line has N. The second line has the N numbers in arrival order.
output: |
  N integers separated by spaces.
constraints: |
  1 ≤ N ≤ 10^5. Sorting after every number is too slow; use two heaps.
samples:
  - input: "5\n5 15 1 3 8\n"
    output: "5 5 5 3 5\n"
tests:
  - input: "1\n4\n"
    output: "4\n"
  - input: "2\n2 1\n"
    output: "2 1\n"
  - input: "4\n1 2 3 4\n"
    output: "1 1 2 2\n"
  - input: "6\n5 5 5 5 5 5\n"
    output: "5 5 5 5 5 5\n"
