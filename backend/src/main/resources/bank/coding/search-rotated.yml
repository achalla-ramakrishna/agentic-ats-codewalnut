id: search-rotated
topic: code-sorting
difficulty: MEDIUM
title: "Search in a rotated sorted array"
statement: |
  A sorted array of distinct integers was rotated at an unknown point (for example 0 1 2 4 5 6 7 became 4 5 6 7 0 1 2). Given the array and Q targets, print the position of each target (starting at 0), or -1 if it is not there.
input: |
  The first line has N and Q. The second line has the N integers. Each of the next Q lines has a target.
output: |
  Q lines.
constraints: |
  1 ≤ N, Q ≤ 10^5; values are distinct. Aim for O(log N) per query.
samples:
  - input: "7 3\n4 5 6 7 0 1 2\n0\n3\n4\n"
    output: "4\n-1\n0\n"
tests:
  - input: "1 2\n5\n5\n6\n"
    output: "0\n-1\n"
  - input: "2 2\n2 1\n1\n2\n"
    output: "1\n0\n"
  - input: "5 5\n1 2 3 4 5\n1\n3\n5\n0\n6\n"
    output: "0\n2\n4\n-1\n-1\n"
