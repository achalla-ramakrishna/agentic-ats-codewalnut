id: two-sum
topic: code-hashing
difficulty: EASY
title: "Two sum"
statement: |
  Given N integers and a target T, find two different positions i < j with a[i] + a[j] = T. If several pairs work, choose the one with the smallest j, and among those the smallest i. Positions start at 0. If no pair exists, print -1.
input: |
  The first line has N and T. The second line has N integers.
output: |
  Two integers i and j, or -1.
constraints: |
  2 ≤ N ≤ 10^5; -10^9 ≤ values, T ≤ 10^9. A hash map gives an O(N) solution.
samples:
  - input: "4 9\n2 7 11 15\n"
    output: "0 1\n"
  - input: "3 10\n1 2 3\n"
    output: "-1\n"
