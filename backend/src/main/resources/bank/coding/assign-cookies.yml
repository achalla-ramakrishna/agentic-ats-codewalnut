id: assign-cookies
topic: code-greedy
difficulty: EASY
title: "Assign cookies"
statement: |
  Each child i is happy with a cookie of size at least greed[i]. Each child gets at most one cookie and each cookie goes to at most one child. Print the largest number of happy children.
input: |
  The first line has N (children) and M (cookies). The second line has N greed values. The third line has M cookie sizes.
output: |
  One integer.
constraints: |
  1 ≤ N, M ≤ 10^5; 1 ≤ values ≤ 10^9. Sort both lists and match greedily.
