id: merge-intervals
topic: code-sorting
difficulty: MEDIUM
title: "Merge overlapping intervals"
statement: |
  Given N intervals [start, end], merge all intervals that overlap or touch (for example [1,3] and [3,5] become [1,5]) and print the result sorted by start.
input: |
  The first line has N. Each of the next N lines has start and end (start ≤ end).
output: |
  One line per merged interval: start and end.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ start ≤ end ≤ 10^9.
samples:
  - input: "4\n1 3\n2 6\n8 10\n15 18\n"
    output: "1 6\n8 10\n15 18\n"
  - input: "2\n1 4\n4 5\n"
    output: "1 5\n"
tests:
  - input: "1\n5 5\n"
    output: "5 5\n"
  - input: "3\n1 2\n3 4\n5 6\n"
    output: "1 2\n3 4\n5 6\n"
  - input: "3\n1 10\n2 3\n4 5\n"
    output: "1 10\n"
  - input: "4\n5 6\n1 2\n2 3\n10 10\n"
