id: reverse-words
topic: code-strings
difficulty: EASY
title: "Reverse the words"
statement: |
  Given a line of words separated by single spaces, print the words in reverse order.
input: |
  One line of words (letters and digits only), separated by single spaces.
output: |
  The words in reverse order, separated by single spaces.
constraints: |
  1 ≤ number of words ≤ 1000; each word has 1 to 20 characters.
samples:
  - input: "the sky is blue\n"
    output: "blue is sky the\n"
  - input: "hello\n"
    output: "hello\n"
