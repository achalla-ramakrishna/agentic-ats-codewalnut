id: rotate-array
topic: code-arrays
difficulty: EASY
title: "Rotate an array"
statement: |
  Rotate an array of N integers to the right by K steps and print it. Rotating [1 2 3 4 5] right by 2 gives [4 5 1 2 3].
input: |
  The first line has N and K. The second line has N integers.
output: |
  The rotated array, space-separated.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ K ≤ 10^9 (K can be larger than N).
samples:
  - input: "5 2\n1 2 3 4 5\n"
    output: "4 5 1 2 3\n"
  - input: "3 4\n7 8 9\n"
    output: "9 7 8\n"
tests:
  - input: "1 100\n42\n"
    output: "42\n"
  - input: "4 0\n1 2 3 4\n"
    output: "1 2 3 4\n"
  - input: "4 4\n1 2 3 4\n"
    output: "1 2 3 4\n"
  - input: "6 1000000000\n1 2 3 4 5 6\n"
    output: "3 4 5 6 1 2\n"
