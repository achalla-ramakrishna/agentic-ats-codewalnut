id: longest-unique-substring
topic: code-two-pointers
difficulty: MEDIUM
title: "Longest substring without repeats"
statement: |
  Print the length of the longest substring (contiguous) that has no repeated characters.
input: |
  One line with the string (letters, digits and symbols, no spaces).
output: |
  One integer.
constraints: |
  1 ≤ length ≤ 10^5. A sliding window gives O(N).
samples:
  - input: "abcabcbb\n"
    output: "3\n"
  - input: "bbbbb\n"
    output: "1\n"
tests:
  - input: "a\n"
    output: "1\n"
  - input: "pwwkew\n"
    output: "3\n"
  - input: "abcdefg\n"
    output: "7\n"
  - input: "dvdf\n"
    output: "3\n"
  - input: "abba\n"
    output: "2\n"
  - input: "\n"
    output: "26\n"
  - input: "\n"
    output: "2\n"
  - input: "tmmzuxt\n"
    output: "5\n"
