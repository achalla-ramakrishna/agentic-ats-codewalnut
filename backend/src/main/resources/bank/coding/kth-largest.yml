id: kth-largest
topic: code-heaps
difficulty: MEDIUM
title: "Kth largest in a stream"
statement: |
  Numbers arrive one at a time. After each number arrives, print the K-th largest number seen so far, or -1 while fewer than K numbers have arrived.
input: |
  The first line has N and K. The second line has the N numbers in arrival order.
output: |
  N integers separated by spaces.
constraints: |
  1 ≤ K ≤ N ≤ 10^5. Keep a min-heap of the K largest numbers.
samples:
  - input: "5 3\n4 5 8 2 3\n"
    output: "-1 -1 4 4 4\n"
tests:
  - input: "1 1\n7\n"
    output: "7\n"
  - input: "3 1\n1 2 3\n"
    output: "1 2 3\n"
  - input: "3 3\n3 2 1\n"
    output: "-1 -1 1\n"
