id: sum-of-digits
topic: code-basics
difficulty: EASY
title: "Sum of digits"
statement: |
  Given a non-negative integer N, print the sum of its digits.
input: |
  One line with the integer N.
output: |
  One integer: the sum of the digits of N.
constraints: |
  0 ≤ N ≤ 10^18 (it may not fit in a 32-bit int).
samples:
  - input: "1234\n"
    output: "10\n"
  - input: "0\n"
    output: "0\n"
tests:
  - input: "9\n"
    output: "9\n"
  - input: "1000000000000000000\n"
    output: "1\n"
  - input: "999999999999999999\n"
    output: "162\n"
  - input: "505\n"
    output: "10\n"
  - input: "10\n"
    output: "1\n"
  - input: "123456789012345678\n"
    output: "81\n"
  - input: "7\n"
    output: "7\n"
  - input: "86400\n"
    output: "18\n"
