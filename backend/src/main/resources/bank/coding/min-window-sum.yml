    output: "1\n"
  - input: "1 2\n1\n"
    output: "0\n"
  - input: "5 15\n1 2 3 4 5\n"
    output: "5\n"
  - input: "8 11\n1 1 1 1 1 1 1 11\n"
    output: "1\n"
