id: min-window-sum
topic: code-two-pointers
difficulty: MEDIUM
title: "Shortest subarray with sum at least S"
statement: |
  Given N positive integers and a number S, print the length of the shortest contiguous subarray whose sum is at least S. Print 0 if no such subarray exists.
input: |
  The first line has N and S. The second line has N positive integers.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; 1 ≤ value ≤ 10^4; 1 ≤ S ≤ 10^9.
samples:
  - input: "6 7\n2 3 1 2 4 3\n"
    output: "2\n"
  - input: "3 100\n1 2 3\n"
    output: "0\n"
