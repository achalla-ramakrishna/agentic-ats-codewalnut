id: first-unique-char
topic: code-hashing
difficulty: EASY
title: "First unique character"
statement: |
  Given a string of lowercase letters, print the position of the first character that appears exactly once. Positions start at 0. Print -1 if there is none.
input: |
  One line with the string.
output: |
  One integer.
constraints: |
  1 ≤ length ≤ 10^5
samples:
  - input: "leetcode\n"
    output: "0\n"
  - input: "aabb\n"
    output: "-1\n"
tests:
  - input: "z\n"
    output: "0\n"
  - input: "abcabcd\n"
    output: "6\n"
  - input: "aabbccdde\n"
    output: "8\n"
  - input: "dddccdbba\n"
    output: "8\n"
  - input: "\n"
    output: "20000\n"
  - input: "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz\n"
    output: "-1\n"
  - input: "loveleetcode\n"
    output: "2\n"
  - input: "xxyz\n"
    output: "2\n"
