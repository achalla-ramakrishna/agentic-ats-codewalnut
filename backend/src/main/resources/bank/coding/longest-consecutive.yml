id: longest-consecutive
topic: code-hashing
difficulty: MEDIUM
title: "Longest consecutive run"
statement: |
  Given N integers in any order, print the length of the longest run of consecutive values that all appear in the array (for example 1, 2, 3, 4). Duplicates count once.
input: |
  The first line has N. The second line has N integers.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; -10^9 ≤ value ≤ 10^9. Aim for O(N) with a hash set (sorting also passes).
samples:
  - input: "6\n100 4 200 1 3 2\n"
    output: "4\n"
  - input: "10\n0 3 7 2 5 8 4 6 0 1\n"
    output: "9\n"
tests:
  - input: "1\n5\n"
    output: "1\n"
  - input: "3\n1 1 1\n"
    output: "1\n"
  - input: "4\n10 30 20 40\n"
    output: "1\n"
  - input: "5\n-2 -1 0 1 2\n"
    output: "5\n"
