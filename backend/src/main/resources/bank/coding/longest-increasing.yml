title: "Longest increasing subsequence"
statement: |
  Print the length of the longest strictly increasing subsequence of the array (elements keep their order but may be skipped).
input: |
  The first line has N. The second line has N integers.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5. O(N^2) is too slow for the largest tests; use the O(N log N) method with binary search.
