id: prime-check
topic: code-basics
difficulty: EASY
title: "Is it prime?"
statement: |
  For each of T numbers, print YES if it is a prime number and NO otherwise.
input: |
  The first line has T. Each of the next T lines has one integer X.
output: |
  T lines, each YES or NO.
constraints: |
  1 ≤ T ≤ 1000; 1 ≤ X ≤ 10^9. Checking divisors up to √X is fast enough.
