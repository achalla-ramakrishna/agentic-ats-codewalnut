id: palindrome
topic: code-strings
difficulty: EASY
title: "Palindrome check"
statement: |
  A phrase is a palindrome if, after keeping only letters and digits and ignoring upper/lower case, it reads the same forwards and backwards. Print YES if the given line is a palindrome, otherwise NO.
input: |
  One line of text (it may contain spaces and punctuation).
output: |
  YES or NO.
constraints: |
  1 ≤ length ≤ 10^5
samples:
  - input: "A man, a plan, a canal: Panama\n"
    output: "YES\n"
  - input: "race a car\n"
    output: "NO\n"
tests:
  - input: "a\n"
    output: "YES\n"
  - input: "ab\n"
    output: "NO\n"
  - input: "!!\n"
    output: "YES\n"
  - input: "No lemon, no melon\n"
    output: "YES\n"
  - input: "Was it a car or a cat I saw?\n"
    output: "YES\n"
  - input: "0P\n"
    output: "NO\n"
  - input: "abcba\n"
    output: "YES\n"
  - input: "\n"
    output: "NO\n"
  - input: "\n"
    output: "YES\n"
