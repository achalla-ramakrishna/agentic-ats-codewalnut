id: connected-components
topic: code-trees-graphs
difficulty: MEDIUM
title: "Connected components"
statement: |
  An undirected graph has N nodes numbered 1 to N and M edges. Print the number of connected components (a node with no edges is a component by itself).
input: |
  The first line has N and M. Each of the next M lines has two nodes A and B joined by an edge.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ M ≤ 2·10^5.
