id: merge-k-sorted
topic: code-heaps
difficulty: MEDIUM
title: "Merge K sorted lists"
statement: |
  Merge K sorted lists into one sorted list and print it. If all lists are empty, print an empty line.
input: |
  The first line has K. Each of the next K lines starts with the list's length L, followed by L integers in non-decreasing order.
output: |
  All numbers in non-decreasing order, separated by spaces.
constraints: |
  1 ≤ K ≤ 10^4; total numbers ≤ 10^5. A min-heap of the list heads gives O(N log K).
samples:
  - input: "3\n3 1 4 5\n3 1 3 4\n2 2 6\n"
    output: "1 1 2 3 4 4 5 6\n"
tests:
  - input: "1\n1 5\n"
    output: "5\n"
  - input: "2\n0\n2 1 2\n"
    output: "1 2\n"
  - input: "3\n2 -1 -1\n2 -1 -1\n1 -1\n"
    output: "-1 -1 -1 -1 -1\n"
