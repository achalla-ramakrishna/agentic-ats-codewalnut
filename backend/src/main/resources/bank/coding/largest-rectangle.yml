id: largest-rectangle
topic: code-stacks
difficulty: HARD
title: "Largest rectangle in a histogram"
statement: |
  A histogram has N bars of width 1 with the given heights. Print the area of the largest rectangle that fits entirely inside the histogram.
input: |
  The first line has N. The second line has N heights.
output: |
  One integer: the largest area.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ height ≤ 10^9 (the area needs 64 bits). Use a stack for O(N).
samples:
  - input: "6\n2 1 5 6 2 3\n"
    output: "10\n"
  - input: "2\n2 4\n"
    output: "4\n"
