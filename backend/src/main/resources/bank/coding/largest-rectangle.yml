  - input: "1\n0\n"
    output: "0\n"
  - input: "1\n7\n"
    output: "7\n"
  - input: "5\n1 1 1 1 1\n"
    output: "5\n"
  - input: "5\n5 4 3 2 1\n"
    output: "9\n"
  - input: "7\n6 2 5 4 5 1 6\n"
