id: max-subarray
topic: code-arrays
difficulty: MEDIUM
title: "Maximum subarray sum"
statement: |
  Given N integers, find the largest possible sum of a non-empty contiguous subarray.
input: |
  The first line has N. The second line has N integers.
output: |
  One integer: the maximum subarray sum.
constraints: |
  1 ≤ N ≤ 10^5; -10^4 ≤ value ≤ 10^4. An O(N^2) solution is too slow for the largest tests.
samples:
  - input: "9\n-2 1 -3 4 -1 2 1 -5 4\n"
    output: "6\n"
  - input: "3\n-3 -1 -2\n"
    output: "-1\n"
