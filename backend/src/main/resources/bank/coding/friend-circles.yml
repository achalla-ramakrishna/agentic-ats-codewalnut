id: friend-circles
topic: code-heaps
difficulty: HARD
title: "Friend circles (union-find)"
statement: |
  There are N people numbered 1 to N. Process Q operations in order: "union A B" makes A and B friends (friendship is transitive: friends of friends are in the same circle), and "find A B" asks whether A and B are in the same circle. Print YES or NO for each find.
input: |
  The first line has N and Q. Each of the next Q lines has an operation.
output: |
  One line per find: YES or NO.
constraints: |
  1 ≤ N, Q ≤ 2·10^5. Use union-find (disjoint set union) with path compression.
samples:
  - input: "5 6\nunion 1 2\nfind 1 2\nfind 1 3\nunion 2 3\nfind 1 3\nfind 4 5\n"
    output: "YES\nNO\nYES\nNO\n"
tests:
  - input: "1 1\nfind 1 1\n"
    output: "YES\n"
  - input: "2 2\nfind 1 2\nfind 2 1\n"
    output: "NO\nNO\n"
  - input: "3 3\nunion 1 2\nunion 2 3\nfind 3 1\n"
    output: "YES\n"
