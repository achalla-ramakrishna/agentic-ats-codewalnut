id: meeting-rooms
topic: code-greedy
difficulty: MEDIUM
title: "Meeting rooms"
statement: |
  Given N meetings with start and end times, print the smallest number of rooms needed so that no two meetings in the same room overlap. A meeting ending at time t and another starting at time t can share a room.
input: |
  The first line has N. Each of the next N lines has start and end (start < end).
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ start < end ≤ 10^9.
