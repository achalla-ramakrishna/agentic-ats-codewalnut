id: kth-smallest
topic: code-sorting
difficulty: EASY
title: "Kth smallest"
statement: |
  Given N integers and K, print the K-th smallest value (counting duplicates; K = 1 is the minimum).
input: |
  The first line has N and K. The second line has N integers.
output: |
  One integer.
constraints: |
  1 ≤ K ≤ N ≤ 10^5
