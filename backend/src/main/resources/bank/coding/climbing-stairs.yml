id: climbing-stairs
topic: code-dp
difficulty: EASY
title: "Climbing stairs"
statement: |
  You climb a staircase of N steps, taking 1 or 2 steps at a time. Print the number of different ways to reach the top, modulo 1,000,000,007.
input: |
  One line with N.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^6
samples:
  - input: "2\n"
    output: "2\n"
  - input: "3\n"
    output: "3\n"
tests:
  - input: "1\n"
    output: "1\n"
  - input: "4\n"
    output: "5\n"
  - input: "10\n"
    output: "89\n"
  - input: "45\n"
    output: "836311896\n"
  - input: "100\n"
    output: "782204094\n"
  - input: "1000000\n"
    output: "534400663\n"
  - input: "91\n"
    output: "965550172\n"
  - input: "12345\n"
    output: "198331757\n"
