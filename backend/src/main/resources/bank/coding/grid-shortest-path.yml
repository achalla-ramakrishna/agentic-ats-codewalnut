id: grid-shortest-path
topic: code-trees-graphs
difficulty: MEDIUM
title: "Shortest path in a maze"
statement: |
  A maze is a grid of open cells (.), walls (#), one start (S) and one exit (E). Each step moves up, down, left or right into a non-wall cell. Print the fewest steps from S to E, or -1 if E can't be reached.
input: |
  The first line has R and C. Each of the next R lines has C characters.
output: |
  One integer.
constraints: |
  1 ≤ R, C ≤ 500; R × C ≥ 2. Use breadth-first search.
samples:
  - input: "3 4\nS..#\n.#..\n...E\n"
    output: "5\n"
  - input: "2 2\nS#\n#E\n"
    output: "-1\n"
tests:
  - input: "1 2\nSE\n"
    output: "1\n"
  - input: "1 3\nS#E\n"
    output: "-1\n"
  - input: "3 3\nS..\n##.\nE..\n"
    output: "6\n"
  - input: "40 40\n..#.....#.....##...##..##..##.##....#.#.\n......#...#.......#.....#.#.......#....#\n.##..##....#...#.#...#.#...#......###...\n.....#...#.....#...#........#.#...#...#.\n.#...###.................#..#...##..#.#.\n.#.......#.#.#..###.#....##..#.#.......#\n..#..#........##......##.#.###.#####..#.\n.#..#.#...#....#.........#.#...##.......\n....#...##.......#.......#.....#..#.#...\n##.......###.#.###.#.......##....#.##...\n..#..##...E.#..........##.##.##....#...#\n.#...........#...#.#......#..#.....#.#.#\n......##.......#...#.#......#.......#...\n.................####....#....#..#.#.##.\n.......#...#..##....#.##......##.#....#.\n#..........#...#..#..#.#..##.....#..#...\n..#.....#........#..#..#..#..#...#.#.#.#\n.#..##.#....##..##...#......#.....#.##..\n..##......###..##..........#.......#....\n..#........##....#.###.#....#.......#.#.\n..##..#..#....#.#...#...............#...\n...#........#....#.....###....#..#......\n..#.##.......#.....#...#.###.#.#..##....\n..#......#.#.####.##.#.#.....#...S...##.\n........#..#.#..........#.....#.#.......\n#...##..............#...#.#....###..#...\n...#......#.#......#....#..##........##.\n.#...#.#.#.#...##.............##....#...\n....#..###.#..#.#.#....#.#...#.......#..\n.#..#....#.#.......##.........#.#...#.#.\n.#.#...#..##..#.....##.....##.#.#.#.#..#\n....#.......#.......##.#......#.....#...\n..........###..##.##.###....#........#..\n.#........###......##.#..##.#....##....#\n.....#..........#.....##...#....#.....#.\n.#....##..#...###....#.#..#..#.##..##...\n#..#..#..#.#.....##....##.#..#.#...#....\n.#......##.##..#.........#...##...##...#\n............#.........#.#......#.##.#.#.\n.....#........#....#.............#..#..#\n"
