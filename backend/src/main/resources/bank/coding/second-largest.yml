id: second-largest
topic: code-arrays
difficulty: EASY
title: "Second largest"
statement: |
  Given N integers, print the second largest distinct value. If all values are the same, print -1.
input: |
  The first line has N. The second line has N integers.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; -10^9 ≤ value ≤ 10^9
