id: range-sums
topic: code-arrays
difficulty: MEDIUM
title: "Range sum queries"
statement: |
  Given an array of N integers and Q queries, answer each query (L, R) with the sum of the elements from position L to position R inclusive (positions start at 1).
input: |
  The first line has N and Q. The second line has N integers. Each of the next Q lines has L and R.
output: |
  Q lines, one sum per query.
constraints: |
  1 ≤ N, Q ≤ 10^5; -10^9 ≤ value ≤ 10^9 (sums need 64-bit integers). Summing each range one by one is too slow; use prefix sums.
samples:
  - input: "5 3\n1 2 3 4 5\n1 3\n2 5\n4 4\n"
    output: "6\n14\n4\n"
tests:
  - input: "1 1\n7\n1 1\n"
    output: "7\n"
  - input: "3 2\n-1 -2 -3\n1 3\n2 2\n"
    output: "-6\n-2\n"
  - input: "4 1\n1000000000 1000000000 1000000000 1000000000\n1 4\n"
    output: "4000000000\n"
