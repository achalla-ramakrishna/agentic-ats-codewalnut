id: coin-change
topic: code-dp
difficulty: MEDIUM
title: "Coin change: fewest coins"
statement: |
  Given coin values (an unlimited number of each) and an amount A, print the fewest coins that add up to exactly A, or -1 if it can't be done.
input: |
  The first line has N and A. The second line has the N coin values.
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 100; 0 ≤ A ≤ 10^4; 1 ≤ coin ≤ 10^4. Greedy (largest coin first) is wrong for some coin sets.
samples:
  - input: "3 11\n1 2 5\n"
    output: "3\n"
  - input: "1 3\n2\n"
    output: "-1\n"
tests:
  - input: "1 0\n7\n"
    output: "0\n"
  - input: "3 6\n1 3 4\n"
    output: "2\n"
  - input: "2 7\n2 4\n"
    output: "-1\n"
  - input: "4 10000\n1 7 31 497\n"
    output: "26\n"
  - input: "20 9999\n259 56 342 10 458 159 426 68 315 259 414 428 230 149 438 339 118 425 333 307\n"
    output: "22\n"
  - input: "5 63\n25 10 5 21 1\n"
    output: "3\n"
  - input: "1 10000\n1\n"
    output: "10000\n"
  - input: "3 1\n2 3 5\n"
    output: "-1\n"
