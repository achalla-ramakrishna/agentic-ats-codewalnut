id: pair-sum-sorted
topic: code-two-pointers
difficulty: EASY
title: "Pair with a sum in a sorted array"
statement: |
  Given a sorted array of N integers and a target T, print YES if two different positions add up to T, otherwise NO.
input: |
  The first line has N and T. The second line has N integers in non-decreasing order.
output: |
  YES or NO.
constraints: |
  2 ≤ N ≤ 10^5. Use two pointers from both ends for O(N).
samples:
  - input: "5 9\n1 2 4 7 11\n"
    output: "YES\n"
  - input: "4 100\n1 2 3 4\n"
    output: "NO\n"
tests:
  - input: "2 4\n2 2\n"
    output: "YES\n"
  - input: "2 4\n1 2\n"
    output: "NO\n"
  - input: "3 -3\n-5 -2 1\n"
    output: "NO\n"
  - input: "5 0\n-3 -1 0 2 4\n"
    output: "NO\n"
