id: course-order
topic: code-trees-graphs
difficulty: HARD
title: "Course order"
statement: |
  There are N courses numbered 1 to N and M rules "A B" meaning course A must be taken before course B. Print an order in which all courses can be taken. If several orders work, print the lexicographically smallest one (always take the smallest-numbered course that is available). If no order exists because the rules form a cycle, print -1.
input: |
  The first line has N and M. Each of the next M lines has A and B.
output: |
  The order as N numbers separated by spaces, or -1.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ M ≤ 2·10^5. Use Kahn's algorithm with a min-heap.
samples:
  - input: "4 3\n1 2\n1 3\n3 4\n"
    output: "1 2 3 4\n"
  - input: "2 2\n1 2\n2 1\n"
    output: "-1\n"
tests:
  - input: "1 0\n"
    output: "1\n"
  - input: "3 0\n"
    output: "1 2 3\n"
  - input: "3 2\n3 2\n2 1\n"
    output: "3 2 1\n"
  - input: "3 3\n1 2\n2 3\n3 1\n"
    output: "-1\n"
