id: knapsack
topic: code-dp
difficulty: HARD
title: "0/1 knapsack"
statement: |
  There are N items, each with a weight and a value. Choose items (each at most once) with total weight at most W so that the total value is as large as possible. Print that value.
input: |
  The first line has N and W. Each of the next N lines has an item's weight and value.
output: |
  One integer: the best total value.
constraints: |
  1 ≤ N ≤ 100; 1 ≤ W ≤ 10^4; 1 ≤ weight ≤ 10^4; 1 ≤ value ≤ 1000.
samples:
  - input: "4 7\n1 1\n3 4\n4 5\n5 7\n"
    output: "9\n"
  - input: "1 5\n6 100\n"
    output: "0\n"
