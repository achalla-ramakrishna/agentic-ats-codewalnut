id: balanced-brackets
topic: code-stacks
difficulty: EASY
title: "Balanced brackets"
statement: |
  A string of brackets ()[]{} is balanced if every opening bracket is closed by the same type, in the right order. Print YES if the string is balanced, otherwise NO.
input: |
  One line with the brackets.
output: |
  YES or NO.
constraints: |
  1 ≤ length ≤ 10^5
samples:
  - input: "{[()]}\n"
    output: "YES\n"
  - input: "([)]\n"
    output: "NO\n"
tests:
  - input: "(\n"
    output: "NO\n"
  - input: ")\n"
    output: "NO\n"
  - input: "()[]{}\n"
    output: "YES\n"
  - input: "((((((((\n"
    output: "NO\n"
  - input: "}{\n"
    output: "NO\n"
