id: run-length
topic: code-strings
difficulty: MEDIUM
title: "Run-length encoding"
statement: |
  Compress a string by replacing each run of the same character with the character followed by the length of the run. For example, aaabccdddd becomes a3b1c2d4.
input: |
  One line with a string of lowercase letters.
output: |
  The encoded string.
constraints: |
  1 ≤ length ≤ 10^5. Build the result efficiently (avoid repeated string concatenation in languages where it is slow).
samples:
  - input: "aaabccdddd\n"
    output: "a3b1c2d4\n"
  - input: "abc\n"
    output: "a1b1c1\n"
tests:
  - input: "a\n"
    output: "a1\n"
  - input: "aaaaaaaaaaaa\n"
    output: "a12\n"
  - input: "abababab\n"
    output: "a1b1a1b1a1b1a1b1\n"
  - input: "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzza\n"
    output: "z36a1\n"
  - input: "\n"
    output: "\n"
  - input: "\n"
    output: "a20000\n"
  - input: "aabbaa\n"
    output: "a2b2a2\n"
  - input: "xyzzzzy\n"
    output: "x1y1z4y1\n"
