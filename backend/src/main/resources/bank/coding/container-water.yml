id: container-water
topic: code-two-pointers
difficulty: MEDIUM
title: "Container with most water"
statement: |
  N vertical lines stand at positions 0 to N-1 with the given heights. Two lines and the ground form a container that holds water up to the shorter line. Print the largest amount of water a container can hold: (distance between the lines) × (shorter height).
input: |
  The first line has N. The second line has N heights.
output: |
  One integer.
constraints: |
  2 ≤ N ≤ 10^5; 0 ≤ height ≤ 10^4. O(N^2) is too slow for the largest tests; use two pointers.
samples:
  - input: "9\n1 8 6 2 5 4 8 3 7\n"
    output: "49\n"
  - input: "2\n1 1\n"
    output: "1\n"
tests:
  - input: "2\n0 0\n"
    output: "0\n"
  - input: "3\n1 2 1\n"
    output: "2\n"
  - input: "5\n5 4 3 2 1\n"
    output: "6\n"
  - input: "6\n1 2 3 4 5 6\n"
    output: "9\n"
