id: sort-by-frequency
topic: code-sorting
difficulty: MEDIUM
title: "Sort by frequency"
statement: |
  Sort the numbers so that more frequent values come first. Values with the same frequency are ordered from smallest to largest. Print the sorted array (each value repeated as many times as it appears).
input: |
  The first line has N. The second line has N integers.
output: |
  The sorted array, space-separated.
constraints: |
  1 ≤ N ≤ 10^5
