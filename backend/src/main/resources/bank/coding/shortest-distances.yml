id: shortest-distances
topic: code-trees-graphs
difficulty: HARD
title: "Shortest distances (Dijkstra)"
statement: |
  A directed graph has N nodes numbered 1 to N and M weighted edges. Print the length of the shortest path from node 1 to every node (0 for node 1 itself), or -1 for nodes that can't be reached.
input: |
  The first line has N and M. Each of the next M lines has A, B and W: an edge from A to B of length W.
output: |
  N integers separated by spaces.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ M ≤ 2·10^5; 1 ≤ W ≤ 10^4. Edges may repeat or loop. Use Dijkstra with a priority queue.
samples:
  - input: "4 4\n1 2 4\n1 3 1\n3 2 2\n2 4 5\n"
    output: "0 3 1 8\n"
  - input: "3 1\n2 3 7\n"
    output: "0 -1 -1\n"
tests:
  - input: "1 0\n"
    output: "0\n"
  - input: "2 1\n2 1 5\n"
    output: "0 -1\n"
  - input: "3 3\n1 2 1\n2 3 1\n1 3 5\n"
    output: "0 1 2\n"
  - input: "3 2\n1 1 3\n1 2 2\n"
    output: "0 2 -1\n"
