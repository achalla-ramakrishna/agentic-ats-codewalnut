id: number-of-islands
topic: code-trees-graphs
difficulty: MEDIUM
title: "Number of islands"
statement: |
  A grid of 1s (land) and 0s (water) is given. An island is a group of land cells connected up, down, left or right. Print the number of islands.
input: |
  The first line has R and C. Each of the next R lines has C characters, each 0 or 1.
output: |
  One integer.
constraints: |
  1 ≤ R, C ≤ 500. Recursive DFS can overflow the stack on big islands; BFS or an explicit stack is safer.
samples:
  - input: "4 5\n11000\n11000\n00100\n00011\n"
    output: "3\n"
  - input: "1 1\n0\n"
    output: "0\n"
tests:
  - input: "1 1\n1\n"
    output: "1\n"
  - input: "2 2\n10\n01\n"
    output: "2\n"
  - input: "3 3\n111\n101\n111\n"
