id: jump-game
topic: code-greedy
difficulty: MEDIUM
title: "Jump game"
statement: |
  You start at position 0 of an array. Each value is the maximum number of positions you may jump forward from there. Print YES if you can reach the last position, otherwise NO.
input: |
  The first line has N. The second line has N non-negative integers.
output: |
  YES or NO.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ value ≤ 10^5.
