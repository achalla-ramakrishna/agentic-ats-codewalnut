id: activity-selection
topic: code-greedy
difficulty: MEDIUM
title: "Most non-overlapping activities"
statement: |
  Given N activities with start and end times, print the largest number of activities one person can attend if they can't attend two at the same time. An activity may start exactly when the previous one ends.
input: |
  The first line has N. Each of the next N lines has start and end (start < end).
output: |
  One integer.
constraints: |
  1 ≤ N ≤ 10^5; 0 ≤ start < end ≤ 10^9. Sort by end time and pick greedily.
