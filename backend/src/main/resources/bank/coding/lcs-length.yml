id: lcs-length
topic: code-dp
difficulty: MEDIUM
title: "Longest common subsequence"
statement: |
  Print the length of the longest common subsequence of two strings. A subsequence keeps the order of characters but may skip some.
input: |
  Two lines, one string each (lowercase letters).
output: |
  One integer.
constraints: |
  1 ≤ length of each string ≤ 2000. An O(N·M) table is fine.
samples:
  - input: "abcde\nace\n"
    output: "3\n"
  - input: "abc\ndef\n"
    output: "0\n"
tests:
  - input: "a\na\n"
    output: "1\n"
  - input: "a\nb\n"
    output: "0\n"
  - input: "abc\nabc\n"
    output: "3\n"
  - input: "abcbdab\nbdcaba\n"
    output: "4\n"
  - input: "\\n"
    output: "973\n"
  - input: "\\n"
    output: "300\n"
  - input: "aaaa\naa\n"
    output: "2\n"
  - input: "xyz\nzyx\n"
    output: "1\n"
